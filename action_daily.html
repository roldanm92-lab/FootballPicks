rk\n\nThere are many ways to build NFL projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, NFL handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NFL projections are projection blends of several of our key betting experts, including Sean Koerner and Stuckey. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NFL betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NFL projections to be aware of news and injuries.\n\nThe most important position in the NFL is quarterback, and it's not unreasonable to see a line move 4-5 points or more if a star is suddenly ruled out on a Sunday morning. Other positions are less valuable to the spread, which might surprise a casual gambler. Notably, running backs -- even the very best ones that are popular in fantasy football -- rarely move betting lines if they're unable to play for whatever reason.\n\nUsing those advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense/defense/special teams, player values, news, predicting home-field advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NFL Projections\n\nOur NFL experts will provide consensus projections for every NFL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NFL: They're simply bets on the margin of victory. Say the Baltimore Ravens have a spread of -6.5 vs. the Arizona Cardinals. In that situation, a spread bet on the Ravens would cash if Baltimore won by a touchdown or more. A bet on the Cardinals at +6.5 would cash if the Cardinals won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in the NFL. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NFL projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also important for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Tennessee Titans vs. Philadelphia Eagles game has a total of 47 points: Bettors on the under would cash if the teams combined for 46 or fewer points; over bettors would win at 48 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NFL projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Detroit Lions are +250 on the moneyline vs. the Chicago Bears, who are -290. If you bet $10 on the Lions and they won, you would receive $25 in profit. A bet on the Bears, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NFL projections?\nWhat NFL projections do The Action Network experts provide?\nRecent Stories\nSee All\nCommanders vs. Giants TNF Combos: Polymarket Lines, Odds\nPablo Planovsky\n•\n5 mins ago\nGallant's Touchdown Picks for Commanders vs. Giants\nGilles Gallant\n•\n2 hours ago\nCommanders vs. Giants Player Props: 3 Picks for TNF\nSam Farley\n•\n11 hours ago\nPRO\nKoerner's Week 10 Pick'em & Confidence Rankings\nSean Koerner\n•\nNov 11, 2026 EST\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Pick n 11/15, 4:05 PM\nSeahawks\n277\nRaiders\n278\n\t\n-7\n+7\n\t\n-6.5\n-104\n+6.5\n+106\n\t\n78%\n22%\n\t\n87%\n13%\n\t\n+9%\n\t\n8,284\n\n\nSun 11/15, 4:25 PM\n49ers\n281\nCowboys\n282\n\t\n+1.5\n-1.5\n\t\n-3.5\n-106\n+3.5\n+106\n\t\n81%\n19%\n\t\n74%\n26%\n\t\n+7%\n\t\n8,880\n\n\nSun 11/15, 8:20 PM\nSteelers\n283\nBengals\n284\n\t\n+3.5\n-3.5\n\t\n+3.5\n-104\n-3.5\n+106\n\t\n30%\n70%\n\t\n38%\n62%\n\t\n+8%\n\t\n7,573\n\n\nMon 11/16, 8:15 PM\nChargers\n285\nRavens\n286\n\t\n+3.5\n-3.5\n\t\n+4.5\n+100\n-4.5\n+104\n\t\n68%\n32%\n\t\n32%\n68%\n\t\n+36%\n\t\n4,165\nNFL Public Betting – Percentages, Trends & How to Use Them\n\nThe NFL is the most-wagered-on sport in the United States, with billions bet each season. Since online sports betting became legal in dozens of states and prediction markets swept the country, Sunday afternoons have turned into a high-stakes contest between casual bettors and sharp professionals.\n\nOne of the most powerful tools for understanding the betting market is NFL public betting data — showing where the majority of bets and money are going. Learning how to read this information can help you spot potential value, avoid traps, and even identify “sharp” sides before kickoff.\n\nIn this guide, we’ll break down:\n\nWhat NFL public betting means\nHow to read % of bets vs % of money\nWeekly public betting percentages\nTrends from past NFL seasons\nWhat is NFL Public Betting?\n\nNFL public betting shows the percentage of bets placed on each side of a wager, usually tracked across major sportsbooks. If you want to compare these against prediction markets like Polymarket, Kalshi or Novig amongst others, we recommend signing up using either our Polymarket promo code, our Kalshi promo code or our Novig promo code.\n\nKey metrics to know:\n\nPercentage (%) of Bets – The share of total tickets placed on a particular side. Example: If we track 20,000 bets on the Steelers-Bills game and 13,000 are on the Buffalo Bills, that’s 65% of bets on Buffalo.\nPercentage (%) of Money – The share of total dollars wagered on a particular side. Example: If the total handle (amount wagered) is $6 million and $5 million is on the Steelers, that’s 83% of the money on the Pittsburgh Steelers.\nHow to Read NFL Public Betting Data\n\nWhen comparing % of bets and % of money, look for discrepancies. Looking at the difference between the percentage of bets and the percentage of money can help The Action Network users find the NFL sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NFL picks coverage.\n\nThis is important information because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones who tend to bet more, but those bets still count as just a single bet.\n\nHigh % bets + Low % money: Public is on one side, but big bettors aren’t.\nLow % bets + High % money: Smaller number of wagers, but larger dollar amounts — possible sharp action.\nBig differences (>15%): Worth investigating for potential value.\n\nExample: If the Tampa Bay Buccaneers have 69% of spread bets but 92% of the money, that’s a +23% difference, suggesting professional bettors are leaning Tampa Bay. Of course, it's also important to look at the total number of bets placed on the market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nNFL Public Betting Trends\n\nHistorical patterns show the public often gravitates toward:\n\nFavorites (especially in prime-time games)\n\nOvers (rooting for points is more fun)\n\nPopular teams (Dallas Cowboys, Kansas City Chiefs, Green Bay Packers)\n\nHowever, “fading the public” — betting against the majority — has historically produced value in certain situations, especially when 70%+ of bets are on one side.\n\nWhen it comes to NFL betting, we have plenty of resources available to you: NFL Odds & Betting Lines, NFL Betting Futures Odds, Expert NFL Picks, and NFL Teams Against the Spread Standings. If you're more into NFL Props, we also have NFL Props Projections and NFL Touchdown Props!\n\nYou can learn more about the Best NFL Betting Promos by checking out our review!\n\nAnd if you need help with odds conversions, check out our betting odds converter tool.\n\nHow the Public Bet the 2026 NFL Season\n\nBefore diving into the 2026-27 season, it's worth reviewing how the public fared last year — the same betting patterns tend to repeat, and knowing where the crowd went wrong is one of the best ways to find value this fall.\n\nThe 2025-26 season was a rough one for chalk bettors. Favorites won 65.9% of their games outright but covered the spread just 47.8% of the time — a sharp drop from 2024, when favorites went a historic 71.7% straight up and 53.3% against the spread.\n\nEven so, betting volume kept climbing, with DraftKings calling its NFL handle \"off-the-charts great\" and same-game parlays continuing to surge.\n\nKey Public Betting Trends From Last Season\n\nThe public backed the usual suspects. The Lions, Bills, Eagles, Chiefs and Cowboys drew the most betting action all season — big brands and preseason contenders, not the teams actually cashing tickets.\nVolume, not record, drove public losses. Detroit finished a middling 8-9 ATS, but the sheer number of bettors backing the Lions week after week made them a loss leader.\nThe best values were the least-bet teams. The Patriots and Seahawks — both +6000 preseason longshots — finished as the two most profitable teams for bettors, each going 12-5 ATS.\nMost-Bet Games of the Season\n\nStandalone prime-time games dominated the handle charts, with early-season matchups attracting the most money. The biggest betting event, as always, was the Super Bowl: the public backed Seattle early and often, pushing the spread from -4.5 to as high as -5.5, and bet slips piled up on the Seahawks to cover. Seattle's 29-13 win cashed those spread tickets, but the public's beloved over went down in flames — the 42 combined points fell well short of the total, a reminder that the crowd's over bias cuts both ways.\n\nBiggest Fades That Paid\n\nContrarian bettors had plenty to celebrate in 2025-26:\n\nFading the Chiefs: Kansas City lost nine games outright as a favorite and failed to cover in 10 — both league worsts.\nFading heavy favorites generally: with favorites covering under 48% of the time, taking the points was the winning side of the ledger.\nBacking live underdogs: the Panthers won eight games outright as an underdog, tied for the most in a season in the Super Bowl era.\nWhat It Means for 2026-27\n\nThe lesson heading into this season: the public will pile onto the same big-name favorites and overs it always does, and sportsbooks will shade lines accordingly. Watch for early public money inflating spreads on last year's darlings — the Seahawks and Patriots will carry Super Bowl hype into 2026-27, putting them at risk of becoming this year's overbet teams. Our live betting splits above update throughout the week once the season kicks off, so you can track exactly where the crowd is leaning in real time.\n\nFrequently Asked Questions\nWhat is NFL public betting data?\nWhat is the difference between \"% of bets\" and \"% of money\"?\nHow accurate are NFL public betting trends?\nIs it always better to \"fade the public\" in the NFL?\nHow do public betting trends cause NFL lines to move?\nWhere can I find real-time NFL betting splits?\nWhere can I bet on the NFL?\nRecent Stories\nSee All\nCommanders vs. Giants TNF Combos: Polymarket Lines, Odds\nPablo Planovsky\n•\n5 mins ago\nGallant's Touchdown Picks for Commanders vs. Giants\nGilles Gallant\n•\n2 hours ago\nCommanders vs. Giants Player Props: 3 Picks for TNF\nSam Farley\n•\n11 hours ago\nPRO\nKoerner's Week 10 1\n-105\n\t\n70%\n30%\n\t\n81%\n19%\n\n\nFinal\nSac State\n111\nC. Michigan\n112\n\t\n+14.5\n-14.5\n\t\n+17.5\n-17.5\n\t\n+17.5\n-17.5\n\t\nD\nD\n\t\n-2.4%\n-2.3%\n\t\n+17.5\n-110\n-0.5\n+100\n\t\n49%\n51%\n\t\n47%\n53%\nNCAAF Projections for 2026-27: Spread, Moneyline & Over/Under Insights\n\nWelcome to your one-stop source for the latest NCAAF projections for the 2026-27 college football season. Our expert projections cover spreads, moneylines, and totals, blended with advanced modeling and betting market signals to help you find edges and value before kickoff.\n\nWhat Are NCAAF Projections?\n\n“NCAAF projections” refer to forecasted odds (spreads, moneylines, over/unders) for every college football matchup — built by synthesizing statistical models, expert handicapping, and live betting market data. These projections estimate what sportsbooks “should” be offering, which then allows bettors to detect value when public or consensus lines deviate.\n\nHow to Use This NCAAF Projections Tool\n\nHere's a quick guide to digesting the data from our NCAAF projections tool:\n\nColumn\tWhat it means\tExample: Penn State at Ohio State\nOpen\tThe spread when sportsbooks first posted the game, before betting moved it.\tThe game opened at Ohio State –6.5.\nPro Line (Subscription Feature)\tOur model's odds for each game, compared to the consensus odds. We recommend at least a Grade of B or a +3.5% Edge before considering a bet based solely on projections.\tThe model makes Ohio State –5.5, meaning it thinks they should be favored by 5.5 points.\nCons.\tThe consensus line — the current market spread averaged across sportsbooks.\tBooks now have Ohio State –7, so the line has moved a half point since open.\nGrade\tA letter grade (A–F) rating how strong the gap is between our line and the market's.\tModel says –5.5, market says –7. That 1.5-point gap crossing a key number earns a B.\nEdge\tThe same gap shown as a percentage. Higher = more potential value.\tPenn State +7 shows a +4.2% edge — above the +3.5% threshold worth considering.\nBest Odds\tThe single best price on each side across all sportsbooks we track.\tOne book has Penn State +7.5 (–108) — a better number than the consensus +7.\nBet %\tThe share of total tickets (individual bets) on each side.\t75% of all bets are on Ohio State — the public likes the favorite.\nMoney %\tThe share of total dollars wagered on each side.\t60% of the money is on Penn State — fewer, larger bets suggest sharper action on the underdog.\nHow We Build Projections for 2026-27\n\nTo generate our NCAAF projections this season, we combine:\n\nPower ratings and advanced metrics: Reviewing offense, defense, special teams, tempo, efficiency, recruiting impact, roster turnover from the previous season.\nTeam news and injuries: Especially at key positions like quarterback. A QB injury or change in coaching staff triggers re-evaluation.\nHome-field advantage and rest/back-to-back weeks: Travel, bye weeks, and short weeks matter.\nHistorical performance and trend analysis: How teams performed in similar matchups, under similar conditions.\nLive betting market data: consensus lines, sportsbooks’ odds, public betting percentages. Our models aim to spot “edges” when our projections differ meaningfully from current market lines.\nWhat You’ll See in Our NCAAF Projections\n\nFor each game, we provide:\n\nSpread projection: Predicted margin between the two teams (how many points one is favored by).\nMoneyline projection: Odds for each team to win outright.\nOver/Under (Total): Predicted combined points scored by both teams.\nEdge: The difference (as a percentage) between our projection and the consensus/sportsbook line — this helps identify betting value.\nGrade: A letter grade (A-F) reflecting the strength of that edge; helps you quickly see which games to focus on.\nHow to Use Projections in Betting\nSpot the edge: Compare our 2025-26 projections vs current sportsbook lines. An edge of +3.5% or higher often starts to look compelling.\nRespect key numbers: A spread of 6.5 vs. 7, or a total of 49.5 vs. 50.5, can matter significantly because of scoring patterns in football.\nMonitor news up to game day: Last-minute injuries or weather shifts can swing spreads or totals and affect value.\nDiversify bets: Don’t just pick spreads — sometimes moneylines or overs/unders offer better return, depending on matchups.\nUse power ratings: Our projections derive from power ratings that update weekly, reflecting latest performance, rest, injuries, momentum. Use these to compare teams even before lines drop.\nExample: Sample Projections\n\nSay the Georgia Bulldogs have a spread of -6.5 vs. the Florida Gators. In that situation, a spread bet on Georgia would cash if they won by a touchdown or more. A bet on Alabama at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in college football. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NCAAF projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also vital for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Oregon Ducks vs. Oklahoma Sooners game has a total of 64 points: Bettors on the under would cash if the teams combined for 63 or fewer points; over bettors would win at 65 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NCAAF projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Texas Tech Red Raiders are +250 on the moneyline vs. the Clemson Tigers, who are -290. If you bet $10 on Texas Tech and they won, you would receive $25 in profit. A bet on Clemson, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nProjections vs. Public Sentiment\n\nSometimes what our projections say diverges from what the public is betting. These misalignments can signal value:\n\nWhen public heavily backs the favorite, but our model’s projected spread is smaller.\nWhen underdogs get little attention but our model suggests they win outright with reasonable probability.\nWhen totals are inflated by marquee names or high-profile games, but underlying defense/offense metrics suggest lower scoring.\nStay Current: Weekly Updates & Trends\nProjections are refreshed weekly, especially when new stats, injuries, or reports come in.\nWe track which teams are trending up or down — momentum matters.\nBet monitoring: watch how sharp bettors are leaning, and where public money is going. These can influence line movement, sometimes creating last-minute value.\n\nIf you're serious about getting an edge in college football betting, these NCAAF projections are essential. They don't predict upsets or guarantee wins — but they give you a probabilistic foundation to make smarter bets. Use them to find mismatches, exploit line inefficiencies, and avoid getting caught up in hype.\n\nUpdated for the 2026-27 season, our projections reflect the realities of roster shifts, scoring trends, and a tighter market. Bookmark this page, check it weekly, and let the numbers guide you.\n\nIf you want to put these NCAAF projections to work, check out the best college football betting promos or best CFB prediction market promos.\n\nFrequently Asked Questions\nWhat are NCAAF projections?\nWhat NCAAF projections do Action Network experts provide?\nRecent Stories\nSee All\nLouisiana vs ULM: Battle on the Bayou\nRoad ToCFB\n•\n36 mins ago\nMemphis vs. USF: Lay Points With Road Favorite\nJoshua Nunn\n•\n1 hour ago\nThursday Night Football, College Edition: 2 Bets for Tonight\nAction Network Staff\n•\n2 hours ago\nPRO\n4 Extra-Windy Games (20 MPH Gusts Forecasted)\nAlex Kolodziej\n•\nNov 11, 2026 EST\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Code\nPolymarket Promo Code\nFanDuel Predicts Promo Code\nKalshi Promo Code\nNovig Promo Code\nDraftKings Predictions Promo Code\nProphetX Promo Code\nDraftKings Promo Code\nFanDuel Promo Code\ntheScore Bet Promo Code\nbetPARX Promo Code\nHard Rock Bet Promo Code\nBetRivers Promo Code\nDraftKings Pick6 Promo Code\nDabble Promo Code\nBleacher Nation Fantasy Promo Code\nBetr Promo Code\nRebet Promo Code\nPlayBracco Promo Code\nThrillzz Promo Code\nPrizePicks Promo Code\nThe Action Network\nAbout\nOur Authors\nEditorial Policy\nCareers\nAction Store\nPress\nSupport\nPodcasts\nNe  where the smart money is going.\n\nFor example, in Week 1 of the 2025 season, Ohio State opened as a 7.5-point favorite over Texas. Bets skewed toward Ohio State early, but by kickoff the line had moved to 7 despite the majority of bets still on the Buckeyes — a reverse line movement that pointed to sharp money on Texas. That kind of divergence between ticket count and line movement is exactly what public betting data is meant to surface.\n\nTips for Interpreting NCAAF Public Betting\n\nUnderstanding how to interpret NCAAF public betting can provide an edge for college football bettors. Here's a handful of tips from our experts on interpreting NCAAF public betting data.\n\nLook for games where the delta between bet and money percentages is large — these often indicate professional interest.\nAvoid overvaluing data from games with small sample sizes of tracked bets.\nUse public betting data alongside other tools, such as line movement, team stats, and matchup analysis, to make informed decisions.\nTreat public betting data as one input among several, not a standalone system — it's most useful combined with injury news, weather, and situational trends (letdown spots, short weeks, revenge games).\nResponsible gambling note: public and money percentages describe crowd behavior, not guaranteed outcomes. Never bet more than you can afford to lose, and use them as a research tool rather than a betting system on their own.\n\nA concrete example: An Action Network study found that teams receiving fewer than 45% of spread tickets since 2005 went 4,007-4,025-145 against the spread, a 49.9% win rate — essentially break-even, not a strong edge.\n\nHow to Use Public Betting and Money Percentages in College Football Betting\n\nWe house betting data from numerous U.S. online sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every college football game and major bet type. Here's a look at a hypothetical Tennessee-Vanderbilt game.\n\nPercentage (%) of bets: The percentage of wagers on a particular side of a game. If Tennessee vs. Vanderbilt had 20,000 total bets that we've tracked and 12,000 of those are on the Vols, we'd say that Tennessee has received 60% of the bets.\nPercentage (%) of money: This is the same thing except for the money. If we know the total handle, we can then calculate the percentage of money on one side or another of a bet.\n\nCombining those two factors can help college football bettors eye bets that might be worth making. The reason is because not all bets are the same amount of money. A single $10,000 sharp bet can outweigh hundreds of $10 public tickets — which is why money percentage often tells a different story than bet percentage.\n\nThus, the difference between the percentage of money and the percentage of bets can often highlight the games in which pro bettors are getting down action. And, well, they're professional and bet high amounts for a reason: It could be a good bet to take those sides.\n\nIt's also important to look at the total number of bets we're tracking, which you can see on the far right of the table above. The reason is that you don't want to put too much stock in a money vs. bet difference that has a small sample of bets. Utilizing all four factors -- bet percentage, money percentage, bet vs. money percentage (the delta), and total bets -- is recommended when using betting data to gain an advantage.\n\nWhy the Difference Matters\n\nThe difference between the percentage of bets and the percentage of money — sometimes called the “delta” — can highlight games where professional bettors are placing high-stakes wagers.\n\nWhen bet % and money % diverge sharply, it signals sharp (professional) money on one side. For example, 40% of bets but 80% of money on a team suggests a small number of large wagers from sharps rather than broad public support. \n\nScenario: 60% of bets on Tennessee but 80% of the money on them suggests sharp action favoring Tennessee over Vanderbilt.\nSharps bet large amounts for a reason: it could indicate a more favorable line or value that casual bettors might overlook.\n\nWe track this kind of split throughout the week across the CFB slate. In the hypothetical example above, the line held steady from open to close even as public tickets piled up on Tennessee — the kind of resistance that often accompanies sharp money quietly balancing the book on the other side. Watching for that pattern, rather than reacting to a single day's number, is where public betting data earns its keep.\n\nIf you want to apply NCAAF public betting insights, claim these NCAAF betting promos and/or NCAAF prediction market promos.\n\nFrequently Asked Questions\nWhat is a point spread in college football betting?\nWhat is a total or over/under bet in a college football game?\nHow do moneylines work in college football betting?\nWhere can I bet on college football?\nRecent Stories\nSee All\nLouisiana vs ULM: Battle on the Bayou\nRoad ToCFB\n•\n37 mins ago\nMemphis vs. USF: Lay Points With Road Favorite\nJoshua Nunn\n•\n1 hour ago\nThursday Night Football, College Edition: 2 Bets for Tonight\nAction Network Staff\n•\n2 hours ago\nPRO\n4 Extra-Windy Games (20 MPH Gusts Forecasted)\nAlex Kolodziej\n•\nNov 11, 2026 EST\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NBA projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NBA Projections\n\nOur NBA experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NBA: They're simply bets on the margin of victory. Say the Los Angeles Lakers have a spread of -6.5 vs. the Sacramento Kings. In that situation, a spread bet on the Lakers would cash if they won by a 7 points or more. A bet on the Kings at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Boston Celtics vs. New York Knicks game has a total of 205 points: Bettors on the under would cash if the teams combined for 206 or fewer points; over bettors would win at 204 or more. An exact total of 205 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Orlando Magic are +250 on the moneyline vs. the Chicago Bulls, who are -290. If you bet $10 on the Magic and they won, you would receive $25 in profit. A bet on the Bulls, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NBA Projections?\nWhat NBA projections do The Action Network experts provide?\nRecent Stories\nSee All\nHornets vs Suns: Expect Positive Regression for Both Teams\nMatt Moore\n•\n15 mins ago\nMavericks vs T-Wolves: Trust the Big Rest Advantage\nMatt Moore\n•\n32 mins ago\nNBA Spot Tracker: Daily Betting Trends, Prop Angles, More\nEvan Abrams\n•\n9 hours ago\nNBA Prop Escalator for Deni Avdija (+316) Tonight\nAmeer Tyree\n•\nNov 11, 2026 EST\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB all handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NCAAB projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in college basketball betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NCAAB projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NCAAB Projections\n\nOur college basketball experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on college basketball: They're simply bets on the margin of victory. Say the Gonzaga Bulldogs have a spread of -6.5 vs. the UCLA Bruins. In that situation, a spread bet on Gonzaga would cash if they won by a 7 points or more. A bet on UCLA at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Baylor Bears vs. Arizona Wildcats game has a total of 175 points: Bettors on the under would cash if the teams combined for 174 or fewer points; over bettors would win at 175 or more. An exact total of 175 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Ohio State Buckeyes are +250 on the moneyline vs. the Michigan Wolverines, who are -290. If you bet $10 on the Buckeyes and they won, you would receive $25 in profit. A bet on the Wolverines, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Quest ion Network users find the NCAAB sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NCAAB picks coverage.\n\nHere's another example: Say the Syracuse Orange are getting 69% of the spread bets against the Duke Blue Devils, but 92% of the money bet on that game's spread is on the Orange. That would be a percentage difference of 23% on the Orange, highlighting that the bettors willing to wager a lot of money — these are likely to be sharp bettors — are on Syracuse. These are what's known as NCAAB consensus picks.\n\nOf course, it's also important to look at the total number of bets placed on the NCAA college basketball market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more as a betting strategy.\n\nFrequently Asked Questions\nWhat is a point spread in NCAAB betting?\nWhat is a total or over/under bet in an NCAAB game?\nHow do moneylines work in NCAAB betting?\nWhere can I bet on college basketball?\nRecent Stories\nSee All\nA Red-Hot Model Pick & More NCAAB Best Bets for Thursday\nAction Network Staff\n•\n37 mins ago\nPRO\nSharps Target This CBB Pick on Thursday Afternoon\nCarlos Avilan\n•\n56 mins ago\nPRO\nProjections Crushing Totals! Today's A+ Pick\nAlex Kolodziej\n•\n1 hour ago\nOklahoma State vs Texas A&M: Hoops on Caffeine\nSean Paul\n•\n1 hour ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Bet ts.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NHL projections to be aware of news and injuries.\n\nGoal lines don't move much considering the close nature of final scores in hockey. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-ice advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NHL Projections\n\nOur NHL experts will provide consensus projections for every NHL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but with baseball, spread numbers won't vary much no matter the book. The majority of hockey goal-lines will be +/- 1.5 because of how close games can be.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NHL: They're simply bets on the margin of victory. Say the Pittsburgh Penguins have a spread of -1.5 vs. the New York Islanders. In that situation, a spread bet on the Penguins would cash if they won by a 2 goals or more. A bet on the Islanders at +1.5 would cash if they won the game outright or merely lost by 1 goal.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Florida Panthers vs. Columbus Blue Jackets game has a total of 7 goals: Bettors on the under would cash if the teams combined for 6 or fewer goals; over bettors would win at 8 or more. An exact total of 8 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NHL projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the San Jose Sharks are +250 on the moneyline vs. the Vancouver Canucks, who are -290. If you bet $10 on the Sharks and they won, you would receive $25 in profit. A bet on the Canucks, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NHL projections?\nWhat NHL projections do The Action Network experts provide?\nRecent Stories\nSee All\nPRO\nPRO Power Play: +756 Early Puck Drop Parlay\nAlex Kolodziej\n•\n1 hour ago\nHurricanes vs Kraken in Helsinki: NHL Global Series Pick\nGreg Liodice\n•\n9 hours ago\nPRO\nDr. Nick's NHL First Goal Model for Wednesday\nNick Giffen\n•\nNov 11, 2026 EST\nFlyers vs Oilers Prediction: Props on Shots\nAction Network Staff\n•\nNov 11, 2026 EST\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & An ork's public betting data can spot sharp bets.\n\nHow to Use Public Betting and Money Percentages in NHL Betting\n\nWe track betting data at a variety of sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every NHL game and bet type.\n\nPercentage (%) of bets: The proportion of bets made on a side of a wager. For example, if we track 20,000 bets on the Devils-Stars game and 13,000 of them are on the Stars, that would be 65% of bets on the Stars.\nPercentage (%) of money: The proportion of money bet on a side of a wager. For example, if we track a total handle -- a betting term that means \"amount wagered\" -- of $6 million and $5 million is on the Devils, that would be 83% of the money on the Devils.\n\nThis is important information because not every bet is the same for NHL betting. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet for NHL betting.\n\nTherefore, looking at the difference between the percentage of bets and percentage of money can help The Action Network users find the NHL sides that have \"sharp money\" -- in other words, those wagered on by pros. We also have expert NHL picks coverage.\n\nHere's another example: Say the Florida Panthers are getting 69% of the spread bets against the Nashville Predators, but 92% of the money bet on that game's spread is on the Predators. That would be a percentage difference of 23% on the Predators, highlighting that the bettors willing to wager a lot of money -- these are likely to be sharp and pro bettors -- are on Nashville for the overall public opinion.\n\nOf course, it's also important to look at the total number of bets placed on the market for your betting strategy, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. ction markets, where sometimes just a few people own a large portion of the contracts available.\n\nWho “the public” is\n\nThe term mostly describes recreational bettors: casual fans who bet for fun, often on favorites, popular teams, overs, and games with heavy media attention. It is usually contrasted with “sharps,” professional or highly informed bettors who wager larger amounts and tend to focus on pricing and value rather than team popularity. On prediction markets, a number of market makers and institutions trade the same contracts as everyone else, so its worth identifying differences between Sportsbook odds and Prediction market odds frequently with that disparity in mind.\n\nWhy anyone tracks it\n\nGauging sentiment: splits show which outcomes are popular and which are being ignored.\nUnderstanding line movement: books adjust odds based on the size and source of wagers, so splits help explain why a number moved.\nFading or tailing: some bettors “fade the public” by betting the unpopular side, on the theory that popular picks are often overpriced. Others tail it when the crowd has been right.\n\nImportant caveats\n\nPublic sentiment alone isn’t a reliable edge. Fading the public isn’t automatically profitable, and the public wins plenty of the time.\nSplits vary by source, since each sportsbook has its own customer base, and aggregated data is only an approximation of the whole market.\nBooks price lines to manage their own risk and expected profit, not just to balance the action, so a lopsided split doesn’t always mean the book is exposed.\n\nNFL Public Betting\n\nNFL public betting trends for the 2026-27 season reveal how bettors are wagering across spreads, totals, and moneylines. The tables above display the latest NFL public betting splits for every game of the 2026-27 NFL season (filtered by week). You can see the breakdown in '% of bets' and '% of money' for the moneyline, spread, and total for all matchups.\n\nNFL public betting splits are updated in     out.push(`<div class="bar"><span class="lbl">${esc(label)}</span><div class="meter"><i style="width:${+b||0}%"></i><span>${b==null?'':pct(b)+' bets'}</span></div><div class="meter m"><i style="width:${+mo||0}%"></i><span>${mo==null?'':pct(mo)+' money'}</span></div></div>`); };
  [['spread','Spread'],['ml','ML']].forEach(([m,l])=>{ side(m,'away',`${l} ${t[0]||'away'}`); side(m,'home',`${l} ${t[1]||'home'}`); });
  side('total','over','Over'); side('total','under','Under');
  return out.length?`<div class="sec"><h4>Public betting</h4>${out.join('')}</div>`:'';
}
// 2026-11-05: one table instead of three raw dumps (sharp / projections / public repeat the same
// Open, Best line and Bet%/Money%). Field "1" = first team in the header, "2" = second.
function pro(g){
  const p=g.pro||{}; if(!Object.keys(p).length) return '';
  const t=g.teams||[], n1=esc(t[0]||'Team 1'), n2=esc(t[1]||'Team 2');
  const order=['projections','sharp','public'], srcs=[...order.filter(k=>p[k]).map(k=>p[k]), ...Object.keys(p).filter(k=>!order.includes(k)).map(k=>p[k])];
  const get=f=>{ for(const s of srcs){ const v=s&&s[f]; if(v!=null&&v!=='') return String(v); } return ''; };
  const has=f=>get(f+'1')!==''||get(f+'2')!=='';
  const num=v=>parseFloat(String(v).replace('%','').replace(/^pk$/i,'0'));
  const used=new Set(), rows=[];
  const mark=(...fs)=>fs.forEach(f=>{used.add(f); used.add(f+'1'); used.add(f+'2');});
  const row=(label,a,b)=>rows.push(`<tr><td>${label}</td><td>${a||'—'}</td><td>${b||'—'}</td></tr>`);
  const gc=v=>/^[AB]/.test(v)?'good':/^[DF]/.test(v)?'bad':'';
  const notes=[];
  if(has('Grade')){ row('Grade', `<span class="gr ${gc(get('Grade1'))}">${esc(get('Grade1')||'—')}</span>`, `<span class="gr ${gc(get('Grade2'))}">${esc(get('Grade2')||'—')}</span>`); mark('Grade'); }
  if(has('ProLine')){
    const e=i=>get('Edge'+i)?` <span class="meta">${esc(get('Edge'+i))}</span>`:'';
    row('PRO line', esc(get('ProLine1'))+e(1), esc(get('ProLine2'))+e(2)); mark('ProLine','Edge');
  }
  if(has('Consensus')){ row('Market', esc(get('Consensus1')), esc(get('Consensus2'))); mark('Consensus'); }
  // model vs market: points of value on team 1 = market line - model line
  const pv=num(get('Consensus1'))-num(get('ProLine1'));
  if(isFinite(pv) && Math.abs(pv)>=0.5) notes.push(`Model likes <b>${pv>0?n1:n2}</b> by ${Math.abs(pv).toFixed(1).replace(/\.0$/,'')}${Math.abs(pv)===1?' pt':' pts'} vs the market`);
  if(has('Open')){ row('Open', esc(get('Open1')), esc(get('Open2'))); mark('Open'); }
  // best line: only a clean opposite-sign pair (the pages sometimes carry alt lines like +20.5 / +7)
  const best=srcs.find(s=>{ const x=num(s.BestLine1), y=num(s.BestLine2); return isFinite(x)&&isFinite(y)&&((x>0)!==(y>0)||(x===0&&y===0)); });
  if(best){ const j=v=>v?` <span class="meta">(${esc(v)})</span>`:''; row('Best line', esc(best.BestLine1)+j(best.BestJuice1), esc(best.BestLine2)+j(best.BestJuice2)); }
  mark('BestLine','BestJuice');
  if(has('BetPct')||has('MoneyPct')){
    row('Bets / Money', `${esc(get('BetPct1')||'—')} / ${esc(get('MoneyPct1')||'—')}`, `${esc(get('BetPct2')||'—')} / ${esc(get('MoneyPct2')||'—')}`);
    [1,2].forEach(i=>{ const d=num(get('MoneyPct'+i))-num(get('BetPct'+i)); if(isFinite(d)&&d>=10) notes.push(`Money &gt; bets on <b>${i===1?n1:n2}</b> (+${Math.round(d)}%)`); });
    mark('BetPct','MoneyPct');
  }
  // sharp signals: any field "<Name>1"/"<Name>2" set to Y
  const sig={1:[],2:[]};
  srcs.forEach(s=>Object.entries(s).forEach(([k,v])=>{ const m=k.match(/^(.*)([12])$/); if(m&&v==='Y'&&!sig[m[2]].includes(m[1])){ sig[m[2]].push(m[1]); used.add(k); } }));
  const nice=a=>a.map(x=>x.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^PROSystems$/,'PRO Systems')).join(', ');
  if(sig[1].length||sig[2].length) row('Signals', esc(nice(sig[1])), esc(nice(sig[2])));
  const tb=get('TotalBets'); used.add('TotalBets'); used.add('Diff');
  const other=[]; srcs.forEach(s=>Object.entries(s).forEach(([k,v])=>{ if(!used.has(k)&&v!=null&&v!==''&&!other.some(o=>o[0]===k)){ other.push([k,v]); } }));
  if(!rows.length&&!other.length) return '';
  return `<div class="sec"><h4>Action PRO</h4>${rows.length?`<table class="odds pro"><tr><th></th><th>${n1}</th><th>${n2}</th></tr>${rows.join('')}</table>`:''}`
    +(notes.length?`<div class="pronotes">${notes.map(n=>`<div>${n}</div>`).join('')}</div>`:'')
    +(tb?`<div class="legend">${esc(tb)} bets tracked</div>`:'')
    +(other.length?`<div class="kv" style="margin-top:6px">${other.map(([k,v])=>`<span><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>`:'')+`</div>`;
}
function picks(g){
  const ps=g.picks||[]; if(!ps.length) return '';
  return `<div class="sec"><h4>Expert picks (${ps.length})</h4>${ps.map(p=>`<div class="pick"><b>${esc(p.Pick)}</b> ${p.Units?`<span class="badge">${esc(p.Units)}</span>`:''}<div class="who">${esc(p.Analyst)}${p.Record?' · '+esc(p.Record):''}${p.Posted?' · '+esc(p.Posted):''}</div>${p.Note?`<div class="note">${esc(p.Note)}</div>`:''}</div>`).join('')}</div>`;
}
function fstTips(f, headTitle){
  if(!f||!(f.tips||[]).length) return '';
  const ts=f.tips, own=ts.filter(t=>t.source!=='acca'), acc=ts.filter(t=>t.source==='acca');
  const row=t=>`<div class="pick fst"><b>${esc(t.pick)}</b><span class="od">${t.odds_us!=null?am(t.odds_us):''}</span>${t.odds_frac?` <span class="meta">(${esc(t.odds_frac)})</span>`:''}${t.confidence?`<span class="conf" title="confidence">${'★'.repeat(Math.min(5,+t.confidence||0))}</span>`:''}
    <div class="who">${t.market?esc(t.market):''}${t.source==='acca'?`${t.market?' · ':''}leg of their ${esc(t.product)}${t.product_legs?` (${t.product_legs} legs${t.product_odds_frac?', '+esc(t.product_odds_frac):''})`:''}`:''}</div>${t.reason?`<div class="note">${esc(t.reason)}</div>`:''}</div>`;
  return `<div class="sec"><h4>${headTitle||'freesupertips'} (${ts.length})</h4>${own.map(row).join('')}${acc.map(row).join('')}${f.url?`<div class="legend"><a href="${esc(f.url)}" target="_blank" rel="noopener">Full preview on freesupertips.com &rarr;</a></div>`:''}</div>`;
}
function fstCard(f){
  const id='fst:'+f.name;
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(f.start)}</span>
    <div class="gteams">${esc(f.home||'')} <span class="meta">vs</span> ${esc(f.away||'')}${f.league?`<small>${esc(f.league)}</small>`:''}</div>
    <span class="badge fst">${f.tips.length} tip${f.tips.length===1?'':'s'}</span></div><div class="gbody">${fstTips(f)}</div></div>`;
}
function arts(list, title){
  if(!(list||[]).length) return '';
  return `<div class="sec"><h4>${title}</h4><ul class="arts">${list.map(a=>`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></li>`).join('')}</ul></div>`;
}
function extra(g){
  const o=g.odds||{}; const shown=/^(ml|spread|total|over|under|draw|ml_draw)(_|$)/;
  const rest=Object.entries(o).filter(([k])=>!shown.test(k)||/(tickets|sharp)/.test(k));
  return rest.length?`<div class="sec"><h4>More from the odds feed</h4><div class="kv">${rest.map(([k,v])=>`<span><b>${esc(k.replace(/_/g,' '))}</b> ${esc(v)}</span>`).join('')}</div></div>`:'';
}
function card(g){
  const id = g.sport+':'+g.id, t=g.teams||[];
  const live = /live|in_progress|progress|1st|2nd|3rd|half|quarter|period/i.test(g.status||'');
  const score = g.score?` · ${g.score[0]}-${g.score[1]}`:'';
  const at = (g.sides||[])[0]==='away' ? '@' : 'vs';
  const head = t.length===2?`${esc(t[0])} <span class="meta">${at}</span> ${esc(t[1])}`:esc(g.title);
  const sub = [g.league_name&&g.league_name!==g.league?g.league_name:'', g.broadcast||'', g.num_bets?Number(g.num_bets).toLocaleString()+' bets':''].filter(Boolean).join(' · ');
  const body = oddsTable(g)+bars(g)+pro(g)+picks(g)+fstTips(g.fst)+arts(g.articles,'Articles')+extra(g)
    +(g.hub?`<div class="sec"><a href="${esc(g.hub)}" target="_blank" rel="noopener">Open on Action Network &rarr;</a></div>`:'');
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(g.start)}</span>
    <div class="gteams">${head}${sub?`<small>${esc(sub)}</small>`:''}</div>
    ${(g.picks||[]).length?`<span class="badge">${g.picks.length} picks</span>`:''}${g.fst&&g.fst.tips.length?`<span class="badge fst">${g.fst.tips.length} FST</span>`:''}<span class="badge${live?' live':''}">${esc(g.status||'')}${score}</span></div>
    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;
}
function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
