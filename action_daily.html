<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Action Daily</title>
<style>
  :root{--bg:#0b0e14;--panel:#131722;--panel2:#1a1f2e;--border:#252c3d;--text:#e8ebf2;--sub:#8993a8;
    --accent:#4f7cff;--accent2:#22c98a;--warn:#f2a93c;--bad:#f2554a;--gold:#e8c14a;--radius:10px;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding-bottom:60px} a{color:var(--accent)}
  .app{max-width:920px;margin:0 auto;padding:0 10px}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:8px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .back{color:var(--sub);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--panel)}
  h1{font-size:18px;margin:0;flex:1}
  .meta{color:var(--sub);font-size:12px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--sub);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.75;font-weight:600;margin-left:4px}
  .search{width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px}
  .sport{margin-top:18px}
  .sporthead{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
  .sporthead h2{font-size:15px;margin:0;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;overflow:hidden}
  .ghead{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
  .gtime{color:var(--sub);font-size:12px;min-width:62px}
  .gteams{flex:1;font-weight:700;font-size:14px;line-height:1.35}
  .gteams small{display:block;color:var(--sub);font-weight:500;font-size:12px}
  .badge{font-size:11px;color:var(--sub);border:1px solid var(--border);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .badge.live{color:var(--accent2);border-color:var(--accent2)}
  .gbody{display:none;border-top:1px solid var(--border);padding:10px 12px;background:var(--panel2)}
  .card.open .gbody{display:block}
  table.odds{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  table.odds th{color:var(--sub);font-weight:600;text-align:right;padding:4px 6px;font-size:12px}
  table.odds th:first-child,table.odds td:first-child{text-align:left}
  table.odds td{text-align:right;padding:5px 6px;border-top:1px solid var(--border);white-space:nowrap}
  table.odds td:first-child{white-space:normal}
  table.odds tr.open td{color:var(--sub);font-size:12px}
  .sec{margin-top:12px}
  .sec h4{margin:0 0 6px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
  .bar{display:grid;grid-template-columns:92px 1fr 1fr;gap:6px;align-items:center;font-size:12px;margin:4px 0}
  .bar .lbl{color:var(--sub)}
  .meter{position:relative;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
  .meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55}
  .meter.m i{background:var(--accent2)}
  .meter span{position:relative;padding-left:6px;line-height:18px;font-variant-numeric:tabular-nums}
  .kv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
  .kv b{color:var(--sub);font-weight:600}
  .pick{font-size:13px;padding:6px 0;border-top:1px solid var(--border)}
  .pick:first-child{border-top:0}
  .pick .who{color:var(--sub);font-size:12px}
  .pick .note{color:var(--sub);font-size:12px;margin-top:2px}
  ul.arts{margin:0;padding-left:18px;font-size:13px} ul.arts li{margin:3px 0}
  details{margin-top:8px} summary{cursor:pointer;color:var(--sub);font-size:13px}
  pre{white-space:pre-wrap;font-size:11px;color:var(--sub);max-height:420px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
  .empty{color:var(--sub);text-align:center;padding:40px 10px}
  .legend{color:var(--sub);font-size:11px;margin-top:4px}
  .badge.fst{color:var(--gold);border-color:rgba(232,193,74,.5)}
  .fst .mk{color:var(--sub);font-size:12px} .fst .od{font-variant-numeric:tabular-nums;font-weight:700;margin-left:4px}
  .fst .conf{color:var(--gold);font-size:11px;margin-left:4px;letter-spacing:1px}
  table.pro th{white-space:normal;color:var(--text);font-size:12px;vertical-align:bottom}
  table.pro td:first-child{color:var(--sub);font-size:12px}
  .gr{font-weight:700} .gr.good{color:var(--accent2)} .gr.bad{color:var(--bad)}
  .pronotes{margin-top:6px;font-size:12px;color:var(--sub)} .pronotes b{color:var(--text)}
</style>
</head>

tions?\n\n“NCAAF projections” refer to forecasted odds (spreads, moneylines, over/unders) for every college football matchup — built by synthesizing statistical models, expert handicapping, and live betting market data. These projections estimate what sportsbooks “should” be offering, which then allows bettors to detect value when public or consensus lines deviate.\n\nHow to Use This NCAAF Projections Tool\n\nHere's a quick guide to digesting the data from our NCAAF projections tool:\n\nColumn\tWhat it means\tExample: Penn State at Ohio State\nOpen\tThe spread when sportsbooks first posted the game, before betting moved it.\tThe game opened at Ohio State –6.5.\nPro Line (Subscription Feature)\tOur model's odds for each game, compared to the consensus odds. We recommend at least a Grade of B or a +3.5% Edge before considering a bet based solely on projections.\tThe model makes Ohio State –5.5, meaning it thinks they should be favored by 5.5 points.\nCons.\tThe consensus line — the current market spread averaged across sportsbooks.\tBooks now have Ohio State –7, so the line has moved a half point since open.\nGrade\tA letter grade (A–F) rating how strong the gap is between our line and the market's.\tModel says –5.5, market says –7. That 1.5-point gap crossing a key number earns a B.\nEdge\tThe same gap shown as a percentage. Higher = more potential value.\tPenn State +7 shows a +4.2% edge — above the +3.5% threshold worth considering.\nBest Odds\tThe single best price on each side across all sportsbooks we track.\tOne book has Penn State +7.5 (–108) — a better number than the consensus +7.\nBet %\tThe share of total tickets (individual bets) on each side.\t75% of all bets are on Ohio State — the public likes the favorite.\nMoney %\tThe share of total dollars wagered on each side.\t60% of the money is on Penn State — fewer, larger bets suggest sharper action on the underdog.\nHow We Build Projections for 2026-27\n\nTo generate our NCAAF projections this season, we combine:\n\nPower ratings and advanced metrics: Reviewing offense, defense, special teams, tempo, efficiency, recruiting impact, roster turnover from the previous season.\nTeam news and injuries: Especially at key positions like quarterback. A QB injury or change in coaching staff triggers re-evaluation.\nHome-field advantage and rest/back-to-back weeks: Travel, bye weeks, and short weeks matter.\nHistorical performance and trend analysis: How teams performed in similar matchups, under similar conditions.\nLive betting market data: consensus lines, sportsbooks’ odds, public betting percentages. Our models aim to spot “edges” when our projections differ meaningfully from current market lines.\nWhat You’ll See in Our NCAAF Projections\n\nFor each game, we provide:\n\nSpread projection: Predicted margin between the two teams (how many points one is favored by).\nMoneyline projection: Odds for each team to win outright.\nOver/Under (Total): Predicted combined points scored by both teams.\nEdge: The difference (as a percentage) between our projection and the consensus/sportsbook line — this helps identify betting value.\nGrade: A letter grade (A-F) reflecting the strength of that edge; helps you quickly see which games to focus on.\nHow to Use Projections in Betting\nSpot the edge: Compare our 2025-26 projections vs current sportsbook lines. An edge of +3.5% or higher often starts to look compelling.\nRespect key numbers: A spread of 6.5 vs. 7, or a total of 49.5 vs. 50.5, can matter significantly because of scoring patterns in football.\nMonitor news up to game day: Last-minute injuries or weather shifts can swing spreads or totals and affect value.\nDiversify bets: Don’t just pick spreads — sometimes moneylines or overs/unders offer better return, depending on matchups.\nUse power ratings: Our projections derive from power ratings that update weekly, reflecting latest performance, rest, injuries, momentum. Use these to compare teams even before lines drop.\nExample: Sample Projections\n\nSay the Georgia Bulldogs have a spread of -6.5 vs. the Florida Gators. In that situation, a spread bet on Georgia would cash if they won by a touchdown or more. A bet on Alabama at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in college football. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NCAAF projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also vital for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Oregon Ducks vs. Oklahoma Sooners game has a total of 64 points: Bettors on the under would cash if the teams combined for 63 or fewer points; over bettors would win at 65 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NCAAF projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Texas Tech Red Raiders are +250 on the moneyline vs. the Clemson Tigers, who are -290. If you bet $10 on Texas Tech and they won, you would receive $25 in profit. A bet  legalize sports betting and more bettors go online, NCAAF public betting continues to grow in popularity. Understanding how the public is wagering can help you identify potential edges and make smarter bets.\n\nIn this guide, we’ll break down public betting data, explain the difference between percentage of bets and percentage of money, and show how to use these insights to your advantage. Public betting percentage shows the share of bets placed on each side of a game, while money percentage shows the share of total dollars wagered — sharp bettors watch the gap between the two to spot value.\n\nPercentages on this page reflect Action Network's tracked sportsbook data and are updated every 10 minutes on gameday. Figures below are illustrative examples; see the live odds table for current-week numbers.\n\nWhat is NCAAF Public Betting?\n\nNCAAF public betting data shows what share of bets and what share of money are being placed on each side of a college football game, based on real sportsbook activity we track across the industry.\n\nNCAAF public betting refers to the wagers placed by the general betting population on college football games. Tracking public betting trends helps you see which teams or sides most bettors favor. However, the public isn’t always right, which is why professional bettors, also known as “sharps,” often take the opposite side.\n\nBy combining public betting data with money percentages and total bet volume, you can get a clearer picture of where the smart money is going.\n\nFor example, in Week 1 of the 2025 season, Ohio State opened as a 7.5-point favorite over Texas. Bets skewed toward Ohio State early, but by kickoff the line had moved to 7 despite the majority of bets still on the Buckeyes — a reverse line movement that pointed to sharp money on Texas. That kind of divergence between ticket count and line movement is exactly what public betting data is meant to surface.\n\nTips for Interpreting NCAAF Public Betting\n\nUnderstanding how to interpret NCAAF public betting can provide an edge for college football bettors. Here's a handful of tips from our experts on interpreting NCAAF public betting data.\n\nLook for games where the delta between bet and money percentages is large — these often indicate professional interest.\nAvoid overvaluing data from games with small sample sizes of tracked bets.\nUse public betting data alongside other tools, such as line movement, team stats, and matchup analysis, to make informed decisions.\nTreat public betting data as one input among several, not a standalone system — it's most useful combined with injury news, weather, and situational trends (letdown spots, short weeks, revenge games).\nResponsible gambling note: public and money percentages describe crowd behavior, not guaranteed outcomes. Never bet more than you can afford to lose, and use them as a research tool rather than a betting system on their own.\n\nA concrete example: An Action Network study found that teams receiving fewer than 45% of spread tickets since 2005 went 4,007-4,025-145 against the spread, a 49.9% win rate — essentially break-even, not a strong edge.\n\nHow to Use Public Betting and Money Percentages in College Football Betting\n\nWe house betting data from numerous U.S. online sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every college football game and major bet type. Here's a look at a hypothetical Tennessee-Vanderbilt game.\n\nPercentage (%) of bets: The percentage of wagers on a particular side of a game. If Tennessee vs. Vanderbilt had 20,000 total bets that we've tracked and 12,000 of those are on the Vols, we'd say that Tennessee has received 60% of the bets.\nPercentage (%) of money: This is the same thing except for the money. If we know the total handle, we can then calculate the percentage of money on one side or another of a bet.\n\nCombining those two factors can help college football bettors eye bets that might be worth making. The reason is because not all bets are the same amount of money. A single $10,000 sharp bet can outweigh hundreds of $10 public tickets — which is why money percentage often tells a different story than bet percentage.\n\nThus, the difference between the percentage of money and the percentage of bets can often highlight the games in which pro bettors are getting down action. And, well, they're professional and bet high amounts for a reason: It could be a good bet to take those sides.\n\nIt's also important to look at the total number of bets we're tracking, which you can see on the far right of the table above. The reason is that you don't want to put too much stock in a money vs. bet difference that has a small sample of bets. Utilizing all four factors -- bet percentage, money percentage, bet vs. money percentage (the delta), and total bets -- is recommended when using betting data to gain an advantage.\n\nWhy the Difference Matters\n\nThe difference between the percentage of bets and the percentage of money — sometimes called the “delta” — can highlight games where professional bettors are placing high-stakes wagers.\n\nWhen bet % and money % diverge sharply, it signals sharp (professional) money on one side. For example, 40% of bets but 80% of money on a team suggests a small number of large wagers from sharps rather than broad public support. \n\nScenario: 60% of bets on Tennessee but 80% of the money on them suggests sharp action favoring Tennessee over Vanderbilt.\nSharps bet large amounts for a reason: it could indicate a more favorable line or value that casual bettors might overlook.\n\nWe track this kind of split throughout the week across the CFB slate. In the hypothetical example above, the line held steady from open to close even as public tickets piled up on Tennessee — the kind of resistance that often accompanies sharp money quietly balancing the book on the other side. Watching for that pattern, rather than reacting to a single day's number, is where public betting data earns its keep.\n\nIf you want to apply NCAAF public betting insights, claim these NCAAF betting promos and/or NCAAF prediction market promos.\n\nFrequently Asked Questions\nWhat is a point spread in college football betting?\nWhat is a total or over/under bet in a college football game?\nHow do moneylines work in college football betting?\nWhere can I bet on college football?\nRecent Stories\nSee All\nOklahoma State vs Arizona State: The 1st Half Bet to Make\nDoug Ziefel\n•\n55 mins ago\nSMU vs Notre Dame: One-Sided Affair\nRyan Minion\n•\n1 hour ago\nGeorgia vs. South Carolina: 2 Bets for SEC Showdown\nCollin Wilson\n•\n1 hour ago\nHawaii vs Nevada: The End Of The Rainbow\nJoshua Nunn\n•\n1 hour ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Code\nPolymarket Promo Code\nFanDuel Predicts Promo Code\nKalshi Promo Code\nNovig Promo Code\nDraftKings Predictions Promo Code\nProphetX Promo Code\nDraftKings Promo Code\nFanDuel Promo Code\ntheScore Bet Promo Code\nbetPARX Promo Code\nHard Rock Bet Promo Code\nBetRivers Promo Code\nDraftKings Pick6 Promo Code\nDabble Promo Code\nBleacher Nation Fantasy Promo Code\nBetr Promo Code\nRebet Promo Code\nPlayBracco Promo Code\nThrillzz Promo Code\nPrizePicks Promo Code\nThe Action Network\nAbout\nOur Authors\n build their models and get their numbers on games, and of course it's incredibly important when building NBA projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NBA Projections\n\nOur NBA experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NBA: They're simply bets on the margin of victory. Say the Los Angeles Lakers have a spread of -6.5 vs. the Sacramento Kings. In that situation, a spread bet on the Lakers would cash if they won by a 7 points or more. A bet on the Kings at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Boston Celtics vs. New York Knicks game has a total of 205 points: Bettors on the under would cash if the teams combined for 206 or fewer points; over bettors would win at 204 or more. An exact total of 205 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Orlando Magic are +250 on the moneyline vs. the Chicago Bulls, who are -290. If you bet $10 on the Magic and they won, you would receive $25 in profit. A bet on the Bulls, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NBA Projections?\nWhat NBA projections do The Action Network experts provide?\nRecent Stories\nSee All\nBucks vs 76ers: Take Advantage of Philly's Injury Report\nBryan Fonseca\n•\n7 hours ago\nCeltics vs Kings: Fade This Tired, Bad Sacramento Defense\nMichael Arinze\n•\n8 hours ago\n7 NBA Best Bets for Saturday\nAction Network Staff\n•\n8 hours ago\nPelicans vs Spurs: Brutal Spot for New Orleans\nBrandon Kravitz\n•\n9 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\n leaning. Betting trends can also be identified by reviewing Prediction markets, like Polymarket & Kalshi who also provide information about volume of bets and volume of money per market. If you havent traded on a prediction market yet, we strongly advise you to check out our Kalshi promo code and Polymarket promo code, before you sign up!\n\nTwo ways of measuring how the general public is betting\n\nTickets (% of bets): the share of individual wagers on each side. If 70% of tickets are on Team A, seven out of ten bettors picked them, regardless of how much each person staked.\nMoney (% of money): the share of total dollars wagered on each side. Because a few large bets can outweigh many small ones, money and ticket percentages often differ. This is particularly useful information when looking on prediction markets, where sometimes just a few people own a large portion of the contracts available.\n\nWho “the public” is\n\nThe term mostly describes recreational bettors: casual fans who bet for fun, often on favorites, popular teams, overs, and games with heavy media attention. It is usually contrasted with “sharps,” professional or highly informed bettors who wager larger amounts and tend to focus on pricing and value rather than team popularity. On prediction markets, a number of market makers and institutions trade the same contracts as everyone else, so its worth identifying differences between Sportsbook odds and Prediction market odds frequently with that disparity in mind.\n\nWhy anyone tracks it\n\nGauging sentiment: splits show which outcomes are popular and which are being ignored.\nUnderstanding line movement: books adjust odds based on the size and source of wagers, so splits help explain why a number moved.\nFading or tailing: some bettors “fade the public” by betting the unpopular side, on the theory that popular picks are often overpriced. Others tail it when the crowd has been right.\n\nImportant caveats\n\nPublic sentiment alone isn’t a reliable edge.     const body=rows.filter(([,k])=>S[k]).map(([l,k])=>`<tr><td class="lab">${l}</td>${cell(S[k].su)}${cell(S[k].ats)}<td>${S[k].ou?S[k].ou[0]+'-'+S[k].ou[1]+(S[k].ou[2]?'-'+S[k].ou[2]:''):'–'}</td></tr>`).join('');
    const pf=s.pf!=null?` · ${num(s.pf)} for / ${num(s.pa)} against`:'';
    return `<div class="ov-team">${e(t.abbr||t.name)}<span>${side} · ${s.w}-${s.l}${streak(s.streak)?' · '+streak(s.streak):''}${pf}</span></div>
      <table class="ov-t"><tr><th></th><th>SU</th><th>ATS</th><th>O-U</th></tr>${body}</table>`;
  };
  // 2. last 5 games
  const res=(v,txt)=>`<span class="${v==='W'||v==='O'?'ov-w':v==='L'||v==='U'?'ov-l':'ov-p'}">${txt}</span>`;
  const lastTable=(t,rows)=>{
    if(!(rows||[]).length) return '';
    const d=s=>{ const p=String(s).split('-'); return p.length===3?(+p[1])+'/'+(+p[2]):s; };
    return `<div class="ov-team">${e(t)}</div><div class="ov-scroll"><table class="ov-t"><tr><th>Date</th><th>Opp</th><th>Result</th><th>ATS</th><th>O-U</th></tr>${rows.map(r=>
      `<tr><td class="lab">${d(r.date)}</td><td>${r.ha} ${e(r.opp)}</td><td>${res(r.res,r.res+' '+e(r.score))}</td>`+
      `<td>${r.spread==null?'–':res(r.ats,(r.spread>0?'+':'')+r.spread+' '+(r.ats||''))}</td>`+
      `<td>${r.total==null?'–':res(r.ou,(r.ou||'')+' '+r.total)}</td></tr>`).join('')}</table></div>`;
  };
  // 3. stat matchup
  const fam=OV_FAM(String(sp).toLowerCase()), defs=OV_STATS[fam];
  const sa=A.stats||{}, sh=Hm.stats||{}, ra=A.ranks||{}, rh=Hm.ranks||{};
  const ord=n=>n+(['th','st','nd','rd'][((n%100)-20)%10]||['th','st','nd','rd'][n%100]||'th');
  const statRows=defs.filter(([k])=>sa[k]!=null||sh[k]!=null).map(([k,l,low,f])=>{
    const a=sa[k], b=sh[k]; const better=a==null||b==null||a===b?null:((a<b)===!!low?'a':'b');
    const rk=r=>r?`<span class="ov-rk">${ord(r[0])}</span>`:'';
    return `<tr><td class="${better==='a'?'ov-best':''}">${num(a,f)}${rk(ra[k])}</td><td class="lab">${l}</td><td class="${better==='b'?'ov-best':''}">${num(b,f)}${rk(rh[k])}</td></tr>`;
  }).join('');
  const pool=ov.rank_pool;
  let h=`<div class="${secClass||'ui-sec'} ov-wrap"><h4>Form &amp; matchup</h4>`;
  const sit=sitTable(A,'away')+sitTable(Hm,'home');
  if(sit) h+=`<h5>Records (straight up, against the spread, over-under)</h5>${sit}`;
  if((ov.h2h||[]).length) h+=`<h5>Head to head (recent)</h5>${lastTable('Results from '+(ov.h2h[0].team||'')+"'s side",ov.h2h)}`;
  const l5=lastTable((A.abbr||'Away')+' last 5',A.last)+lastTable((Hm.abbr||'Home')+' last 5',Hm.last);
  if(l5) h+=`<h5>Recent games, closing line</h5>${l5}`;
  if(statRows) h+=`<h5>Season stats</h5><table class="ov-t"><tr><th>${e(A.abbr||'Away')}</th><th></th><th>${e(Hm.abbr||'Home')}</th></tr>${statRows}</table>
    <div class="ov-note">${fam==='foot'?'Per game. ':''}Green = better side. ${pool?`Rank = among the ${pool} teams our Action Network runs have seen this season (grows as more games are scraped).`:''} Action's site has no defensive breakdown beyond points allowed.</div>`;
  return h+`</div>`;
}

/* ===== From the articles (an_articles.py: picks + key facts per game, no links) 2026-11-12 ===== */
function notesBlock(g, secClass){
  const n=g&&g.article_notes; if(!n||(!n.summary&&!(n.picks||[]).length&&!(n.facts||[]).length)) return '';
  if(typeof ovCss==='function') ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(!document.getElementById('anCss')){ const st=document.createElement('style'); st.id='anCss';
    st.textContent=`.an-pick{padding:5px 0;border-bottom:1px solid var(--line,#2f3540)}.an-pick b{font-weight:600}
    .an-src{color:var(--muted,#9199a7);font-size:12px}.an-fact{display:flex;gap:8px;padding:5px 0;font-size:13px;line-height:1.35}
    .an-tag{flex:0 0 auto;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--raised,#252a33);color:var(--muted,#9199a7);height:fit-content}
    .an-tag.Injury{color:#ee6b5b}.an-tag.Spot{color:#e7b453}.an-tag.Form{color:#3cc48f}.an-tag.Numbers{color:#a9c1ff}
    .an-sum{font-size:14.5px;line-height:1.5;margin:6px 0 4px}.an-det{margin-top:8px}.an-det summary{cursor:pointer;font-size:13px;color:var(--muted,#9199a7);padding:4px 0}`;
    document.head.appendChild(st); }
  const label={Injury:'Injury',Spot:'Spot',Form:'Form',Numbers:'Numbers',Note:'Note'};
  const picks=(n.picks||[]).map(p=>`<div class="an-pick"><b>${e(p.pick)}</b>${p.play_to?` <span class="an-src">play to ${e(p.play_to)}</span>`:''}<div class="an-src">${p.by?e(p.by)+' · ':''}${e(p.src||'')}</div></div>`).join('');
  const facts=(n.facts||[]).map(f=>`<div class="an-fact"><span class="an-tag ${e(f.tag)}">${e(label[f.tag]||f.tag)}</span><span>${e(f.text)}</span></div>`).join('');
  /* 2026-11-18: Codex-written summary (an_summary.py) on top; the fact list folds under Details */
  const h5=t=>`<h5 style="margin:10px 0 2px;font-size:13px;color:var(--muted,#9199a7)">${t}</h5>`;
  const fromData=n.summary_src==='data';
  const sum=n.summary?`<p class="an-sum">${e(n.summary)}</p>${fromData?'<div class="an-src">No article on this game - written from the odds, betting splits, picks, form and stats.</div>':''}`:'';
  const factHtml=facts?(sum?`<details class="an-det"><summary>Details from the articles (${(n.facts||[]).length})</summary>${facts}</details>`:h5('Key facts')+facts):'';
  return `<div class="${secClass||'ui-sec'}"><h4>${fromData?'Game summary':`From the articles${n.n_articles?` (${n.n_articles})`:''}`}</h4>${sum}${picks?h5('Picks')+picks:''}${factHtml}</div>`;
}

function card(g){
  const id = g.sport+':'+g.id, t=g.teams||[];
  const live = /live|in_progress|progress|1st|2nd|3rd|half|quarter|period/i.test(g.status||'');
  const score = g.score?` · ${g.score[0]}-${g.score[1]}`:'';
  const at = (g.sides||[])[0]==='away' ? '@' : 'vs';
  const head = t.length===2?`${esc(t[0])} <span class="meta">${at}</span> ${esc(t[1])}`:esc(g.title);
  const sub = [g.league_name&&g.league_name!==g.league?g.league_name:'', g.broadcast||'', g.num_bets?Number(g.num_bets).toLocaleString()+' bets':''].filter(Boolean).join(' · ');
  const body = oddsTable(g)+bars(g)+ovBlock(g,'sec')+pro(g)+picks(g)+notesBlock(g,'sec')+fstTips(g.fst)+extra(g)
    +(g.hub?`<div class="sec"><a href="${esc(g.hub)}" target="_blank" rel="noopener">Open on Action Network &rarr;</a></div>`:'');
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(g.start)}</span>
    <div class="gteams">${head}${sub?`<small>${esc(sub)}</small>`:''}</div>
    ${(g.picks||[]).length?`<span class="badge">${g.picks.length} picks</span>`:''}${g.fst&&g.fst.tips.length?`<span class="badge fst">${g.fst.tips.length} FST</span>`:''}<span class="badge${live?' live':''}">${esc(g.status||'')}${score}</span></div>
    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;
}
function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
</html>
