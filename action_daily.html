uilding out NFL projections that can be measured against lines in the market.\nHow NFL Projections Work\n\nThere are many ways to build NFL projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, NFL handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NFL projections are projection blends of several of our key betting experts, including Sean Koerner and Stuckey. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NFL betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NFL projections to be aware of news and injuries.\n\nThe most important position in the NFL is quarterback, and it's not unreasonable to see a line move 4-5 points or more if a star is suddenly ruled out on a Sunday morning. Other positions are less valuable to the spread, which might surprise a casual gambler. Notably, running backs -- even the very best ones that are popular in fantasy football -- rarely move betting lines if they're unable to play for whatever reason.\n\nUsing those advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense/defense/special teams, player values, news, predicting home-field advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NFL Projections\n\nOur NFL experts will provide consensus projections for every NFL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NFL: They're simply bets on the margin of victory. Say the Baltimore Ravens have a spread of -6.5 vs. the Arizona Cardinals. In that situation, a spread bet on the Ravens would cash if Baltimore won by a touchdown or more. A bet on the Cardinals at +6.5 would cash if the Cardinals won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in the NFL. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NFL projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also important for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Tennessee Titans vs. Philadelphia Eagles game has a total of 47 points: Bettors on the under would cash if the teams combined for 46 or fewer points; over bettors would win at 48 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NFL projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Detroit Lions are +250 on the moneyline vs. the Chicago Bears, who are -290. If you bet $10 on the Lions and they won, you would receive $25 in profit. A bet on the Bears, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NFL projections?\nWhat NFL projections do The Action Network experts provide?\nRecent Stories\nSee All\nVikings vs. 49ers Player Props: 4 Picks for SNF\nSam Farley\n•\n6 hours ago\nAnderson's Week 11 Preview: Props, SGPs, Escalators\nBrandon Anderson\n•\n7 hours ago\nThe TD Show's Week 11 Parlay\nSean Koerner\n•\n7 hours ago\nKoerner's Player Props & Parlay for NFL Sunday\nSean Koerner\n•\n8 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Od \n\t\n25,743\n\n\nMon 11/23, 8:15 PM\nBengals\n473\nCommanders\n474\n\t\n-1.5\n+1.5\n\t\n-6.5\n+104\n+6.5\n-102\n\t\n81%\n19%\n\t\n72%\n28%\n\t\n+9%\n\t\n17,236\n\n\nFinal\nColts\n311\nTexans\n312\n\t\n+5.5\n-5.5\n\t\n+10.5\n+120\n-10.5\n-117\n\t\n46%\n54%\n\t\n40%\n60%\n\t\n+6%\n\t\n130,160\nNFL Public Betting – Percentages, Trends & How to Use Them\n\nThe NFL is the most-wagered-on sport in the United States, with billions bet each season. Since online sports betting became legal in dozens of states and prediction markets swept the country, Sunday afternoons have turned into a high-stakes contest between casual bettors and sharp professionals.\n\nOne of the most powerful tools for understanding the betting market is NFL public betting data — showing where the majority of bets and money are going. Learning how to read this information can help you spot potential value, avoid traps, and even identify “sharp” sides before kickoff.\n\nIn this guide, we’ll break down:\n\nWhat NFL public betting means\nHow to read % of bets vs % of money\nWeekly public betting percentages\nTrends from past NFL seasons\nWhat is NFL Public Betting?\n\nNFL public betting shows the percentage of bets placed on each side of a wager, usually tracked across major sportsbooks. If you want to compare these against prediction markets like Polymarket, Kalshi or Novig amongst others, we recommend signing up using either our Polymarket promo code, our Kalshi promo code or our Novig promo code.\n\nKey metrics to know:\n\nPercentage (%) of Bets – The share of total tickets placed on a particular side. Example: If we track 20,000 bets on the Steelers-Bills game and 13,000 are on the Buffalo Bills, that’s 65% of bets on Buffalo.\nPercentage (%) of Money – The share of total dollars wagered on a particular side. Example: If the total handle (amount wagered) is $6 million and $5 million is on the Steelers, that’s 83% of the money on the Pittsburgh Steelers.\nHow to Read NFL Public Betting Data\n\nWhen comparing % of bets and % of money, look for discrepancies. Looking at the difference between the percentage of bets and the percentage of money can help The Action Network users find the NFL sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NFL picks coverage.\n\nThis is important information because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones who tend to bet more, but those bets still count as just a single bet.\n\nHigh % bets + Low % money: Public is on one side, but big bettors aren’t.\nLow % bets + High % money: Smaller number of wagers, but larger dollar amounts — possible sharp action.\nBig differences (>15%): Worth investigating for potential value.\n\nExample: If the Tampa Bay Buccaneers have 69% of spread bets but 92% of the money, that’s a +23% difference, suggesting professional bettors are leaning Tampa Bay. Of course, it's also important to look at the total number of bets placed on the market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nNFL Public Betting Trends\n\nHistorical patterns show the public often gravitates toward:\n\nFavorites (especially in prime-time games)\n\nOvers (rooting for points is more fun)\n\nPopular teams (Dallas Cowboys, Kansas City Chiefs, Green Bay Packers)\n\nHowever, “fading the public” — betting against the majority — has historically produced value in certain situations, especially when 70%+ of bets are on one side.\n\nWhen it comes to NFL betting, we have plenty of resources available to you: NFL Odds & Betting Lines, NFL Betting Futures Odds, Expert NFL Picks, and NFL Teams Against the Spread Standings. If you're more into NFL Props, we also have NFL Props Projections and NFL Touchdown Props!\n\nYou can learn more about the Best NFL Betting Promos by checking out our review!\n\nAnd if you need help with odds conversions, check out our betting odds converter tool.\n\nHow the Public Bet the 2026 NFL Season\n\nBefore diving into the 2026-27 season, it's worth reviewing how the public fared last year — the same betting patterns tend to repeat, and knowing where the crowd went wrong is one of the best ways to find value this fall.\n\nThe 2025-26 season was a rough one for chalk bettors. Favorites won 65.9% of their games outright but covered the spread just 47.8% of the time — a sharp drop from 2024, when favorites went a historic 71.7% straight up and 53.3% against the spread.\n\nEven so, betting volume kept climbing, with DraftKings calling its NFL handle \"off-the-charts great\" and same-game parlays continuing to surge.\n\nKey Public Betting Trends From Last Season\n\nThe public backed the usual suspects. The Lions, Bills, Eagles, Chiefs and Cowboys drew the most betting action all season — big brands and preseason contenders, not the teams actually cashing tickets.\nVolume, not record, drove public losses. Detroit finished a middling 8-9 ATS, but the sheer number of bettors backing the Lions week after week made them a loss leader.\nThe best values were the least-bet teams. The Patriots and Seahawks — both +6000 preseason longshots — finished as the two most profitable teams for bettors, each going 12-5 ATS.\nMost-Bet Games of the Season\n\nStandalone prime-time games dominated the handle charts, with early-season matchups attracting the most money. The biggest betting event, as always, was the Super Bowl: the public backed Seattle early and often, pushing the spread from -4.5 to as high as -5.5, and bet slips piled up on the Seahawks to cover. Seattle's 29-13 win cashed those spread tickets, but the public's beloved over went down in flames — the 42 combined points fell well short of the total, a reminder that the crowd's over bias cuts both ways.\n\nBiggest Fades That Paid\n\nContrarian bettors had plenty to celebrate in 2025-26:\n\nFading the Chiefs: Kansas City lost nine games outright as a favorite and failed to cover in 10 — both league worsts.\nFading heavy favorites generally: with favorites covering under 48% of the time, taking the points was the winning side of the ledger.\nBacking live underdogs: the Panthers won eight games outright as an underdog, tied for the most in a season in the Super Bowl era.\nWhat It Means for 2026-27\n\nThe lesson heading into this season: the public will pile onto the same big-name favorites and overs it always does, and sportsbooks will shade lines accordingly. Watch for early public money inflating spreads on last year's darlings — the Seahawks and Patriots will carry Super Bowl hype into 2026-27, putting them at risk of becoming this year's overbet teams. Our live betting splits above update throughout the week once the season kicks off, so you can track exactly where the crowd is leaning in real time.\n\nFrequently Asked Questions\nWhat is NFL public betting data?\nWhat is the difference between \"% of bets\" and \"% of money\"?\nHow accurate are NFL public betting trends?\nIs it always better to \"fade the public\" in the NFL?\nHow do public betting trends cause NFL lines to move?\nWhere can I find real-time NFL betting splits?\nWhere can I bet on the NFL?\nRecent Stories\nSee All\nVikings vs. 49ers Player Props: 4 Picks for SNF\nSam Farley\n•\n6 hours ago\nAnderson's Week 11 Preview: Props, SGPs, Escalators\nBrandon Anderson\n•\n7 hours ago\nThe TD Show's Week 11 Parlay\nSean Koerner\n•\n7 hours ago\nKoerner's Player Props & Parlay for NFL Sunday\nSean Koerner\n•\n8 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betti ion of what to expect in a game.\n\nWe project the three big markets in NBA betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NBA projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NBA Projections\n\nOur NBA experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NBA: They're simply bets on the margin of victory. Say the Los Angeles Lakers have a spread of -6.5 vs. the Sacramento Kings. In that situation, a spread bet on the Lakers would cash if they won by a 7 points or more. A bet on the Kings at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Boston Celtics vs. New York Knicks game has a total of 205 points: Bettors on the under would cash if the teams combined for 206 or fewer points; over bettors would win at 204 or more. An exact total of 205 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Orlando Magic are +250 on the moneyline vs. the Chicago Bulls, who are -290. If you bet $10 on the Magic and they won, you would receive $25 in profit. A bet on the Bulls, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NBA Projections?\nWhat NBA projections do The Action Network experts provide?\nRecent Stories\nSee All\nNBA Spot Tracker: Daily Betting Trends, Prop Angles, More\nEvan Abrams\n•\n6 hours ago\nBucks vs 76ers: Take Advantage of Philly's Injury Report\nBryan Fonseca\n•\nNov 21, 2026 EST\nCeltics vs Kings: Fade This Tired, Bad Sacramento Defense\nMichael Arinze\n•\nNov 21, 2026 EST\n7 NBA Best Bets for Saturday\nAction Network Staff\n•\nNov 21, 2026   .ov-t th,.ov-t td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line,#2f3540);white-space:nowrap}
  .ov-t th{font-weight:600;color:var(--muted,#9199a7);font-size:12px}.ov-t td:first-child,.ov-t th:first-child{text-align:left}
  .ov-t .lab{color:var(--muted,#9199a7);font-size:12px}.ov-w{color:#3cc48f}.ov-l{color:#ee6b5b}.ov-p{color:var(--muted,#9199a7)}
  .ov-best{color:#3cc48f;font-weight:600}.ov-rk{color:var(--muted,#9199a7);font-size:11px;margin-left:3px}
  .ov-team{font-weight:600;margin:10px 0 2px}.ov-team span{color:var(--muted,#9199a7);font-weight:400;font-size:12px;margin-left:6px}
  .ov-note{color:var(--muted,#9199a7);font-size:11px;margin-top:4px}.ov-scroll{overflow-x:auto}`;
  document.head.appendChild(st);
}
function ovBlock(g, secClass){
  const ov=g&&g.overview; if(!ov||!ov.sides) return '';
  ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const A=ov.sides.away||{}, Hm=ov.sides.home||{}, sp=g.sport||g.league||'';
  const rec=r=>!r?'–':(r[0]+'-'+r[1]+(r[2]?'-'+r[2]:''));
  const pctOf=r=>r&&(r[0]+r[1])?r[0]/(r[0]+r[1]):null;
  const tint=(r)=>{ const p=pctOf(r); return p==null?'':p>=0.6?'ov-w':p<=0.4?'ov-l':''; };
  const cell=r=>`<td class="${tint(r)}">${rec(r)}</td>`;
  const o=g.odds||{};
  const favSide = o.spread_away!=null ? (+o.spread_away<0?'away':+o.spread_away>0?'home':null)
                : o.ml_away!=null&&o.ml_home!=null ? (+o.ml_away<+o.ml_home?'away':'home') : null;
  const streak=s=>s==null||s===0?'':(s>0?'W'+s:'L'+(-s));
  const num=(v,f)=>v==null?'–':f==='%'?(+v).toFixed(1)+'%':f==='+'?((+v>0?'+':'')+(+v).toFixed(1)):(+v).toFixed(f===2?2:1).replace(/\.0$/,'');
  // 1. situational records
  const sitTable=(t,side)=>{
    const s=t.sit; if(!s||!s.splits) return '';
    const S=s.splits, venue=side==='home'?'home':'road', role=favSide?(favSide===side?'fav':'dog'):null;
    const rows=[['Overall','overall'],['Last 5','last_5'],['Last 10','last_10'],[side==='home'?'At home':'On the road',venue]];
    if(role) rows.push([role==='fav'?'As favorite':'As underdog',role]);
    const body=rows.filter(([,k])=>S[k]).map(([l,k])=>`<tr><td class="lab">${l}</td>${cell(S[k].su)}${cell(S[k].ats)}<td>${S[k].ou?S[k].ou[0]+'-'+S[k].ou[1]+(S[k].ou[2]?'-'+S[k].ou[2]:''):'–'}</td></tr>`).join('');
    const pf=s.pf!=null?` · ${num(s.pf)} for / ${num(s.pa)} against`:'';
    return `<div class="ov-team">${e(t.abbr||t.name)}<span>${side} · ${s.w}-${s.l}${streak(s.streak)?' · '+streak(s.streak):''}${pf}</span></div>
      <table class="ov-t"><tr><th></th><th>SU</th><th>ATS</th><th>O-U</th></tr>${body}</table>`;
  };
  // 2. last 5 games
  const res=(v,txt)=>`<span class="${v==='W'||v==='O'?'ov-w':v==='L'||v==='U'?'ov-l':'ov-p'}">${txt}</span>`;
  const lastTable=(t,rows)=>{
    if(!(rows||[]).length) return '';
    const d=s=>{ const p=String(s).split('-'); return p.length===3?(+p[1])+'/'+(+p[2]):s; };
    return `<div class="ov-team">${e(t)}</div><div class="ov-scroll"><table class="ov-t"><tr><th>Date</th><th>Opp</th><th>Result</th><th>ATS</th><th>O-U</th></tr>${rows.map(r=>
      `<tr><td class="lab">${d(r.date)}</td><td>${r.ha} ${e(r.opp)}</td><td>${res(r.res,r.res+' '+e(r.score))}</td>`+
      `<td>${r.spread==null?'–':res(r.ats,(r.spread>0?'+':'')+r.spread+' '+(r.ats||''))}</td>`+
      `<td>${r.total==null?'–':res(r.ou,(r.ou||'')+' '+r.total)}</td></tr>`).join('')}</table></div>`;
  };
  // 3. stat matchup
  const fam=OV_FAM(String(sp).toLowerCase()), defs=OV_STATS[fam];
  const sa=A.stats||{}, sh=Hm.stats||{}, ra=A.ranks||{}, rh=Hm.ranks||{};
  const ord=n=>n+(['th','st','nd','rd'][((n%100)-20)%10]||['th','st','nd','rd'][n%100]||'th');
  const statRows=defs.filter(([k])=>sa[k]!=null||sh[k]!=null).map(([k,l,low,f])=>{
    const a=sa[k], b=sh[k]; const better=a==null||b==null||a===b?null:((a<b)===!!low?'a':'b');
    const rk=r=>r?`<span class="ov-rk">${ord(r[0])}</span>`:'';
    return `<tr><td class="${better==='a'?'ov-best':''}">${num(a,f)}${rk(ra[k])}</td><td class="lab">${l}</td><td class="${better==='b'?'ov-best':''}">${num(b,f)}${rk(rh[k])}</td></tr>`;
  }).join('');
  const pool=ov.rank_pool;
  let h=`<div class="${secClass||'ui-sec'} ov-wrap"><h4>Form &amp; matchup</h4>`;
  const sit=sitTable(A,'away')+sitTable(Hm,'home');
  if(sit) h+=`<h5>Records (straight up, against the spread, over-under)</h5>${sit}`;
  if((ov.h2h||[]).length) h+=`<h5>Head to head (recent)</h5>${lastTable('Results from '+(ov.h2h[0].team||'')+"'s side",ov.h2h)}`;
  const l5=lastTable((A.abbr||'Away')+' last 5',A.last)+lastTable((Hm.abbr||'Home')+' last 5',Hm.last);
  if(l5) h+=`<h5>Recent games, closing line</h5>${l5}`;
  if(statRows) h+=`<h5>Season stats</h5><table class="ov-t"><tr><th>${e(A.abbr||'Away')}</th><th></th><th>${e(Hm.abbr||'Home')}</th></tr>${statRows}</table>
    <div class="ov-note">${fam==='foot'?'Per game. ':''}Green = better side. ${pool?`Rank = among the ${pool} teams our Action Network runs have seen this season (grows as more games are scraped).`:''} Action's site has no defensive breakdown beyond points allowed.</div>`;
  return h+`</div>`;
}

/* ===== From the articles (an_articles.py: picks + key facts per game, no links) 2026-11-12 ===== */
function notesBlock(g, secClass){
  const n=g&&g.article_notes; if(!n||(!n.summary&&!(n.picks||[]).length&&!(n.facts||[]).length)) return '';
  if(typeof ovCss==='function') ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(!document.getElementById('anCss')){ const st=document.createElement('style'); st.id='anCss';
    st.textContent=`.an-pick{padding:5px 0;border-bottom:1px solid var(--line,#2f3540)}.an-pick b{font-weight:600}
    .an-src{color:var(--muted,#9199a7);font-size:12px}.an-fact{display:flex;gap:8px;padding:5px 0;font-size:13px;line-height:1.35}
    .an-tag{flex:0 0 auto;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--raised,#252a33);color:var(--muted,#9199a7);height:fit-content}
    .an-tag.Injury{color:#ee6b5b}.an-tag.Spot{color:#e7b453}.an-tag.Form{color:#3cc48f}.an-tag.Numbers{color:#a9c1ff}
    .an-sum{font-size:14.5px;line-height:1.5;margin:6px 0 4px}.an-det{margin-top:8px}.an-det summary{cursor:pointer;font-size:13px;color:var(--muted,#9199a7);padding:4px 0}`;
    document.head.appendChild(st); }
  const label={Injury:'Injury',Spot:'Spot',Form:'Form',Numbers:'Numbers',Note:'Note'};
  const picks=(n.picks||[]).map(p=>`<div class="an-pick"><b>${e(p.pick)}</b>${p.play_to?` <span class="an-src">play to ${e(p.play_to)}</span>`:''}<div class="an-src">${p.by?e(p.by)+' · ':''}${e(p.src||'')}</div></div>`).join('');
  const facts=(n.facts||[]).map(f=>`<div class="an-fact"><span class="an-tag ${e(f.tag)}">${e(label[f.tag]||f.tag)}</span><span>${e(f.text)}</span></div>`).join('');
  /* 2026-11-18: Codex-written summary (an_summary.py) on top; the fact list folds under Details */
  const h5=t=>`<h5 style="margin:10px 0 2px;font-size:13px;color:var(--muted,#9199a7)">${t}</h5>`;
  const fromData=n.summary_src==='data';
  const sum=n.summary?`<p class="an-sum">${e(n.summary)}</p>${fromData?'<div class="an-src">No article on this game - written from the odds, betting splits, picks, form and stats.</div>':''}`:'';
  const factHtml=facts?(sum?`<details class="an-det"><summary>Details from the articles (${(n.facts||[]).length})</summary>${facts}</details>`:h5('Key facts')+facts):'';
  return `<div class="${secClass||'ui-sec'}"><h4>${fromData?'Game summary':`From the articles${n.n_articles?` (${n.n_articles})`:''}`}</h4>${sum}${picks?h5('Picks')+picks:''}${factHtml}</div>`;
}

function card(g){
  const id = g.sport+':'+g.id, t=g.teams||[];
  const live = /live|in_progress|progress|1st|2nd|3rd|half|quarter|period/i.test(g.status||'');
  const score = g.score?` · ${g.score[0]}-${g.score[1]}`:'';
  const at = (g.sides||[])[0]==='away' ? '@' : 'vs';
  const head = t.length===2?`${esc(t[0])} <span class="meta">${at}</span> ${esc(t[1])}`:esc(g.title);
  const sub = [g.league_name&&g.league_name!==g.league?g.league_name:'', g.broadcast||'', g.num_bets?Number(g.num_bets).toLocaleString()+' bets':''].filter(Boolean).join(' · ');
  const body = oddsTable(g)+bars(g)+ovBlock(g,'sec')+pro(g)+picks(g)+notesBlock(g,'sec')+fstTips(g.fst)+extra(g)
    +(g.hub?`<div class="sec"><a href="${esc(g.hub)}" target="_blank" rel="noopener">Open on Action Network &rarr;</a></div>`:'');
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(g.start)}</span>
    <div class="gteams">${head}${sub?`<small>${esc(sub)}</small>`:''}</div>
    ${(g.picks||[]).length?`<span class="badge">${g.picks.length} picks</span>`:''}${g.fst&&g.fst.tips.length?`<span class="badge fst">${g.fst.tips.length} FST</span>`:''}<span class="badge${live?' live':''}">${esc(g.status||'')}${score}</span></div>
    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;
}
function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
</html>
