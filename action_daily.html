  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding-bottom:60px} a{color:var(--accent)}
  .app{max-width:920px;margin:0 auto;padding:0 10px}

  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .back{color:var(--sub);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--panel)}
  h1{font-size:18px;margin:0;flex:1}
  .meta{color:var(--sub);font-size:12px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--sub);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.75;font-weight:600;margin-left:4px}
  .search{width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px}
  .sport{margin-top:18px}
  .sporthead{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
  .sporthead h2{font-size:15px;margin:0;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;overflow:hidden}
  .ghead{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
  .gtime{color:var(--sub);font-size:12px;min-width:62px}
  .gteams{flex:1;font-weight:700;font-size:14px;line-height:1.35}
  .gteams small{display:block;color:var(--sub);font-weight:500;font-size:12px}
  .badge{font-size:11px;color:var(--sub);border:1px solid var(--border);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .badge.live{color:var(--accent2);border-color:var(--accent2)}
  .gbody{display:none;border-top:1px solid var(--border);padding:10px 12px;background:var(--panel2)}
  .card.open .gbody{display:block}
  table.odds{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  table.odds th{color:var(--sub);font-weight:600;text-align:right;padding:4px 6px;font-size:12px}
  table.odds th:first-child,table.odds td:first-child{text-align:left}
  table.odds td{text-align:right;padding:5px 6px;border-top:1px solid var(--border);white-space:nowrap}
  table.odds td:first-child{white-space:normal}
  table.odds tr.open td{color:var(--sub);font-size:12px}
  .sec{margin-top:12px}
  .sec h4{margin:0 0 6px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
  .bar{display:grid;grid-template-columns:92px 1fr 1fr;gap:6px;align-items:center;font-size:12px;margin:4px 0}
  .bar .lbl{color:var(--sub)}
  .meter{position:relative;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
  .meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55}
  .meter.m i{background:var(--accent2)}
  .meter span{position:relative;padding-left:6px;line-height:18px;font-variant-numeric:tabular-nums}
  .kv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
  .kv b{color:var(--sub);font-weight:600}
  .pick{font-size:13px;padding:6px 0;border-top:1px solid var(--border)}
  .pick:first-child{border-top:0}
  .pick .who{color:var(--sub);font-size:12px}
  .pick .note{color:var(--sub);font-size:12px;margin-top:2px}
  ul.arts{margin:0;padding-left:18px;font-size:13px} ul.arts li{margin:3px 0}
  details{margin-top:8px} summary{cursor:pointer;color:var(--sub);font-size:13px}
  pre{white-space:pre-wrap;font-size:11px;color:var(--sub);max-height:420px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
  .empty{color:var(--sub);text-align:center;padding:40px 10px}
  .legend{color:var(--sub);font-size:11px;margin-top:4px}
  .badge.fst{color:var(--gold);border-color:rgba(232,193,74,.5)}
  .fst .mk{color:var(--sub);font-size:12px} .fst .od{font-variant-numeric:tabular-nums;font-weight:700;margin-left:4px}
  .fst .conf{color:var(--gold);font-size:11px;margin-left:4px;letter-spacing:1px}
  table.pro th{white-space:normal;color:var(--text);font-size:12px;vertical-align:bottom}
  table.pro td:first-child{color:var(--sub);font-size:12px}
  .gr{font-weight:700} .gr.good{color:var(--accent2)} .gr.bad{color:var(--bad)}
  .pronotes{margin-top:6px;font-size:12px;color:var(--sub)} .pronotes b{color:var(--text)}
</style>

\tWhat it means\tExample: Penn State at Ohio State\nOpen\tThe spread when sportsbooks first posted the game, before betting moved it.\tThe game opened at Ohio State –6.5.\nPro Line (Subscription Feature)\tOur model's odds for each game, compared to the consensus odds. We recommend at least a Grade of B or a +3.5% Edge before considering a bet based solely on projections.\tThe model makes Ohio State –5.5, meaning it thinks they should be favored by 5.5 points.\nCons.\tThe consensus line — the current market spread averaged across sportsbooks.\tBooks now have Ohio State –7, so the line has moved a half point since open.\nGrade\tA letter grade (A–F) rating how strong the gap is between our line and the market's.\tModel says –5.5, market says –7. That 1.5-point gap crossing a key number earns a B.\nEdge\tThe same gap shown as a percentage. Higher = more potential value.\tPenn State +7 shows a +4.2% edge — above the +3.5% threshold worth considering.\nBest Odds\tThe single best price on each side across all sportsbooks we track.\tOne book has Penn State +7.5 (–108) — a better number than the consensus +7.\nBet %\tThe share of total tickets (individual bets) on each side.\t75% of all bets are on Ohio State — the public likes the favorite.\nMoney %\tThe share of total dollars wagered on each side.\t60% of the money is on Penn State — fewer, larger bets suggest sharper action on the underdog.\nHow We Build Projections for 2026-27\n\nTo generate our NCAAF projections this season, we combine:\n\nPower ratings and advanced metrics: Reviewing offense, defense, special teams, tempo, efficiency, recruiting impact, roster turnover from the previous season.\nTeam news and injuries: Especially at key positions like quarterback. A QB injury or change in coaching staff triggers re-evaluation.\nHome-field advantage and rest/back-to-back weeks: Travel, bye weeks, and short weeks matter.\nHistorical performance and trend analysis: How teams performed in similar matchups, under similar conditions.\nLive betting market data: consensus lines, sportsbooks’ odds, public betting percentages. Our models aim to spot “edges” when our projections differ meaningfully from current market lines.\nWhat You’ll See in Our NCAAF Projections\n\nFor each game, we provide:\n\nSpread projection: Predicted margin between the two teams (how many points one is favored by).\nMoneyline projection: Odds for each team to win outright.\nOver/Under (Total): Predicted combined points scored by both teams.\nEdge: The difference (as a percentage) between our projection and the consensus/sportsbook line — this helps identify betting value.\nGrade: A letter grade (A-F) reflecting the strength of that edge; helps you quickly see which games to focus on.\nHow to Use Projections in Betting\nSpot the edge: Compare our 2025-26 projections vs current sportsbook lines. An edge of +3.5% or higher often starts to look compelling.\nRespect key numbers: A spread of 6.5 vs. 7, or a total of 49.5 vs. 50.5, can matter significantly because of scoring patterns in football.\nMonitor news up to game day: Last-minute injuries or weather shifts can swing spreads or totals and affect value.\nDiversify bets: Don’t just pick spreads — sometimes moneylines or overs/unders offer better return, depending on matchups.\nUse power ratings: Our projections derive from power ratings that update weekly, reflecting latest performance, rest, injuries, momentum. Use these to compare teams even before lines drop.\nExample: Sample Projections\n\nSay the Georgia Bulldogs have a spread of -6.5 vs. the Florida Gators. In that situation, a spread bet on Georgia would cash if they won by a touchdown or more. A bet on Alabama at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in college football. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NCAAF projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also vital for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Oregon Ducks vs. Oklahoma Sooners game has a total of 64 points: Bettors on the under would cash if the teams combined for 63 or fewer points; over bettors would win at 65 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NCAAF projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Texas Tech Red Raiders are +250 on the moneyline vs. the Clemson Tigers, who are -290. If you bet $10 on Texas Tech and they won, you would receive $25 in profit. A bet on Clemson, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nProjections vs. Public Sentiment\n\nSometimes what our projections say diverges from what the public is betting. These misalignments can signal value:\n\nWhen public heavily backs the favorite, but our model’s projected spread is smaller.\nWhen underdogs get little attention but our model suggests they win outright with reasonable probability.\nWhen totals are inflated by marquee names or high-profile games, but underlying defense/offense metrics suggest lower scoring.\nStay Current: Weekly Updates & Trends\nProjections are refreshed weekly, especially when new stats, injuries, or reports come in.\nWe track which teams are trending up or down — momentum matters.\nBet monitoring: watch how sharp bettors are leaning, and where public money is going. These can influence line movement, sometimes creating last-minute value.\n\nIf you're serious about getting an edge in college football betting, these NCAAF projections are essential. They don't predict upsets or guarantee wins — but they give you a probabilistic foundation to make smarter bets. Use them to find mismatches, exploit line inefficiencies, and avoid getting caught up in hype.\n\nUpdated for the 2026-27 season, our projections reflect the realities of roster shifts, scoring trends, and a tighter market. Bookmark this page, check it weekly, and let the numbers guide you.\n\nIf you want to put these NCAAF projections to work, check out the best college football betting promos or best CFB prediction market promos.\n\nFrequently Asked Questions\nWhat are NCAAF projections?\nWhat NCAAF projections do Action Network experts provide?\nRecent Stories\nSee All\nWilson's NCAAF Week 11 Havoc Pick\nCollin Wilson\n•\n22 mins ago\nOhio vs. Miami (OH): Battle of the Bricks\nRoad ToCFB\n•\n2 hours ago\nWestern Michigan vs. Akron: Beatdown in Rubber City\nJoshua Nunn\n•\n3 hours ago\nKent State vs. Bowling Green: Flashing Lights\nRoad ToCFB\n•\n3 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegali ting data shows what share of bets and what share of money are being placed on each side of a college football game, based on real sportsbook activity we track across the industry.\n\nNCAAF public betting refers to the wagers placed by the general betting population on college football games. Tracking public betting trends helps you see which teams or sides most bettors favor. However, the public isn’t always right, which is why professional bettors, also known as “sharps,” often take the opposite side.\n\nBy combining public betting data with money percentages and total bet volume, you can get a clearer picture of where the smart money is going.\n\nFor example, in Week 1 of the 2025 season, Ohio State opened as a 7.5-point favorite over Texas. Bets skewed toward Ohio State early, but by kickoff the line had moved to 7 despite the majority of bets still on the Buckeyes — a reverse line movement that pointed to sharp money on Texas. That kind of divergence between ticket count and line movement is exactly what public betting data is meant to surface.\n\nTips for Interpreting NCAAF Public Betting\n\nUnderstanding how to interpret NCAAF public betting can provide an edge for college football bettors. Here's a handful of tips from our experts on interpreting NCAAF public betting data.\n\nLook for games where the delta between bet and money percentages is large — these often indicate professional interest.\nAvoid overvaluing data from games with small sample sizes of tracked bets.\nUse public betting data alongside other tools, such as line movement, team stats, and matchup analysis, to make informed decisions.\nTreat public betting data as one input among several, not a standalone system — it's most useful combined with injury news, weather, and situational trends (letdown spots, short weeks, revenge games).\nResponsible gambling note: public and money percentages describe crowd behavior, not guaranteed outcomes. Never bet more than you can afford to lose, and use them as a research tool rather than a betting system on their own.\n\nA concrete example: An Action Network study found that teams receiving fewer than 45% of spread tickets since 2005 went 4,007-4,025-145 against the spread, a 49.9% win rate — essentially break-even, not a strong edge.\n\nHow to Use Public Betting and Money Percentages in College Football Betting\n\nWe house betting data from numerous U.S. online sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every college football game and major bet type. Here's a look at a hypothetical Tennessee-Vanderbilt game.\n\nPercentage (%) of bets: The percentage of wagers on a particular side of a game. If Tennessee vs. Vanderbilt had 20,000 total bets that we've tracked and 12,000 of those are on the Vols, we'd say that Tennessee has received 60% of the bets.\nPercentage (%) of money: This is the same thing except for the money. If we know the total handle, we can then calculate the percentage of money on one side or another of a bet.\n\nCombining those two factors can help college football bettors eye bets that might be worth making. The reason is because not all bets are the same amount of money. A single $10,000 sharp bet can outweigh hundreds of $10 public tickets — which is why money percentage often tells a different story than bet percentage.\n\nThus, the difference between the percentage of money and the percentage of bets can often highlight the games in which pro bettors are getting down action. And, well, they're professional and bet high amounts for a reason: It could be a good bet to take those sides.\n\nIt's also important to look at the total number of bets we're tracking, which you can see on the far right of the table above. The reason is that you don't want to put too much stock in a money vs. bet difference that has a small sample of bets. Utilizing all four factors -- bet percentage, money percentage, bet vs. money percentage (the delta), and total bets -- is recommended when using betting data to gain an advantage.\n\nWhy the Difference Matters\n\nThe difference between the percentage of bets and the percentage of money — sometimes called the “delta” — can highlight games where professional bettors are placing high-stakes wagers.\n\nWhen bet % and money % diverge sharply, it signals sharp (professional) money on one side. For example, 40% of bets but 80% of money on a team suggests a small number of large wagers from sharps rather than broad public support. \n\nScenario: 60% of bets on Tennessee but 80% of the money on them suggests sharp action favoring Tennessee over Vanderbilt.\nSharps bet large amounts for a reason: it could indicate a more favorable line or value that casual bettors might overlook.\n\nWe track this kind of split throughout the week across the CFB slate. In the hypothetical example above, the line held steady from open to close even as public tickets piled up on Tennessee — the kind of resistance that often accompanies sharp money quietly balancing the book on the other side. Watching for that pattern, rather than reacting to a single day's number, is where public betting data earns its keep.\n\nIf you want to apply NCAAF public betting insights, claim these NCAAF betting promos and/or NCAAF prediction market promos.\n\nFrequently Asked Questions\nWhat is a point spread in college football betting?\nWhat is a total or over/under bet in a college football game?\nHow do moneylines work in college football betting?\nWhere can I bet on college football?\nRecent Stories\nSee All\nWilson's NCAAF Week 11 Havoc Pick\nCollin Wilson\n•\n23 mins ago\nOhio vs. Miami (OH): Battle of the Bricks\nRoad ToCFB\n•\n2 hours ago\nWestern Michigan vs. Akron: Beatdown in Rubber City\nJoshua Nunn\n•\n3 hours ago\nKent State vs. Bowling Green: Flashing Lights\nRoad ToCFB\n•\n3 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lin on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NBA Projections\n\nOur NBA experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NBA: They're simply bets on the margin of victory. Say the Los Angeles Lakers have a spread of -6.5 vs. the Sacramento Kings. In that situation, a spread bet on the Lakers would cash if they won by a 7 points or more. A bet on the Kings at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Boston Celtics vs. New York Knicks game has a total of 205 points: Bettors on the under would cash if the teams combined for 206 or fewer points; over bettors would win at 204 or more. An exact total of 205 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Orlando Magic are +250 on the moneyline vs. the Chicago Bulls, who are -290. If you bet $10 on the Magic and they won, you would receive $25 in profit. A bet on the Bulls, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NBA Projections?\nWhat NBA projections do The Action Network experts provide?\nRecent Stories\nSee All\n8 NBA Best Bets for Tuesday\nAction Network Staff\n•\n14 mins ago\nThunder vs Blazers: SGA Will Exploit This Schematic Flaw\nAndrew O'Connor-Watts\n•\n1 hour ago\nMagic vs Kings: BK's +154 SGP for Tuesday Night\nAction Network Staff\n•\n1 hour ago\nHeat vs Jazz: Fade This Market Overreaction\nMichael Fiddle\n•\n1 hour ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Code\nPolymarket Promo Code\  is important information because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet.\n\nTherefore, looking at the difference between the percentage of bets and the percentage of money can help The Action Network users find the NBA sides that have \"sharp money\" -- in other words, those wagered on by pros. We also have expert NBA picks coverage.\n\nHere's another example: Say the Miami Heat are getting 69% of the spread bets against the Dallas Mavericks, but 92% of the money bet on that game's spread is on the Heat. That would be a percentage difference of 23% on the Heat, highlighting that the bettors willing to wager a lot of money -- these are likely to be sharp and pro bettors -- are on Miami.\n\nOf course, it's also important to look at the total number of bets placed on the market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nFrequently Asked Questions\nWhat is a point spread in NBA betting?\nWhat is a total or over/under bet in an NBA game?\nHow do moneylines work in NBA betting?\nWhere can I bet on the NBA?\nRecent Stories\nSee All\n8 NBA Best Bets for Tuesday\nAction Network Staff\n•\n14 mins ago\nThunder vs Blazers: SGA Will Exploit This Schematic Flaw\nAndrew O'Connor-Watts\n•\n1 hour ago\nMagic vs Kings: BK's +154 SGP for Tuesday Night\nAction Network Staff\n•\n1 hour ago\nHeat vs Jazz: Fade This Market Overreaction\nMichael Fiddle\n•\n1 hour ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds ive you the best line, which can be confusing for props.\n\nFor example, should you bet Anthony Davis over 8.5 rebounds at -132 at FanDuel, or over 9.5 rebounds at +100 at BetMGM? We do the math for you and display it in the \"best odds\" column. The answer here is 8.5 with the juice.\n\nClick \"see all\" to expand the view and dive deeper into each market.\n\nProp Picks for Today\n\nOur experts track all their prop bets in the Action Network app, and those bets will show on this page, broken down by game.\n\nYou can follow our experts, or tail the bets on your own profile.\n\nNBA Player Props FAQs\nWhere can I bet NBA player props?\nAlmost every major American sportsbook will offer NFL player props, though some have more than others. DraftKings and FanDuel are two of the market leaders in NBA prop offerings.\nWhat kind of NBA props do sportsbooks offer?\nWithout the emergence of props, NBA betting wouldn't be where it is today. Sportsbooks continue to add new offerings Here are some other props offered: Over/under player points, like Kevin Durant over 27.5 Player to record a double-double Player to score the first basket Over/under combined steals and blocks\nAre NBA props a good bet?\nIt always depends on the specific bet and market you're taking, but generally, props are easier to beat than full-game moneylines, spreads and totals. Because there are so many players to price in so many statistical categories, you can get an edge by specializing in a certain team or market. The betting limits are also lower, which attracts fewer sharp bettors who have the ability to move lines early.\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysi eflection of what to expect in a game.\n\nWe project the three big markets in college basketball betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NCAAB projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NCAAB Projections\n\nOur college basketball experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on college basketball: They're simply bets on the margin of victory. Say the Gonzaga Bulldogs have a spread of -6.5 vs. the UCLA Bruins. In that situation, a spread bet on Gonzaga would cash if they won by a 7 points or more. A bet on UCLA at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Baylor Bears vs. Arizona Wildcats game has a total of 175 points: Bettors on the under would cash if the teams combined for 174 or fewer points; over bettors would win at 175 or more. An exact total of 175 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Ohio State Buckeyes are +250 on the moneyline vs. the Michigan Wolverines, who are -290. If you bet $10 on the Buckeyes and they won, you would receive $25 in profit. A bet on the Wolverines, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NCAAB projections?\nWhat NCAAB projections do The Action Network experts provide?\nRecent Stories\nSee All\n3 NCAAB Champions Classic Player Props\nAlex Hinton\n•\n15 mins ago\nKansas vs Kentucky: Night Cap Champions Classic Betting Guide\nRyan Minion\n•\n2 hours ago\nCreighton vs Kansas State: Good Opportunity for Rechsteiner\nJonathan Jorcin\n•\n2 hours ago\nPRO\n3 Sharp-Model Hoops Picks\ , when fans can begin to sniff the return of March Madness. That's translated to a lot of money wagered on the sport now that online sports betting is legal in several states.\n\nNot every wager is the same amount, however, and college basketball bettors who pay attention to Action Network's public betting data can spot sharp bets.\n\nPrediction markets also offer NCAAB markets on apps like Kalshi, Polymarket or Novig. If you are new to prediction markets, try out some of our exclusive new user offers with the Polymarket promo code or Kalshi promo code today.\n\nHow to Use Public Betting and Money Percentages in NCAAB Betting\n\nWe track betting data at a variety of sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every college basketball game and bet type. This will help you make more informed decisions.\n\nPercentage (%) of bets: The proportion of bets made on a side of a wager. For example, if we track 20,000 bets on the Alabama-Auburn game and 13,000 of them are on the Tigers, that would be 65% of bets on the Tigers.\nPercentage (%) of money: The proportion of money bet on a side of a wager. For example, if we track a total handle — a betting term that means \"amount wagered\" — of $6 million and $5 million is on the Crimson Tide, that would be 83% of the money on the Crimson Tide.\n\nThis is important information for NCAA basketball betting because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000 based on what they see in terms of Action Network NCAAB odds. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet.\n\nTherefore, looking at the difference between the betting percentages and percentage of money can help The Action Network users find the NCAAB sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NCAAB picks coverage.\n\nHere's another example: Say the Syracuse Orange are g n50\n\t\n-152\n+125\n\t\n-151\n+151\n\t\n-165\n+136\n\t\nD\nD\n\t\n-2.1%\n-2.6%\n\t\n-156\n+160\n\t\n92%\n8%\n\t\n94%\n6%\n\n\n7:30 PM\nPanthers\n43\nBlue Jackets\n44\n\t\n-111\n-111\n\t\n-109\n+109\n\t\n-120\n+100\n\t\nD\nD\n\t\n-2.3%\n-2.2%\n\t\n-106\n+108\n\t\n74%\n26%\n\t\n66%\n34%\n\nA lot of factors are considered by expert NHL bettors, both in terms of on-field performance and the betting market. For example, many smart bettors are keenly aware of line movement and which sportsbooks post the best prices. But one of the most important factors is building out NHL projections that can be measured against lines in the market.\n\nHow NHL Projections Work\n\nThere are many ways to build NHL projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, NHL handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NHL projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NHL betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NHL projections to be aware of news and injuries.\n\nGoal lines don't move much considering the close nature of final scores in hockey. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-ice advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NHL Projections\n\nOur NHL experts will provide consensus projections for every NHL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but with baseball, spread numbers won't vary much no matter the book. The majority of hockey goal-lines will be +/- 1.5 because of how close games can be.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NHL: They're simply bets on the margin of victory. Say the Pittsburgh Penguins have a spread of -1.5 vs. the New York Islanders. In that situation, a spread bet on the Penguins would cash if they won by a 2 goals or more. A bet on the Islanders at +1.5 would cash if they won the game outright or merely lost by 1 goal.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Florida Panthers vs. Columbus Blue Jackets game has a total of 7 goals: Bettors on the under would cash if the teams combined for 6 or fewer goals; over bettors would win at 8 or more. An exact total of 8 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NHL projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the San Jose Sharks are +250 on the moneyline vs. the Vancouver Canucks, who are -290. If you bet $10 on the Sharks and they won, you would receive $25 in profit. A bet on the Canucks, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NHL projections?\nWhat NHL projections do The Action Network experts provide?\nRecent Stories\nSee All\nRed Wings vs Blues: Value on Snuggerud\nAction Network Staff\n•\n4 mins ago\nWild vs Canadiens: Elite Goaltending Duel\nNick Martin\n•\n9 mins ago\nPredators vs Kings: Our System-Backed Prediction for Tonight\nAction Network Staff\n•\n21 mins ago\nDevils vs Jets: Heat in the Tundra\nGreg Liodice\n•\n27 mins ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Code\nPolymarket Pro r of $5 while others might bet $5,000. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet for NHL betting.\n\nTherefore, looking at the difference between the percentage of bets and percentage of money can help The Action Network users find the NHL sides that have \"sharp money\" -- in other words, those wagered on by pros. We also have expert NHL picks coverage.\n\nHere's another example: Say the Florida Panthers are getting 69% of the spread bets against the Nashville Predators, but 92% of the money bet on that game's spread is on the Predators. That would be a percentage difference of 23% on the Predators, highlighting that the bettors willing to wager a lot of money -- these are likely to be sharp and pro bettors -- are on Nashville for the overall public opinion.\n\nOf course, it's also important to look at the total number of bets placed on the market for your betting strategy, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nFrequently Asked Questions\nWhat is a goal-line spread in NHL betting?\nWhat is a total or over/under bet in an NHL game?\nHow do moneylines work in NHL betting?\nWhere can I bet on hockey?\nRecent Stories\nSee All\nRed Wings vs Blues: Value on Snuggerud\nAction Network Staff\n•\n5 mins ago\nWild vs Canadiens: Elite Goaltending Duel\nNick Martin\n•\n9 mins ago\nPredators vs Kings: Our System-Backed Prediction for Tonight\nAction Network Staff\n•\n22 mins ago\nDevils vs Jets: Heat in the Tundra\nGreg Liodice\n•\n27 mins ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betti SC (W)\n\t\n+38.5\n-38.5\n\t\nN/A\nN/A\n\t\n\t\n\t\n\t\nN/A\n\n\n2ND 0:54\nBellarmine (W)\nBowling Green (W)\n\t\n\t\nN/A\nN/A\n\t\n\t\n\t\n\t\nN/A\n\n\nHALF\nYoungstown State (W)\nToledo (W)\n\t\n\t\nN/A\nN/A\n\t\n\t\n\t\n\t\nN/A\nPublic Betting 101\n\nPublic betting refers to the collective wagering behavior of the general betting population on a given sporting event, usually measured as the percentage of bets or money landing on each side of a market. Sportsbooks and data sites aggregate that activity into “betting splits” so you can see where the majority of bettors are leaning. Betting trends can also be identified by reviewing Prediction markets, like Polymarket & Kalshi who also provide information about volume of bets and volume of money per market. If you havent traded on a prediction market yet, we strongly advise you to check out our Kalshi promo code and Polymarket promo code, before you sign up!\n\nTwo ways of measuring how the general public is betting\n\nTickets (% of bets): the share of individual wagers on each side. If 70% of tickets are on Team A, seven out of ten bettors picked them, regardless of how much each person staked.\nMoney (% of money): the share of total dollars wagered on each side. Because a few large bets can outweigh many small ones, money and ticket percentages often differ. This is particularly useful information when looking on prediction markets, where sometimes just a few people own a large portion of the contracts available.\n\nWho “the public” is\n\nThe term mostly describes recreational bettors: casual fans who bet for fun, often on favorites, popular teams, overs, and games with heavy media attention. It is usually contrasted with “sharps,” professional or highly informed bettors who wager larger amounts and tend to focus on pricing and value rather than team popularity. On prediction markets, a number of market makers and institutions trade the same contracts as everyone else, so its worth identifying differences between Sportsbook odds and Prediction market odds frequently with that disparity in mind.\n\nWhy anyone tracks it\n\nGauging sentiment: splits show which outcomes are popular and which are being ignored.\nUnderstanding line movement: books adjust odds based on the size and source of wagers, so splits help explain why a number moved.\nFading or tailing: some bettors “fade the public” by betting the unpopular side, on the theory that popular picks are often overpriced. Others tail it when the crowd has been right.\n\nImportant caveats\n\nPublic sentiment alone isn’t a reliable edge. Fading the public isn’t automatically profitable, and the public wins plenty of the time.\nSplits vary by source, since each sportsbook has its own customer base, and aggregated data is only an approximation of the whole market.\nBooks price lines to manage their own risk and expected profit, not just to balance the action, so a lopsided split doesn’t always mean the book is exposed.\n\nNFL Public Betting\n\nNFL public betting trends for the 2026-27 season reveal how bettors are wagering across spreads, totals, and moneylines. The tables above display the latest NFL public betting splits for every game of the 2026-27 NFL season (filtered by week). You can see the breakdown in '% of bets' and '% of money' for the moneyline, spread, and total for all matchups.\n\nNFL public betting splits are updated in realtime; the data presented in the public betting chart is an average of the NFL public bets and NFL public money from multiple North American and global sportsbooks that are approved.\n\nNBA Public Betting\n\nThe NBA’s global popularity, driven by international stars, combined with legal online sports betting in many U.S. states, has led to a lot of money being wagered on the sport. Our NBA public betting page tracks the same two key measures as NFL for major sportsbooks: the percentage of bets, and the percentage of money.\n\nRecent Stories\nSee All\nSports Betting Odds\nNFL Odds & Betting Lines\   const ps=g.picks||[]; if(!ps.length) return '';
  return `<div class="sec"><h4>Expert picks (${ps.length})</h4>${ps.map(p=>`<div class="pick"><b>${esc(p.Pick)}</b> ${p.Units?`<span class="badge">${esc(p.Units)}</span>`:''}<div class="who">${esc(p.Analyst)}${p.Record?' · '+esc(p.Record):''}${p.Posted?' · '+esc(p.Posted):''}</div>${p.Note?`<div class="note">${esc(p.Note)}</div>`:''}</div>`).join('')}</div>`;
}
function fstTips(f, headTitle){
  if(!f||!(f.tips||[]).length) return '';
  const ts=f.tips, own=ts.filter(t=>t.source!=='acca'), acc=ts.filter(t=>t.source==='acca');
  const row=t=>`<div class="pick fst"><b>${esc(t.pick)}</b><span class="od">${t.odds_us!=null?am(t.odds_us):''}</span>${t.odds_frac?` <span class="meta">(${esc(t.odds_frac)})</span>`:''}${t.confidence?`<span class="conf" title="confidence">${'★'.repeat(Math.min(5,+t.confidence||0))}</span>`:''}
    <div class="who">${t.market?esc(t.market):''}${t.source==='acca'?`${t.market?' · ':''}leg of their ${esc(t.product)}${t.product_legs?` (${t.product_legs} legs${t.product_odds_frac?', '+esc(t.product_odds_frac):''})`:''}`:''}</div>${t.reason?`<div class="note">${esc(t.reason)}</div>`:''}</div>`;
  return `<div class="sec"><h4>${headTitle||'freesupertips'} (${ts.length})</h4>${own.map(row).join('')}${acc.map(row).join('')}${f.url?`<div class="legend"><a href="${esc(f.url)}" target="_blank" rel="noopener">Full preview on freesupertips.com &rarr;</a></div>`:''}</div>`;
}
function fstCard(f){
  const id='fst:'+f.name;
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(f.start)}</span>
    <div class="gteams">${esc(f.home||'')} <span class="meta">vs</span> ${esc(f.away||'')}${f.league?`<small>${esc(f.league)}</small>`:''}</div>
    <span class="badge fst">${f.tips.length} tip${f.tips.length===1?'':'s'}</span></div><div class="gbody">${fstTips(f)}</div></div>`;
}
function arts(list, title){
  if(!(list||[]).length) return '';
  return `<div class="sec"><h4>${title}</h4><ul class="arts">${list.map(a=>`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></li>`).join('')}</ul></div>`;
}
function extra(g){
  const o=g.odds||{}; const shown=/^(ml|spread|total|over|under|draw|ml_draw)(_|$)/;
  const rest=Object.entries(o).filter(([k])=>!shown.test(k)||/(tickets|sharp)/.test(k));
  return rest.length?`<div class="sec"><h4>More from the odds feed</h4><div class="kv">${rest.map(([k,v])=>`<span><b>${esc(k.replace(/_/g,' '))}</b> ${esc(v)}</span>`).join('')}</div></div>`:'';
}
function card(g){
  const id = g.sport+':'+g.id, t=g.teams||[];
  const live = /live|in_progress|progress|1st|2nd|3rd|half|quarter|period/i.test(g.status||'');
  const score = g.score?` · ${g.score[0]}-${g.score[1]}`:'';
  const at = (g.sides||[])[0]==='away' ? '@' : 'vs';
  const head = t.length===2?`${esc(t[0])} <span class="meta">${at}</span> ${esc(t[1])}`:esc(g.title);
  const sub = [g.league_name&&g.league_name!==g.league?g.league_name:'', g.broadcast||'', g.num_bets?Number(g.num_bets).toLocaleString()+' bets':''].filter(Boolean).join(' · ');
  const body = oddsTable(g)+bars(g)+pro(g)+picks(g)+fstTips(g.fst)+arts(g.articles,'Articles')+extra(g)
    +(g.hub?`<div class="sec"><a href="${esc(g.hub)}" target="_blank" rel="noopener">Open on Action Network &rarr;</a></div>`:'');
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(g.start)}</span>
    <div class="gteams">${head}${sub?`<small>${esc(sub)}</small>`:''}</div>
    ${(g.picks||[]).length?`<span class="badge">${g.picks.length} picks</span>`:''}${g.fst&&g.fst.tips.length?`<span class="badge fst">${g.fst.tips.length} FST</span>`:''}<span class="badge${live?' live':''}">${esc(g.status||'')}${score}</span></div>
    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;
}
function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
</html>
