n-102\n\t\n43%\n57%\n\t\n63%\n37%\n\n\n1ST 10:54\nBelmont\n605\nAkron\n606\n\t\n+2.5\n-2.5\n\t\n\t\n+2.5\n-8.5\n\t\n--\n--\n\t\n--\n--\n\t\n+6.5\n-122\n-2.5\n-102\n\t\n64%\n36%\n\t\n62%\n38%\n\n\nFinal - OT\nWright State\n601\nSt. Bonaventure\n602\n\t\n-1.5\n+1.5\n\t\n\t\n-1.5\n+1.5\n\t\n--\n--\n\t\n--\n--\n\t\n-1\n-105\n+26.5\n-102\n\t\n58%\n42%\n\t\n66%\n34%\n\nA lot of factors are considered by expert NCAAB bettors, both in terms of on-field performance and the betting market. For example, many smart bettors are keenly aware of line movement and which sportsbooks post the best prices. But one of the most important factors is building out NCAAB projections that can be measured against lines in the market.\n\nHow NCAAB Projections Work\n\nThere are many ways to build NCAAB projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, college basketball handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NCAAB projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in college basketball betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NCAAB projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NCAAB Projections\n\nOur college basketball experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on college basketball: They're simply bets on the margin of victory. Say the Gonzaga Bulldogs have a spread of -6.5 vs. the UCLA Bruins. In that situation, a spread bet on Gonzaga would cash if they won by a 7 points or more. A bet on UCLA at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Baylor Bears vs. Arizona Wildcats game has a total of 175 points: Bettors on the under would cash if the teams combined for 174 or fewer points; over bettors would win at 175 or more. An exact total of 175 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Ohio State Buckeyes are +250 on the moneyline vs. the Michigan Wolverines, who are -290. If you bet $10 on the Buckeyes and they won, you would receive $25 in profit. A bet on the Wolverines, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NCAAB projections?\nWhat NCAAB projections do The Action Network experts provide?\nRecent Stories\nSee All\nKansas State vs Gonzaga: 1H Bet to Make\nJonathan Jorcin\n•\n54 mins ago\nCollege Basketball Picks Tonight: Best Trades and Predictions for Tuesday\nPablo Planovsky\n•\n58 mins ago\nSt. John's vs Oregon: Wide Talent Gap\nJonathan Jorcin\n•\n2 hours ago\nAlabama vs Baylor: Fast Pace Expected\nJonathan Jorcin\n•\n3 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKan  \"amount wagered\" — of $6 million and $5 million is on the Crimson Tide, that would be 83% of the money on the Crimson Tide.\n\nThis is important information for NCAA basketball betting because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000 based on what they see in terms of Action Network NCAAB odds. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet.\n\nTherefore, looking at the difference between the betting percentages and percentage of money can help The Action Network users find the NCAAB sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NCAAB picks coverage.\n\nHere's another example: Say the Syracuse Orange are getting 69% of the spread bets against the Duke Blue Devils, but 92% of the money bet on that game's spread is on the Orange. That would be a percentage difference of 23% on the Orange, highlighting that the bettors willing to wager a lot of money — these are likely to be sharp bettors — are on Syracuse. These are what's known as NCAAB consensus picks.\n\nOf course, it's also important to look at the total number of bets placed on the NCAA college basketball market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more as a betting strategy.\n\nFrequently Asked Questions\nWhat is a point spread in NCAAB betting?\nWhat is a total or over/under bet in an NCAAB game?\nHow do moneylines work in NCAAB betting?\nWhere can I bet on college basketball?\nRecent Stories\nSee All\nKansas State vs Gonzaga: 1H Bet to Make\nJonathan Jorcin\n•\n55 mins ago\nCollege Basketball Picks Tonight: Best Trades and Predictions for Tuesday\nPablo Planovsky\n•\n58 mins ago\nSt. John's vs Oregon: W }
function fstCard(f){
  const id='fst:'+f.name;
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(f.start)}</span>
    <div class="gteams">${esc(f.home||'')} <span class="meta">vs</span> ${esc(f.away||'')}${f.league?`<small>${esc(f.league)}</small>`:''}</div>
    <span class="badge fst">${f.tips.length} tip${f.tips.length===1?'':'s'}</span></div><div class="gbody">${fstTips(f)}</div></div>`;
}
function arts(list, title){
  if(!(list||[]).length) return '';
  return `<div class="sec"><h4>${title}</h4><ul class="arts">${list.map(a=>`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></li>`).join('')}</ul></div>`;
}
function extra(g){
  const o=g.odds||{}; const shown=/^(ml|spread|total|over|under|draw|ml_draw)(_|$)/;
  const rest=Object.entries(o).filter(([k])=>!shown.test(k)||/(tickets|sharp)/.test(k));
  return rest.length?`<div class="sec"><h4>More from the odds feed</h4><div class="kv">${rest.map(([k,v])=>`<span><b>${esc(k.replace(/_/g,' '))}</b> ${esc(v)}</span>`).join('')}</div></div>`:'';
}
/* ===== Form & matchup block (Action Network game Overview data, an_overview.py) 2026-11-12 ===== */
const OV_STATS = {
  basket: [['pf','Points',0,1],['pa','Points allowed',1,1],['margin','Point margin',0,'+'],['fg_pct','Field goal %',0,'%'],
           ['three_pct','3-point %',0,'%'],['three_made','3s made',0,1],['ft_pct','Free throw %',0,'%'],['fta','Free throw att',0,1],
           ['reb','Rebounds',0,1],['ast','Assists',0,1],['tov','Turnovers',1,1],['stl','Steals',0,1],['blk','Blocks',0,1],['pfoul','Fouls',1,1]],
  foot: [['pf','Points',0,1],['pa','Points allowed',1,1],['margin','Point margin',0,'+'],['pass_yds','Pass yards',0,1],
         ['pass_ypa','Yards / pass',0,2],['rush_yds','Rush yards',0,1],['rush_ypc','Yards / rush',0,2],['third_pct','3rd down %',0,'%'],
         ['rz_pct','Red zone TD %',0,'%'],['ints','Interceptions thrown',1,2],['sacks','Sacks taken',1,2],['first_downs','First downs',0,1]],
  other: [['pf','Scored',0,2],['pa','Allowed',1,2],['margin','Margin',0,'+']]
};
const OV_FAM = sp => /^(nba|ncaab|ncaaw|wnba)$/.test(sp) ? 'basket' : /^(nfl|ncaaf|cfb)$/.test(sp) ? 'foot' : 'other';
function ovCss(){
  if(document.getElementById('ovCss')) return;
  const st=document.createElement('style'); st.id='ovCss';
  st.textContent=`.ov-wrap{margin-top:4px}.ov-wrap h5{margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted,#9199a7)}
  .ov-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  .ov-t th,.ov-t td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line,#2f3540);white-space:nowrap}
  .ov-t th{font-weight:600;color:var(--muted,#9199a7);font-size:12px}.ov-t td:first-child,.ov-t th:first-child{text-align:left}
  .ov-t .lab{color:var(--muted,#9199a7);font-size:12px}.ov-w{color:#3cc48f}.ov-l{color:#ee6b5b}.ov-p{color:var(--muted,#9199a7)}
  .ov-best{color:#3cc48f;font-weight:600}.ov-rk{color:var(--muted,#9199a7);font-size:11px;margin-left:3px}
  .ov-team{font-weight:600;margin:10px 0 2px}.ov-team span{color:var(--muted,#9199a7);font-weight:400;font-size:12px;margin-left:6px}
  .ov-note{color:var(--muted,#9199a7);font-size:11px;margin-top:4px}.ov-scroll{overflow-x:auto}`;
  document.head.appendChild(st);
}
function ovBlock(g, secClass){
  const ov=g&&g.overview; if(!ov||!ov.sides) return '';
  ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const A=ov.sides.away||{}, Hm=ov.sides.home||{}, sp=g.sport||g.league||'';
  const rec=r=>!r?'–':(r[0]+'-'+r[1]+(r[2]?'-'+r[2]:''));
  const pctOf=r=>r&&(r[0]+r[1])?r[0]/(r[0]+r[1]):null;
  const tint=(r)=>{ const p=pctOf(r); return p==null?'':p>=0.6?'ov-w':p<=0.4?'ov-l':''; };
  const cell=r=>`<td class="${tint(r)}">${rec(r)}</td>`;
  const o=g.odds||{};
  const favSide = o.spread_away!=null ? (+o.spread_away<0?'away':+o.spread_away>0?'home':null)
                : o.ml_away!=null&&o.ml_home!=null ? (+o.ml_away<+o.ml_home?'away':'home') : null;
  const streak=s=>s==null||s===0?'':(s>0?'W'+s:'L'+(-s));
  const num=(v,f)=>v==null?'–':f==='%'?(+v).toFixed(1)+'%':f==='+'?((+v>0?'+':'')+(+v).toFixed(1)):(+v).toFixed(f===2?2:1).replace(/\.0$/,'');
  // 1. situational records
  const sitTable=(t,side)=>{
    const s=t.sit; if(!s||!s.splits) return '';
    const S=s.splits, venue=side==='home'?'home':'road', role=favSide?(favSide===side?'fav':'dog'):null;
    const rows=[['Overall','overall'],['Last 5','last_5'],['Last 10','last_10'],[side==='home'?'At home':'On the road',venue]];
    if(role) rows.push([role==='fav'?'As favorite':'As underdog',role]);
    const body=rows.filter(([,k])=>S[k]).map(([l,k])=>`<tr><td class="lab">${l}</td>${cell(S[k].su)}${cell(S[k].ats)}<td>${S[k].ou?S[k].ou[0]+'-'+S[k].ou[1]+(S[k].ou[2]?'-'+S[k].ou[2]:''):'–'}</td></tr>`).join('');
    const pf=s.pf!=null?` · ${num(s.pf)} for / ${num(s.pa)} against`:'';
    return `<div class="ov-team">${e(t.abbr||t.name)}<span>${side} · ${s.w}-${s.l}${streak(s.streak)?' · '+streak(s.streak):''}${pf}</span></div>
      <table class="ov-t"><tr><th></th><th>SU</th><th>ATS</th><th>O-U</th></tr>${body}</table>`;
  };
  // 2. last 5 games
  const res=(v,txt)=>`<span class="${v==='W'||v==='O'?'ov-w':v==='L'||v==='U'?'ov-l':'ov-p'}">${txt}</span>`;
  const lastTable=(t,rows)=>{
    if(!(rows||[]).length) return '';
    const d=s=>{ const p=String(s).split('-'); return p.length===3?(+p[1])+'/'+(+p[2]):s; };
    return `<div class="ov-team">${e(t)}</div><div class="ov-scroll"><table class="ov-t"><tr><th>Date</th><th>Opp</th><th>Result</th><th>ATS</th><th>O-U</th></tr>${rows.map(r=>
      `<tr><td class="lab">${d(r.date)}</td><td>${r.ha} ${e(r.opp)}</td><td>${res(r.res,r.res+' '+e(r.score))}</td>`+
      `<td>${r.spread==null?'–':res(r.ats,(r.spread>0?'+':'')+r.spread+' '+(r.ats||''))}</td>`+
      `<td>${r.total==null?'–':res(r.ou,(r.ou||'')+' '+r.total)}</td></tr>`).join('')}</table></div>`;
  };
  // 3. stat matchup
  const fam=OV_FAM(String(sp).toLowerCase()), defs=OV_STATS[fam];
  const sa=A.stats||{}, sh=Hm.stats||{}, ra=A.ranks||{}, rh=Hm.ranks||{};
  const ord=n=>n+(['th','st','nd','rd'][((n%100)-20)%10]||['th','st','nd','rd'][n%100]||'th');
  const statRows=defs.filter(([k])=>sa[k]!=null||sh[k]!=null).map(([k,l,low,f])=>{
    const a=sa[k], b=sh[k]; const better=a==null||b==null||a===b?null:((a<b)===!!low?'a':'b');
    const rk=r=>r?`<span class="ov-rk">${ord(r[0])}</span>`:'';
    return `<tr><td class="${better==='a'?'ov-best':''}">${num(a,f)}${rk(ra[k])}</td><td class="lab">${l}</td><td class="${better==='b'?'ov-best':''}">${num(b,f)}${rk(rh[k])}</td></tr>`;
  }).join('');
  const pool=ov.rank_pool;
  let h=`<div class="${secClass||'ui-sec'} ov-wrap"><h4>Form &amp; matchup</h4>`;
  const sit=sitTable(A,'away')+sitTable(Hm,'home');
  if(sit) h+=`<h5>Records (straight up, against the spread, over-under)</h5>${sit}`;
  if((ov.h2h||[]).length) h+=`<h5>Head to head (recent)</h5>${lastTable('Results from '+(ov.h2h[0].team||'')+"'s side",ov.h2h)}`;
  const l5=lastTable((A.abbr||'Away')+' last 5',A.last)+lastTable((Hm.abbr||'Home')+' last 5',Hm.last);
  if(l5) h+=`<h5>Recent games, closing line</h5>${l5}`;
  if(statRows) h+=`<h5>Season stats</h5><table class="ov-t"><tr><th>${e(A.abbr||'Away')}</th><th></th><th>${e(Hm.abbr||'Home')}</th></tr>${statRows}</table>
    <div class="ov-note">${fam==='foot'?'Per game. ':''}Green = better side. ${pool?`Rank = among the ${pool} teams our Action Network runs have seen this season (grows as more games are scraped).`:''} Action's site has no defensive breakdown beyond points allowed.</div>`;
  return h+`</div>`;
}

/* ===== From the articles (an_articles.py: picks + key facts per game, no links) 2026-11-12 ===== */
function notesBlock(g, secClass){
  const n=g&&g.article_notes; if(!n||(!n.summary&&!(n.picks||[]).length&&!(n.facts||[]).length)) return '';
  if(typeof ovCss==='function') ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(!document.getElementById('anCss')){ const st=document.createElement('style'); st.id='anCss';
    st.textContent=`.an-pick{padding:5px 0;border-bottom:1px solid var(--line,#2f3540)}.an-pick b{font-weight:600}
    .an-src{color:var(--muted,#9199a7);font-size:12px}.an-fact{display:flex;gap:8px;padding:5px 0;font-size:13px;line-height:1.35}
    .an-tag{flex:0 0 auto;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--raised,#252a33);color:var(--muted,#9199a7);height:fit-content}
    .an-tag.Injury{color:#ee6b5b}.an-tag.Spot{color:#e7b453}.an-tag.Form{color:#3cc48f}.an-tag.Numbers{color:#a9c1ff}
    .an-sum{font-size:14.5px;line-height:1.5;margin:6px 0 4px}.an-det{margin-top:8px}.an-det summary{cursor:pointer;font-size:13px;color:var(--muted,#9199a7);padding:4px 0}`;
    document.head.appendChild(st); }
  const label={Injury:'Injury',Spot:'Spot',Form:'Form',Numbers:'Numbers',Note:'Note'};
  const picks=(n.picks||[]).map(p=>`<div class="an-pick"><b>${e(p.pick)}</b>${p.play_to?` <span class="an-src">play to ${e(p.play_to)}</span>`:''}<div class="an-src">${p.by?e(p.by)+' · ':''}${e(p.src||'')}</div></div>`).join('');
  const facts=(n.facts||[]).map(f=>`<div class="an-fact"><span class="an-tag ${e(f.tag)}">${e(label[f.tag]||f.tag)}</span><span>${e(f.text)}</span></div>`).join('');
  /* 2026-11-18: Codex-written summary (an_summary.py) on top; the fact list folds under Details */
  const h5=t=>`<h5 style="margin:10px 0 2px;font-size:13px;color:var(--muted,#9199a7)">${t}</h5>`;
  const fromData=n.summary_src==='data';
  const sum=n.summary?`<p class="an-sum">${e(n.summary)}</p>${fromData?'<div class="an-src">No article on this game - written from the odds, betting splits, picks, form and stats.</div>':''}`:'';
  const factHtml=facts?(sum?`<details class="an-det"><summary>Details from the articles (${(n.facts||[]).length})</summary>${facts}</details>`:h5('Key facts')+facts):'';
  return `<div class="${secClass||'ui-sec'}"><h4>${fromData?'Game summary':`From the articles${n.n_articles?` (${n.n_articles})`:''}`}</h4>${sum}${picks?h5('Picks')+picks:''}${factHtml}</div>`;
}

function card(g){
  const id = g.sport+':'+g.id, t=g.teams||[];
  const live = /live|in_progress|progress|1st|2nd|3rd|half|quarter|period/i.test(g.status||'');
  const score = g.score?` · ${g.score[0]}-${g.score[1]}`:'';
  const at = (g.sides||[])[0]==='away' ? '@' : 'vs';
  const head = t.length===2?`${esc(t[0])} <span class="meta">${at}</span> ${esc(t[1])}`:esc(g.title);
  const sub = [g.league_name&&g.league_name!==g.league?g.league_name:'', g.broadcast||'', g.num_bets?Number(g.num_bets).toLocaleString()+' bets':''].filter(Boolean).join(' · ');
  const body = oddsTable(g)+bars(g)+ovBlock(g,'sec')+pro(g)+picks(g)+notesBlock(g,'sec')+fstTips(g.fst)+extra(g)
    +(g.hub?`<div class="sec"><a href="${esc(g.hub)}" target="_blank" rel="noopener">Open on Action Network &rarr;</a></div>`:'');
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(g.start)}</span>
    <div class="gteams">${head}${sub?`<small>${esc(sub)}</small>`:''}</div>
    ${(g.picks||[]).length?`<span class="badge">${g.picks.length} picks</span>`:''}${g.fst&&g.fst.tips.length?`<span class="badge fst">${g.fst.tips.length} FST</span>`:''}<span class="badge${live?' live':''}">${esc(g.status||'')}${score}</span></div>
    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;
}
function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
</html>
