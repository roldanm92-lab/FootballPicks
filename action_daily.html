 or more if a star is suddenly ruled out on a Sunday morning. Other positions are less valuable to the spread, which might surprise a casual gambler. Notably, running backs -- even the very best ones that are popular in fantasy football -- rarely move betting lines if they're unable to play for whatever reason.\n\nUsing those advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense/defense/special teams, player values, news, predicting home-field advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NFL Projections\n\nOur NFL experts will provide consensus projections for every NFL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NFL: They're simply bets on the margin of victory. Say the Baltimore Ravens have a spread of -6.5 vs. the Arizona Cardinals. In that situation, a spread bet on the Ravens would cash if Baltimore won by a touchdown or more. A bet on the Cardinals at +6.5 would cash if the Cardinals won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in the NFL. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NFL projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also important for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Tennessee Titans vs. Philadelphia Eagles game has a total of 47 points: Bettors on the under would cash if the teams combined for 46 or fewer points; over bettors would win at 48 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NFL projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Detroit Lions are +250 on the moneyline vs. the Chicago Bears, who are -290. If you bet $10 on the Lions and they won, you would receive $25 in profit. A bet on the Bears, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NFL project  vs % of money\nWeekly public betting percentages\nTrends from past NFL seasons\nWhat is NFL Public Betting?\n\nNFL public betting shows the percentage of bets placed on each side of a wager, usually tracked across major sportsbooks. If you want to compare these against prediction markets like Polymarket, Kalshi or Novig amongst others, we recommend signing up using either our Polymarket promo code, our Kalshi promo code or our Novig promo code.\n\nKey metrics to know:\n\nPercentage (%) of Bets – The share of total tickets placed on a particular side. Example: If we track 20,000 bets on the Steelers-Bills game and 13,000 are on the Buffalo Bills, that’s 65% of bets on Buffalo.\nPercentage (%) of Money – The share of total dollars wagered on a particular side. Example: If the total handle (amount wagered) is $6 million and $5 million is on the Steelers, that’s 83% of the money on the Pittsburgh Steelers.\nHow to Read NFL Public Betting Data\n\nWhen comparing % of bets and % of money, look for discrepancies. Looking at the difference between the percentage of bets and the percentage of money can help The Action Network users find the NFL sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NFL picks coverage.\n\nThis is important information because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones who tend to bet more, but those bets still count as just a single bet.\n\nHigh % bets + Low % money: Public is on one side, but big bettors aren’t.\nLow % bets + High % money: Smaller number of wagers, but larger dollar amounts — possible sharp action.\nBig differences (>15%): Worth investigating for potential value.\n\nExample: If the Tampa Bay Buccaneers have 69% of spread bets but 92% of the money, that’s a +23% difference, suggesting professional bettors are leaning Tampa Bay. Of course, it's also important to look at the total number of bets placed on the market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nNFL Public Betting Trends\n\nHistorical patterns show the public often gravitates toward:\n\nFavorites (especially in prime-time games)\n\nOvers (rooting for points is more fun)\n\nPopular teams (Dallas Cowboys, Kansas City Chiefs, Green Bay Packers)\n\nHowever, “fading the public” — betting against the majority — has historically produced value in certain situations, especially when 70%+ of bets are on one side.\n\nWhen it comes to NFL betting, we have plenty of resources available to you: NFL Odds & Betting Lines, NFL Betting Futures Odds, Expert NFL Picks, and NFL Teams Against the Spread Standings. If you're more into NFL Props, we also have NFL Props Projections and NFL Touchdown Props!\n\nYou can learn more about the Best NFL Betting Promos by checking out our review!\n\nAnd if you need help with odds conversions, check out our betting odds converter tool.\n\nHow the Public Bet the 2026 NFL Season\n\nBefore diving into the 2026-27 season, it's worth reviewing how the public fared last year — the same betting patterns tend to repeat, and knowing where the crowd went wrong is one of the best ways to find value this fall.\n\nThe 2025-26 season was a rough one for chalk bettors. Favorites won 65.9% of their games outright but covered the spread just 47.8% of the time — a sharp drop from 2024, when favorites went a historic 71.7% straight up and 53.3% against the spread.\n\nEven so, betting volume kept climbing, with DraftKings calling its NFL handle \"off-the-charts great\" and same-game parlays continuing to surge.\n\nKey Public Betting Trends From Last Season\n\nThe public backed the usual suspects. The Lions, Bills, Eagles, Chiefs and Cowboys drew the most betting action all season — big brands and preseason contenders, not the teams actually cashing tickets.\nVolume, not record, drove public losses. Detroit finished a middling 8-9 ATS, but the sheer number of bettors backing the Lions week after week made them a loss leader.\nThe best values were the least-bet teams. The Patriots and Seahawks — both +6000 preseason longshots — finished as the two most profitable teams for bettors, each going 12-5 ATS.\nMost-Bet Games of the Season\n\nStandalone prime-time games dominated the handle charts, with early-season matchups attracting the most money. The biggest betting event, as always, was the Super Bowl: the public backed Seattle early and often, pushing the spread from -4.5 to as high as -5.5, and bet slips piled up on the Seahawks to cover. Seattle's 29-13 win cashed those spread tickets, but the public's beloved over went down in flames — the 42 combined points fell well short of the total, a reminder that the crowd's over bias cuts both ways.\n\nBiggest Fades That Paid\n\nContrarian bettors had plenty to celebrate in 2025-26:\n\nFading the Chiefs: Kansas City lost nine games outright as a favorite and failed to cover in 10 — both league worsts.\nFading heavy favorites generally: with favorites covering under 48% of the time, taking the points was the winning side of the ledger.\nBacking live underdogs: the Panthers won eight games outright as an underdog, tied for the most in a season in the Super Bowl era.\nWhat It Means for 2026-27\n\nThe lesson heading into this season: the public will pile onto the same big-name favorites and overs it always does, and sportsbooks will shade lines accordingly. Watch for early public money inflating spreads on last year's darlings — the Seahawks and Patriots will carry Super Bowl hype into 2026-27, putting them at risk of becoming this year's overbet teams. Our live betting splits above update throughout the week once the season kicks off, so you can track exactly where the crowd i tistical model, NBA handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NBA projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NBA betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NBA projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NBA Projections\n\nOur NBA experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NBA: They're simply bets on the margin of victory. Say the Los Angeles Lakers have a spread of -6.5 vs. the Sacramento Kings. In that situation, a spread bet on the Lakers would cash if they won by a 7 points or more. A bet on the Kings at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Boston Celtics vs. New York Knicks game has a total of 205 points: Bettors on the under would cash if the teams combined for 206 or fewer points; over bettors would win at 204 or more. An exact total of 205 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Orlando Magic are +250 on the moneyline vs. the Chicago Bulls, who are -290. If you bet $10 on the Magic and they won, you would receive $25 in profit. A bet on the Bulls, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NBA Projections?\nWh an be measured against lines in the market.\n\nHow NCAAB Projections Work\n\nThere are many ways to build NCAAB projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, college basketball handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NCAAB projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in college basketball betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NCAAB projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NCAAB Projections\n\nOur college basketball experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on college basketball: They're simply bets on the margin of victory. Say the Gonzaga Bulldogs have a spread of -6.5 vs. the UCLA Bruins. In that situation, a spread bet on Gonzaga would cash if they won by a 7 points or more. A bet on UCLA at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Baylor Bears vs. Arizona Wildcats game has a total of 175 points: Bettors on the under would cash if the teams combined for 174 or fewer points; over bettors would win at 175 or more. An exact total of 175 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Ohio State Buckeyes are +250 to a lot of money wagered on the sport now that online sports betting is legal in several states.\n\nNot every wager is the same amount, however, and college basketball bettors who pay attention to Action Network's public betting data can spot sharp bets.\n\nPrediction markets also offer NCAAB markets on apps like Kalshi, Polymarket or Novig. If you are new to prediction markets, try out some of our exclusive new user offers with the Polymarket promo code or Kalshi promo code today.\n\nHow to Use Public Betting and Money Percentages in NCAAB Betting\n\nWe track betting data at a variety of sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every college basketball game and bet type. This will help you make more informed decisions.\n\nPercentage (%) of bets: The proportion of bets made on a side of a wager. For example, if we track 20,000 bets on the Alabama-Auburn game and 13,000 of them are on the Tigers, that would be 65% of bets on the Tigers.\nPercentage (%) of money: The proportion of money bet on a side of a wager. For example, if we track a total handle — a betting term that means \"amount wagered\" — of $6 million and $5 million is on the Crimson Tide, that would be 83% of the money on the Crimson Tide.\n\nThis is important information for NCAA basketball betting because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000 based on what they see in terms of Action Network NCAAB odds. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet.\n\nTherefore, looking at the difference between the betting percentages and percentage of money can help The Action Network users find the NCAAB sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NCAAB picks coverage.\n\nHere's another example: Say the Syracuse Orange are getting 69% of the spread bets against the Duke Blue Devils, but 92% of the money bet on that game's spread is on the Orange. That would be a percentage difference of 23% on the Orange, highlighting that the bettors willing to wager a lot of money — these are likely to be sharp bettors — are on Syracuse. These are what's known as NCAAB consensus picks.\n\nOf course, it's also important to look at the total number of bets placed on the NCAA college basketball market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more as a betting strategy.\n\nFrequently Asked Questions\nWhat is a point spread in NCAAB betting?\nWhat is a total or over/under bet in an NCAAB game?\nHow do moneylines work in NCAAB betting?\nWhere can I bet on college basketball?\nRecent Stories\nSee All\nThis Team Will Destroy & More Monday NCAAB Best Bets\nAction Network Staff\n•\n3 hours ago\nOakland vs Alabama: This May Get Ugly\nSean Paul\n•\n6 hours ago\nMinnesota vs Cincinnati: System Likes This Side\nAction Network Staff\n•\n7 hours ago\nWagner vs UConn: Seahawks to Get Caged\nColby Marchio\n•\n7 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 ET % \tMONEY % \n\n9:30 PM\nFlyers\n39\nCanucks\n40\n\t\n-132\n+110\n\t\n-131\n+131\n\t\n-135\n+114\n\t\nD+\nD\n\t\n-0.7%\n-3.4%\n\t\n-122\n+125\n\t\n81%\n19%\n\t\n70%\n30%\n\n\n10:00 PM\nIslanders\n41\nSharks\n42\n\t\n-132\n+110\n\t\n-130\n+130\n\t\n-142\n+120\n\t\nD\nD+\n\t\n-2.2%\n-2%\n\t\n+120\n+130\n\t\n85%\n15%\n\t\n70%\n30%\n\n\n8:00 PM\nRangers\n37\nOilers\n38\n\t\n+140\n-167\n\t\n+147\n-147\n\t\n+135\n-161\n\t\nD\nD\n\t\n-2.1%\n-2.2%\n\t\n+147\n-147\n\t\n7%\n93%\n\t\n3%\n97%\n\nA lot of factors are considered by expert NHL bettors, both in terms of on-field performance and the betting market. For example, many smart bettors are keenly aware of line movement and which sportsbooks post the best prices. But one of the most important factors is building out NHL projections that can be measured against lines in the market.\n\nHow NHL Projections Work\n\nThere are many ways to build NHL projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, NHL handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NHL projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NHL betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NHL projections to be aware of news and injuries.\n\nGoal lines don't move much considering the close nature of final scores in hockey. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-ice advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NHL Projections\n\nOur NHL experts will provide consensus projections for every NHL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but with baseball, spread numbers won't vary much no matter the book. The majority of hockey goal-lines will be +/- 1.5 because of how close games can be.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NHL: They're simply bets on the margin of victory. Say the Pittsburgh Penguins have a spread of -1.5 vs. the New York Islanders. In that situation, a spread bet on the Penguins would cash if they won by a 2 goals or more. A bet on the Islanders at +1.5 would cash if they won the game outright or merely lost by 1 goal.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Florida Panthers vs. Columbus Blue Jackets game has a total of 7 goals: Bettors on the under would cash if the teams combined for 6 or fewer goals; over bettors would win at 8 or more. An exact total of 8 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NHL projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the San Jose Sharks are +250 on the moneyline vs. the Vancouver Canucks, who are -290. If you bet $10 on the Sharks and they won, you would receive $25 in profit. A bet on the Canucks, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NHL projections?\nWhat NHL projections do The Action Network experts provide?\nRecent Stories\nSee All\nPRO\nDr. Nick's NHL First Goal Model for Monday\nNick Giffen\n•\n12 mins ago\nIslanders vs Sharks: Expect NY To Improve on Defense\nFrank Ammirante\n•\n3 hours ago\nFlyers vs Canucks: Battle to Snap Skids\nAction Network Staff\n•\n4 hours ago\nRangers vs Oilers: Target This Hot Hand\nTony Sartori\n•\n4 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMic  wagered on by pros. We also have expert NHL picks coverage.\n\nHere's another example: Say the Florida Panthers are getting 69% of the spread bets against the Nashville Predators, but 92% of the money bet on that game's spread is on the Predators. That would be a percentage difference of 23% on the Predators, highlighting that the bettors willing to wager a lot of money -- these are likely to be sharp and pro bettors -- are on Nashville for the overall public opinion.\n\nOf course, it's also important to look at the total number of bets placed on the market for your betting strategy, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nFrequently Asked Questions\nWhat is a goal-line spread in NHL betting?\nWhat is a total or over/under bet in an NHL game?\nHow do moneylines work in NHL betting?\nWhere can I bet on hockey?\nRecent Stories\nSee All\nPRO\nDr. Nick's NHL First Goal Model for Monday\nNick Giffen\n•\n12 mins ago\nIslanders vs Sharks: Expect NY To Improve on Defense\nFrank Ammirante\n•\n3 hours ago\nFlyers vs Canucks: Battle to Snap Skids\nAction Network Staff\n•\n4 hours ago\nRangers vs Oilers: Target This Hot Hand\nTony Sartori\n•\n4 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nM  volume of bets and volume of money per market.\n\nTwo ways of measuring it\n\nTickets (% of bets): the share of individual wagers on each side. If 70% of tickets are on Team A, seven out of ten bettors picked them, regardless of how much each person staked.\nMoney (% of money): the share of total dollars wagered on each side. Because a few large bets can outweigh many small ones, money and ticket percentages often differ.\n\nWho “the public” is\n\nThe term mostly describes recreational bettors: casual fans who bet for fun, often on favorites, popular teams, overs, and games with heavy media attention. It is usually contrasted with “sharps,” professional or highly informed bettors who wager larger amounts and tend to focus on pricing and value rather than team popularity.\n\nWhy anyone tracks it\n\nGauging sentiment: splits show which outcomes are popular and which are being ignored.\nUnderstanding line movement: books adjust odds based on the size and source of wagers, so splits help explain why a number moved.\nFading or tailing: some bettors “fade the public” by betting the unpopular side, on the theory that popular picks are often overpriced. Others tail it when the crowd has been right.\n\nImportant caveats\n\nPublic sentiment alone isn’t a reliable edge. Fading the public isn’t automatically profitable, and the public wins plenty of the time.\nSplits vary by source, since each sportsbook has its own customer base, and aggregated data is only an approximation of the whole market.\nBooks price lines to manage their own risk and expected profit, not just to balance the action, so a lopsided split doesn’t always mean the book is exposed.\n\nNFL Public Betting\n\nNFL public betting trends for the 2026-27 season reveal how bettors are wagering across spreads, totals, and moneylines. The tables above display the latest NFL public betting splits for every game of the 2026-27 NFL season (filtered by week). You can see the breakdown in '% of bets' and '% of money' for t   const sig={1:[],2:[]};
  srcs.forEach(s=>Object.entries(s).forEach(([k,v])=>{ const m=k.match(/^(.*)([12])$/); if(m&&v==='Y'&&!sig[m[2]].includes(m[1])){ sig[m[2]].push(m[1]); used.add(k); } }));
  const nice=a=>a.map(x=>x.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^PROSystems$/,'PRO Systems')).join(', ');
  if(sig[1].length||sig[2].length) row('Signals', esc(nice(sig[1])), esc(nice(sig[2])));
  const tb=get('TotalBets'); used.add('TotalBets'); used.add('Diff');
  const other=[]; srcs.forEach(s=>Object.entries(s).forEach(([k,v])=>{ if(!used.has(k)&&v!=null&&v!==''&&!other.some(o=>o[0]===k)){ other.push([k,v]); } }));
  if(!rows.length&&!other.length) return '';
  return `<div class="sec"><h4>Action PRO</h4>${rows.length?`<table class="odds pro"><tr><th></th><th>${n1}</th><th>${n2}</th></tr>${rows.join('')}</table>`:''}`
    +(notes.length?`<div class="pronotes">${notes.map(n=>`<div>${n}</div>`).join('')}</div>`:'')
    +(tb?`<div class="legend">${esc(tb)} bets tracked</div>`:'')
    +(other.length?`<div class="kv" style="margin-top:6px">${other.map(([k,v])=>`<span><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>`:'')+`</div>`;
}
function picks(g){
  const ps=g.picks||[]; if(!ps.length) return '';
  return `<div class="sec"><h4>Expert picks (${ps.length})</h4>${ps.map(p=>`<div class="pick"><b>${esc(p.Pick)}</b> ${p.Units?`<span class="badge">${esc(p.Units)}</span>`:''}<div class="who">${esc(p.Analyst)}${p.Record?' · '+esc(p.Record):''}${p.Posted?' · '+esc(p.Posted):''}</div>${p.Note?`<div class="note">${esc(p.Note)}</div>`:''}</div>`).join('')}</div>`;
}
function fstTips(f, headTitle){
  if(!f||!(f.tips||[]).length) return '';
  const ts=f.tips, own=ts.filter(t=>t.source!=='acca'), acc=ts.filter(t=>t.source==='acca');
  const row=t=>`<div class="pick fst"><b>${esc(t.pick)}</b><span class="od">${t.odds_us!=null?am(t.odds_us):''}</span>${t.odds_frac?` <span class="meta">(${esc(t.odds_frac)})</span>`:''}${t.confidence?`<span class="conf" title="confidence">${'★'.repeat(Math.min(5,+t.confidence||0))}</span>`:''}
    <div class="who">${t.market?esc(t.market):''}${t.source==='acca'?`${t.market?' · ':''}leg of their ${esc(t.product)}${t.product_legs?` (${t.product_legs} legs${t.product_odds_frac?', '+esc(t.product_odds_frac):''})`:''}`:''}</div>${t.reason?`<div class="note">${esc(t.reason)}</div>`:''}</div>`;
  return `<div class="sec"><h4>${headTitle||'freesupertips'} (${ts.length})</h4>${own.map(row).join('')}${acc.map(row).join('')}${f.url?`<div class="legend"><a href="${esc(f.url)}" target="_blank" rel="noopener">Full preview on freesupertips.com &rarr;</a></div>`:''}</div>`;
}
function fstCard(f){
  const id='fst:'+f.name;
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(f.start)}</span>
    <div class="gteams">${esc(f.home||'')} <span class="meta">vs</span> ${esc(f.away||'')}${f.league?`<small>${esc(f.league)}</small>`:''}</div>
    <span class="badge fst">${f.tips.length} tip${f.tips.length===1?'':'s'}</span></div><div class="gbody">${fstTips(f)}</div></div>`;
}
function arts(list, title){
  if(!(list||[]).length) return '';
  return `<div class="sec"><h4>${title}</h4><ul class="arts">${list.map(a=>`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></li>`).join('')}</ul></div>`;
}
function extra(g){
  const o=g.odds||{}; const shown=/^(ml|spread|total|over|under|draw|ml_draw)(_|$)/;
  const rest=Object.entries(o).filter(([k])=>!shown.test(k)||/(tickets|sharp)/.test(k));
  return rest.length?`<div class="sec"><h4>More from the odds feed</h4><div class="kv">${rest.map(([k,v])=>`<span><b>${esc(k.replace(/_/g,' '))}</b> ${esc(v)}</span>`).join('')}</div></div>`:'';
}
function card(g){
  const id = g.sport+':'+g.id, t=g.teams||[];
  const live = /live|in_progress|progress|1st|2nd|3rd|half|quarter|period/i.test(g.status||'');
  const score = g.score?` · ${g.score[0]}-${g.score[1]}`:'';
  const at = (g.sides||[])[0]==='away' ? '@' : 'vs';
  const head = t.length===2?`${esc(t[0])} <span class="meta">${at}</span> ${esc(t[1])}`:esc(g.title);
  const sub = [g.league_name&&g.league_name!==g.league?g.league_name:'', g.broadcast||'', g.num_bets?Number(g.num_bets).toLocaleString()+' bets':''].filter(Boolean).join(' · ');
  const body = oddsTable(g)+bars(g)+pro(g)+picks(g)+fstTips(g.fst)+arts(g.articles,'Articles')+extra(g)
    +(g.hub?`<div class="sec"><a href="${esc(g.hub)}" target="_blank" rel="noopener">Open on Action Network &rarr;</a></div>`:'');
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(g.start)}</span>
    <div class="gteams">${head}${sub?`<small>${esc(sub)}</small>`:''}</div>
    ${(g.picks||[]).length?`<span class="badge">${g.picks.length} picks</span>`:''}${g.fst&&g.fst.tips.length?`<span class="badge fst">${g.fst.tips.length} FST</span>`:''}<span class="badge${live?' live':''}">${esc(g.status||'')}${score}</span></div>
    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;
}
function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
</html>
