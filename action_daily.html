<head>

<title>Action Daily</title>
<style>
  :root{--bg:#0b0e14;--panel:#131722;--panel2:#1a1f2e;--border:#252c3d;--text:#e8ebf2;--sub:#8993a8;
    --accent:#4f7cff;--accent2:#22c98a;--warn:#f2a93c;--bad:#f2554a;--gold:#e8c14a;--radius:10px;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding-bottom:60px} a{color:var(--accent)}
  .app{max-width:920px;margin:0 auto;padding:0 10px}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:8px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .back{color:var(--sub);text-decoration:none;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--panel)}
  h1{font-size:18px;margin:0;flex:1}
  .meta{color:var(--sub);font-size:12px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--sub);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.75;font-weight:600;margin-left:4px}
  .search{width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px}
  .sport{margin-top:18px}
  .sporthead{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
  .sporthead h2{font-size:15px;margin:0;letter-spacing:.04em}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;overflow:hidden}
  .ghead{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
  .gtime{color:var(--sub);font-size:12px;min-width:62px}
  .gteams{flex:1;font-weight:700;font-size:14px;line-height:1.35}
  .gteams small{display:block;color:var(--sub);font-weight:500;font-size:12px}
  .badge{font-size:11px;color:var(--sub);border:1px solid var(--border);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .badge.live{color:var(--accent2);border-color:var(--accent2)}
  .gbody{display:none;border-top:1px solid var(--border);padding:10px 12px;background:var(--panel2)}
  .card.open .gbody{display:block}
  table.odds{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  table.odds th{color:var(--sub);font-weight:600;text-align:right;padding:4px 6px;font-size:12px}
  table.odds th:first-child,table.odds td:first-child{text-align:left}
  table.odds td{text-align:right;padding:5px 6px;border-top:1px solid var(--border);white-space:nowrap}
  table.odds td:first-child{white-space:normal}
  table.odds tr.open td{color:var(--sub);font-size:12px}
  .sec{margin-top:12px}
  .sec h4{margin:0 0 6px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
  .bar{display:grid;grid-template-columns:92px 1fr 1fr;gap:6px;align-items:center;font-size:12px;margin:4px 0}
  .bar .lbl{color:var(--sub)}
  .meter{position:relative;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
  .meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55}
  .meter.m i{background:var(--accent2)}
  .meter span{position:relative;padding-left:6px;line-height:18px;font-variant-numeric:tabular-nums}
  .kv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
  .kv b{color:var(--sub);font-weight:600}
  .pick{font-size:13px;padding:6px 0;border-top:1px solid var(--border)}
  .pick:first-child{border-top:0}
  .pick .who{color:var(--sub);font-size:12px}
  .pick .note{color:var(--sub);font-size:12px;margin-top:2px}
  ul.arts{margin:0;padding-left:18px;font-size:13px} ul.arts li{margin:3px 0}
  details{margin-top:8px} summary{cursor:pointer;color:var(--sub);font-size:13px}
  pre{white-space:pre-wrap;font-size:11px;color:var(--sub);max-height:420px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
  .empty{color:var(--sub);text-align:center;padding:40px 10px}
  .legend{color:var(--sub);font-size:11px;margin-top:4px}
  .badge.fst{color:var(--gold);border-color:rgba(232,193,74,.5)}
  .fst .mk{color:var(--sub);font-size:12px} .fst .od{font-variant-numeric:tabular-nums;font-weight:700;margin-left:4px}
  .fst .conf{color:var(--gold);font-size:11px;margin-left:4px;letter-spacing:1px}
  table.pro th{white-space:normal;color:var(--text);font-size:12px;vertical-align:bottom}
  table.pro td:first-child{color:var(--sub);font-size:12px}
  .gr{font-weight:700} .gr.good{color:var(--accent2)} .gr.bad{color:var(--bad)}
  .pronotes{margin-top:6px;font-size:12px;color:var(--sub)} .pronotes b{color:var(--text)}
</style>
</head>

ool:\n\nColumn\tWhat it means\tExample: Penn State at Ohio State\nOpen\tThe spread when sportsbooks first posted the game, before betting moved it.\tThe game opened at Ohio State –6.5.\nPro Line (Subscription Feature)\tOur model's odds for each game, compared to the consensus odds. We recommend at least a Grade of B or a +3.5% Edge before considering a bet based solely on projections.\tThe model makes Ohio State –5.5, meaning it thinks they should be favored by 5.5 points.\nCons.\tThe consensus line — the current market spread averaged across sportsbooks.\tBooks now have Ohio State –7, so the line has moved a half point since open.\nGrade\tA letter grade (A–F) rating how strong the gap is between our line and the market's.\tModel says –5.5, market says –7. That 1.5-point gap crossing a key number earns a B.\nEdge\tThe same gap shown as a percentage. Higher = more potential value.\tPenn State +7 shows a +4.2% edge — above the +3.5% threshold worth considering.\nBest Odds\tThe single best price on each side across all sportsbooks we track.\tOne book has Penn State +7.5 (–108) — a better number than the consensus +7.\nBet %\tThe share of total tickets (individual bets) on each side.\t75% of all bets are on Ohio State — the public likes the favorite.\nMoney %\tThe share of total dollars wagered on each side.\t60% of the money is on Penn State — fewer, larger bets suggest sharper action on the underdog.\nHow We Build Projections for 2026-27\n\nTo generate our NCAAF projections this season, we combine:\n\nPower ratings and advanced metrics: Reviewing offense, defense, special teams, tempo, efficiency, recruiting impact, roster turnover from the previous season.\nTeam news and injuries: Especially at key positions like quarterback. A QB injury or change in coaching staff triggers re-evaluation.\nHome-field advantage and rest/back-to-back weeks: Travel, bye weeks, and short weeks matter.\nHistorical performance and trend analysis: How teams performed in similar matchups, under similar conditions.\nLive betting market data: consensus lines, sportsbooks’ odds, public betting percentages. Our models aim to spot “edges” when our projections differ meaningfully from current market lines.\nWhat You’ll See in Our NCAAF Projections\n\nFor each game, we provide:\n\nSpread projection: Predicted margin between the two teams (how many points one is favored by).\nMoneyline projection: Odds for each team to win outright.\nOver/Under (Total): Predicted combined points scored by both teams.\nEdge: The difference (as a percentage) between our projection and the consensus/sportsbook line — this helps identify betting value.\nGrade: A letter grade (A-F) reflecting the strength of that edge; helps you quickly see which games to focus on.\nHow to Use Projections in Betting\nSpot the edge: Compare our 2025-26 projections vs current sportsbook lines. An edge of +3.5% or higher often starts to look compelling.\nRespect key numbers: A spread of 6.5 vs. 7, or a total of 49.5 vs. 50.5, can matter significantly because of scoring patterns in football.\nMonitor news up to game day: Last-minute injuries or weather shifts can swing spreads or totals and affect value.\nDiversify bets: Don’t just pick spreads — sometimes moneylines or overs/unders offer better return, depending on matchups.\nUse power ratings: Our projections derive from power ratings that update weekly, reflecting latest performance, rest, injuries, momentum. Use these to compare teams even before lines drop.\nExample: Sample Projections\n\nSay the Georgia Bulldogs have a spread of -6.5 vs. the Florida Gators. In that situation, a spread bet on Georgia would cash if they won by a touchdown or more. A bet on Alabama at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in college football. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NCAAF projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also vital for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Oregon Ducks vs. Oklahoma Sooners game has a total of 64 points: Bettors on the under would cash if the teams combined for 63 or fewer points; over bettors would win at 65 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NCAAF projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Texas Tech Red Raiders are +250 on the moneyline vs. the Clemson Tigers, who are -290. If you bet $10 on Texas Tech and they won, you would receive $25 in profit. A bet on Clemson, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nProjections vs. Public Sentiment\n\nSometimes what our projections say diverges from what the public is betting. These misalignments can signal value:\n\nWhen public heavily backs the favorite, but our model’s projected spread is smaller.\nWhen underdogs get little attention but our model suggests they win outright with reasonable probability.\nWhen totals are inflated by marquee names or high-profile games, but underlying defense/offense metrics suggest lower scoring.\nStay Current: Weekly Updates & Trends\nProjections are refreshed weekly, especially when new stats, injuries, or reports come in.\nWe track which teams are trending up or down — momentum matters.\nBet monitoring: watch how sharp bettors are leaning, and where public money is going. These can influence line movement, sometimes creating last-minute value.\n\nIf you're serious about getting an edge in college football betting, these NCAAF projections are essential. They don't predict upsets or guarantee wins — but they give you a probabilistic foundation to make smarter bets. Use them to find mismatches, exploit line inefficiencies, and avoid getting caught up in hype.\n\nUpdated for the 2026-27 season, our projections reflect the realities of roster shifts, scoring trends, and a tighter market. Bookmark this page, check it weekly, and let the numbers guide you.\n\nIf you want to put these NCAAF projections to work, check out the best college football betting promos or best CFB prediction market promos.\n\nFrequently Asked Questions\nWhat are NCAAF projections?\nWhat NCAAF projections do Action Network experts provide?\nRecent Stories\nSee All\nStuckey & Wilson: Our Favorite Favorites for NCAAF Week 10\nGeorge Stuckey\n•\n3 hours ago\nTCU vs. Arizona: Wildcats to Jump Out Early\nCollin Wilson\n•\n3 hours ago\nNew Mexico vs. Nevada: No Lone Wolves\nJoshua Nunn\n•\n4 hours ago\nStuckey & Wilson: Our Top ML Dogs for Week 10\nCollin Wilson\n•\n4 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sp ata shows what share of bets and what share of money are being placed on each side of a college football game, based on real sportsbook activity we track across the industry.\n\nNCAAF public betting refers to the wagers placed by the general betting population on college football games. Tracking public betting trends helps you see which teams or sides most bettors favor. However, the public isn’t always right, which is why professional bettors, also known as “sharps,” often take the opposite side.\n\nBy combining public betting data with money percentages and total bet volume, you can get a clearer picture of where the smart money is going.\n\nFor example, in Week 1 of the 2025 season, Ohio State opened as a 7.5-point favorite over Texas. Bets skewed toward Ohio State early, but by kickoff the line had moved to 7 despite the majority of bets still on the Buckeyes — a reverse line movement that pointed to sharp money on Texas. That kind of divergence between ticket count and line movement is exactly what public betting data is meant to surface.\n\nTips for Interpreting NCAAF Public Betting\n\nUnderstanding how to interpret NCAAF public betting can provide an edge for college football bettors. Here's a handful of tips from our experts on interpreting NCAAF public betting data.\n\nLook for games where the delta between bet and money percentages is large — these often indicate professional interest.\nAvoid overvaluing data from games with small sample sizes of tracked bets.\nUse public betting data alongside other tools, such as line movement, team stats, and matchup analysis, to make informed decisions.\nTreat public betting data as one input among several, not a standalone system — it's most useful combined with injury news, weather, and situational trends (letdown spots, short weeks, revenge games).\nResponsible gambling note: public and money percentages describe crowd behavior, not guaranteed outcomes. Never bet more than you can afford to lose, and use them as a research tool rather than a betting system on their own.\n\nA concrete example: An Action Network study found that teams receiving fewer than 45% of spread tickets since 2005 went 4,007-4,025-145 against the spread, a 49.9% win rate — essentially break-even, not a strong edge.\n\nHow to Use Public Betting and Money Percentages in College Football Betting\n\nWe house betting data from numerous U.S. online sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every college football game and major bet type. Here's a look at a hypothetical Tennessee-Vanderbilt game.\n\nPercentage (%) of bets: The percentage of wagers on a particular side of a game. If Tennessee vs. Vanderbilt had 20,000 total bets that we've tracked and 12,000 of those are on the Vols, we'd say that Tennessee has received 60% of the bets.\nPercentage (%) of money: This is the same thing except for the money. If we know the total handle, we can then calculate the percentage of money on one side or another of a bet.\n\nCombining those two factors can help college football bettors eye bets that might be worth making. The reason is because not all bets are the same amount of money. A single $10,000 sharp bet can outweigh hundreds of $10 public tickets — which is why money percentage often tells a different story than bet percentage.\n\nThus, the difference between the percentage of money and the percentage of bets can often highlight the games in which pro bettors are getting down action. And, well, they're professional and bet high amounts for a reason: It could be a good bet to take those sides.\n\nIt's also important to look at the total number of bets we're tracking, which you can see on the far right of the table above. The reason is that you don't want to put too much stock in a money vs. bet difference that has a small sample of bets. Utilizing all four factors -- bet percentage, money percentage, bet vs. money percentage (the delta), and total bets -- is recommended when using betting data to gain an advantage.\n\nWhy the Difference Matters\n\nThe difference between the percentage of bets and the percentage of money — sometimes called the “delta” — can highlight games where professional bettors are placing high-stakes wagers.\n\nWhen bet % and money % diverge sharply, it signals sharp (professional) money on one side. For example, 40% of bets but 80% of money on a team suggests a small number of large wagers from sharps rather than broad public support. \n\nScenario: 60% of bets on Tennessee but 80% of the money on them suggests sharp action favoring Tennessee over Vanderbilt.\nSharps bet large amounts for a reason: it could indicate a more favorable line or value that casual bettors might overlook.\n\nWe track this kind of split throughout the week across the CFB slate. In the hypothetical example above, the line held steady from open to close even as public tickets piled up on Tennessee — the kind of resistance that often accompanies sharp money quietly balancing the book on the other side. Watching for that pattern, rather than reacting to a single day's number, is where public betting data earns its keep.\n\nIf you want to apply NCAAF public betting insights, claim these NCAAF betting promos and/or NCAAF prediction market promos.\n\nFrequently Asked Questions\nWhat is a point spread in college football betting?\nWhat is a total or over/under bet in a college football game?\nHow do moneylines work in college football betting?\nWhere can I bet on college football?\nRecent Stories\nSee All\nStuckey & Wilson: Our Favorite Favorites for NCAAF Week 10\nGeorge Stuckey\n•\n3 hours ago\nTCU vs. Arizona: Wildcats to Jump Out Early\nCollin Wilson\n•\n3 hours ago\nNew Mexico vs. Nevada: No Lone Wolves\nJoshua Nunn\n•\n4 hours ago\nStuckey & Wilson: Our Top ML Dogs for Week 10\nCollin Wilson\n•\n4 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds  game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NBA betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NBA projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NBA Projections\n\nOur NBA experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NBA: They're simply bets on the margin of victory. Say the Los Angeles Lakers have a spread of -6.5 vs. the Sacramento Kings. In that situation, a spread bet on the Lakers would cash if they won by a 7 points or more. A bet on the Kings at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Boston Celtics vs. New York Knicks game has a total of 205 points: Bettors on the under would cash if the teams combined for 206 or fewer points; over bettors would win at 204 or more. An exact total of 205 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Orlando Magic are +250 on the moneyline vs. the Chicago Bulls, who are -290. If you bet $10 on the Magic and they won, you would receive $25 in profit. A bet on the Bulls, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NBA Projections?\nWhat NBA projections do The Action Network experts provide?\nRecent Stories\nSee All\n4 NBA Player Prop Picks for Friday\nAction Network Staff\n•\n38 mins ago\nMoore's NBA Cup Mega-Preview for Friday\nMatt Moore\n•\n1 hour ago\nSpurs vs Kings: Expect Sacramento to Get Steamrolled\nMatt Moore\n•\n2 hours ago\nBl f money wagered on the sport now that online sports betting is legal in over 20 states. The rise of many international stars has helped grow the game around the globe.\n\nNot every wager is the same amount, however, and NBA bettors who pay attention to our public betting data can spot sharp bets across all legal online sportsbooks. And if you can't use sportsbooks to bet on the NBA, you can check out our Kalshi promo code or Polymarket promo code for a CFTC-regulated platform for prediction markets.\n\nHow to Use Public Betting and Money Percentages in NBA Betting\n\nWe track betting data at a variety of the best sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every NBA game and bet type.\n\nPercentage (%) of bets: The proportion of bets made on a side of a wager. For example, if we track 20,000 bets on the Lakers-Suns game and 13,000 of them are on the Suns, that would be 65% of bets on the Suns.\nPercentage (%) of money: The proportion of money bet on a side of a wager. For example, if we track a total handle -- a betting term that means \"amount wagered\" -- of $6 million and $5 million is on the Lakers, that would be 83% of the money on the Lakers.\n\nThis is important information because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet.\n\nTherefore, looking at the difference between the percentage of bets and the percentage of money can help The Action Network users find the NBA sides that have \"sharp money\" -- in other words, those wagered on by pros. We also have expert NBA picks coverage.\n\nHere's another example: Say the Miami Heat are getting 69% of the spread bets against the Dallas Mavericks, but 92% of the money bet on that game's spread is on the Heat. That would be a percentage difference of 23% on the Heat, highlighting that the bettors willing to wager a lot of money -- these are likely to be sharp and pro bettors -- are on Miami.\n\nOf course, it's also important to look at the total number of bets placed on the market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nFrequently Asked Questions\nWhat is a point spread in NBA betting?\nWhat is a total or over/under bet in an NBA game?\nHow do moneylines work in NBA betting?\nWhere can I bet on the NBA?\nRecent Stories\nSee All\n4 NBA Player Prop Picks for Friday\nAction Network Staff\n•\n38 mins ago\nMoore's NBA Cup Mega-Preview for Friday\nMatt Moore\n•\n1 hour ago\nSpurs vs Kings: Expect Sacramento to Get Steamrolled\nMatt Moore\n•\n2 hours ago\nBlazers vs Lakers: Back Luka Doncic to Stay Hot Tonight\nJoe Dellera\n•\n2 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Code\nPolymarket Promo Code\nFanDuel Predicts Promo Code\nKalshi Promo Code\nNovig Promo Code\nDraftKings Predictions Promo Code\nProphetX Promo Code\nDraftKings Promo Code\nFanDuel Promo Code\ntheScore Bet Promo Code\nbetPARX Promo Code\nHard Rock Bet Promo C AB projections that can be measured against lines in the market.\n\nHow NCAAB Projections Work\n\nThere are many ways to build NCAAB projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, college basketball handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NCAAB projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in college basketball betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NCAAB projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NCAAB Projections\n\nOur college basketball experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on college basketball: They're simply bets on the margin of victory. Say the Gonzaga Bulldogs have a spread of -6.5 vs. the UCLA Bruins. In that situation, a spread bet on Gonzaga would cash if they won by a 7 points or more. A bet on UCLA at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Baylor Bears vs. Arizona Wildcats game has a total of 175 points: Bettors on the under would cash if the teams combined for 174 or fewer points; over bettors would win at 175 or more. An exact total of 175 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Ohio State Buckeyes are +250 on the moneyline vs. the Michigan Wolverines, who are -290. If you bet $10 on the Buckeyes and they won, you would receive $25 in profit. A bet on the Wolverines, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NCAAB projections?\nWhat NCAAB projections do The Action Network experts provide?\nRecent Stories\nSee All\nPRO\nHigh-Level O/U Edges Piling Up!\nCharles White\n•\n24 mins ago\nPRO\nSharp Action Hitting This 4 p.m. Game\nAlex Kolodziej\n•\n2 hours ago\nMiddle Tennessee vs Kansas: Ready for Bloodbath\nColby Marchio\n•\n4 hours ago\nHot Shooting Will End & More Friday NCAAB Best Bets\nAction Network Staff\n•\n5 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Code\nPolymarket Promo Code\nFanDuel Predicts Promo Code\nKalshi Promo Code\nNovig Promo Code\nDraftKings Predictions Promo Code\nProphetX Promo Code\nDraftKings Promo Code\nFanDuel Promo Code\ntheScore Bet Promo Code\nbetPARX Promo Code\nHard Rock Bet Promo Code\nBetRivers Promo Code\nDraftKings Pick6 Promo Code\nDabble Promo Code\nBleacher Nation Fantasy Promo Code\nBetr Promo Code\nRebet Promo Code\nPlayBracco Promo Code\nThrillzz Promo Code\nPrizePicks Promo Code\nThe Action Network\nAbout\nOur Author amount wagered\" -- of $6 million and $5 million is on the Crimson Tide, that would be 83% of the money on the Crimson Tide.\n\nThis is important information for NCAA basketball betting because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000 based on what they see in terms of Action Network NCAAB odds. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet.\n\nTherefore, looking at the difference between the betting percentages and percentage of money can help The Action Network users find the NCAAB sides that have \"sharp money\" -- in other words, those wagered on by pros. We also have expert NCAAB picks coverage.\n\nHere's another example: Say the Syracuse Orange are getting 69% of the spread bets against the Duke Blue Devils, but 92% of the money bet on that game's spread is on the Orange. That would be a percentage difference of 23% on the Orange, highlighting that the bettors willing to wager a lot of money -- these are likely to be sharp bettors -- are on Syracuse. These are what's known as NCAAB consensus picks. \n\nOf course, it's also important to look at the total number of bets placed on the NCAA college basketball market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more as a betting strategy.\n\nFrequently Asked Questions\nWhat is a point spread in NCAAB betting?\nWhat is a total or over/under bet in an NCAAB game?\nHow do moneylines work in NCAAB betting?\nWhere can I bet on college basketball?\nRecent Stories\nSee All\nPRO\nHigh-Level O/U Edges Piling Up!\nCharles White\n•\n25 mins ago\nPRO\nSharp Action Hitting This 4 p.m. Game\nAlex Kolodziej\n•\n2 hours ago\nMiddle Tennessee vs Kansas: Ready for Bloodbath\nColby Mar 145\n\t\n15%\n85%\n\t\n4%\n96%\n\n\n8:00 PM\nDucks\n65\nFlames\n66\n\t\n+110\n-132\n\t\n+131\n-131\n\t\n+125\n-149\n\t\nD+\nD\n\t\n-1.1%\n-3.1%\n\t\n+135\n+125\n\t\n36%\n64%\n\t\n27%\n73%\n\n\n8:00 PM\nSharks\n63\nWild\n64\n\t\n+160\n-192\n\t\n+242\n-242\n\t\n+220\n-275\n\t\nD\nD\n\t\n-2%\n-2.3%\n\t\n+251\n-245\n\t\n6%\n94%\n\t\n5%\n95%\n\nA lot of factors are considered by expert NHL bettors, both in terms of on-field performance and the betting market. For example, many smart bettors are keenly aware of line movement and which sportsbooks post the best prices. But one of the most important factors is building out NHL projections that can be measured against lines in the market.\n\nHow NHL Projections Work\n\nThere are many ways to build NHL projections, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, NHL handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NHL projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NHL betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NHL projections to be aware of news and injuries.\n\nGoal lines don't move much considering the close nature of final scores in hockey. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-ice advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NHL Projections\n\nOur NHL experts will provide consensus projections for every NHL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but with baseball, spread numbers won't vary much no matter the book. The majority of hockey goal-lines will be +/- 1.5 because of how close games can be.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NHL: They're simply bets on the margin of victory. Say the Pittsburgh Penguins have a spread of -1.5 vs. the New York Islanders. In that situation, a spread bet on the Penguins would cash if they won by a 2 goals or more. A bet on the Islanders at +1.5 would cash if they won the game outright or merely lost by 1 goal.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Florida Panthers vs. Columbus Blue Jackets n each side of a market. Sportsbooks and data sites aggregate that activity into “betting splits” so you can see where the majoirty of bettors are leaning. Prediction markets, like Kalshi and Polymarket, also provide information about volume of bets and volume of money per market.\n\nTwo ways of measuring it\n\nTickets (% of bets): the share of individual wagers on each side. If 70% of tickets are on Team A, seven out of ten bettors picked them, regardless of how much each person staked.\nMoney (% of money): the share of total dollars wagered on each side. Because a few large bets can outweigh many small ones, money and ticket percentages often differ.\n\nWho “the public” is\n\nThe term mostly describes recreational bettors: casual fans who bet for fun, often on favorites, popular teams, overs, and games with heavy media attention. It is usually contrasted with “sharps,” professional or highly informed bettors who wager larger amounts and tend to focus on pricing and value rather than team popularity.\n\nWhy anyone tracks it\n\nGauging sentiment: splits show which outcomes are popular and which are being ignored.\nUnderstanding line movement: books adjust odds based on the size and source of wagers, so splits help explain why a number moved.\nFading or tailing: some bettors “fade the public” by betting the unpopular side, on the theory that popular picks are often overpriced. Others tail it when the crowd has been right.\n\nImportant caveats\n\nPublic sentiment alone isn’t a reliable edge. Fading the public isn’t automatically profitable, and the public wins plenty of the time.\nSplits vary by source, since each sportsbook has its own customer base, and aggregated data is only an approximation of the whole market.\nBooks price lines to manage their own risk and expected profit, not just to balance the action, so a lopsided split doesn’t always mean the book is exposed.\n\nNFL Public Betting\n\nNFL public betting trends for the 2026-27 season reveal how bettors are w portsbook has its own customer base, and aggregated data is only an approximation of the whole market.\nBooks price lines to manage their own risk and expected profit, not just to balance the action, so a lopsided split doesn’t always mean the book is exposed.\n\nNFL Public Betting\n\nNFL public betting trends for the 2026-27 season reveal how bettors are wagering across spreads, totals, and moneylines. The tables above display the latest NFL public betting splits for every game of the 2026-27 NFL season (filtered by week). You can see the breakdown in '% of bets' and '% of money' for the moneyline, spread, and total for all matchups.\n\nNFL public betting splits are updated in realtime; the data presented in the public betting chart is an average of the NFL public bets and NFL public money from multiple North American and global sportsbooks that are approved.\n\nNBA Public Betting\n\nThe NBA’s global popularity, driven by international stars, combined with legal online sports betting in many U.S. states, has led to a lot of money being wagered on the sport. Our NBA public betting page tracks the same two key measures as NFL for major sportsbooks: the percentage of bets, and the percentage of money.\n\nRecent Stories\nSee All\nPRO\n8 A-Grade Picks for 4 Premier League Matches\nCarlos Avilan\n•\n51 mins ago\nEverton vs Coventry City: Friday's EPL Best Bets\nAction Network Staff\n•\n8 hours ago\nRonaldo Retires from Portugal: Why Prediction Markets Got It Wrong\nCamil Straschnoy\n•\nNov 5, 2026 EST\nVillarreal vs PSG: Who Can Stop the French?\nAction Network Staff\n•\nNov 3, 2026 EST\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\n
