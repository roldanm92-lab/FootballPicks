it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, NFL handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NFL projections are projection blends of several of our key betting experts, including Sean Koerner and Stuckey. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in NFL betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NFL projections to be aware of news and injuries.\n\nThe most important position in the NFL is quarterback, and it's not unreasonable to see a line move 4-5 points or more if a star is suddenly ruled out on a Sunday morning. Other positions are less valuable to the spread, which might surprise a casual gambler. Notably, running backs -- even the very best ones that are popular in fantasy football -- rarely move betting lines if they're unable to play for whatever reason.\n\nUsing those advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense/defense/special teams, player values, news, predicting home-field advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NFL Projections\n\nOur NFL experts will provide consensus projections for every NFL game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NFL: They're simply bets on the margin of victory. Say the Baltimore Ravens have a spread of -6.5 vs. the Arizona Cardinals. In that situation, a spread bet on the Ravens would cash if Baltimore won by a touchdown or more. A bet on the Cardinals at +6.5 would cash if the Cardinals won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in the NFL. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NFL projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also important for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Tennessee Titans vs. Philadelphia Eagles game has a total of 47 points: Bettors on the under would cash if the teams combined for 46 or fewer points; over bettors would win at 48 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NFL projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Detroit Lions are +250 on the moneyline vs. the Chicago Bears, who are -290. If you bet $10 on the Lions and they won, you would receive $25 in profit. A bet on the Bears, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NFL projections?\nWhat NFL projections do The Action Network experts provide?\nRecent Stories\nSee All\nBroncos vs. Steelers Player Props: 3 Picks for Black Friday\nSam Farley\n•\n6 hours ago\nPRO\nBlack Friday Football Parlay: +285 PRO Ticket\nCarlos Avilan\n•\n8 hours ago\nChiefs vs. Bills Best Bets: 5 Picks for Thanksgiving Finale\nAction Network Staff\n•\n8 hours ago\nChiefs vs. Bills Preview: Mahomes Healthy & Dealing\nDoug Kezirian\n•\n9 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\ he Steelers-Bills game and 13,000 are on the Buffalo Bills, that’s 65% of bets on Buffalo.\nPercentage (%) of Money – The share of total dollars wagered on a particular side. Example: If the total handle (amount wagered) is $6 million and $5 million is on the Steelers, that’s 83% of the money on the Pittsburgh Steelers.\nHow to Read NFL Public Betting Data\n\nWhen comparing % of bets and % of money, look for discrepancies. Looking at the difference between the percentage of bets and the percentage of money can help The Action Network users find the NFL sides that have \"sharp money\" — in other words, those wagered on by pros. We also have expert NFL picks coverage.\n\nThis is important information because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones who tend to bet more, but those bets still count as just a single bet.\n\nHigh % bets + Low % money: Public is on one side, but big bettors aren’t.\nLow % bets + High % money: Smaller number of wagers, but larger dollar amounts — possible sharp action.\nBig differences (>15%): Worth investigating for potential value.\n\nExample: If the Tampa Bay Buccaneers have 69% of spread bets but 92% of the money, that’s a +23% difference, suggesting professional bettors are leaning Tampa Bay. Of course, it's also important to look at the total number of bets placed on the market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nNFL Public Betting Trends\n\nHistorical patterns show the public often gravitates toward:\n\nFavorites (especially in prime-time games)\n\nOvers (rooting for points is more fun)\n\nPopular teams (Dallas Cowboys, Kansas City Chiefs, Green Bay Packers)\n\nHowever, “fading the public” — betting against the majority — has historically produced value in certain situations, especially when 70%+ of bets are on one side.\n\nWhen it comes to NFL betting, we have plenty of resources available to you: NFL Odds & Betting Lines, NFL Betting Futures Odds, Expert NFL Picks, and NFL Teams Against the Spread Standings. If you're more into NFL Props, we also have NFL Props Projections and NFL Touchdown Props!\n\nYou can learn more about the Best NFL Betting Promos by checking out our review!\n\nAnd if you need help with odds conversions, check out our betting odds converter tool.\n\nHow the Public Bet the 2026 NFL Season\n\nBefore diving into the 2026-27 season, it's worth reviewing how the public fared last year — the same betting patterns tend to repeat, and knowing where the crowd went wrong is one of the best ways to find value this fall.\n\nThe 2025-26 season was a rough one for chalk bettors. Favorites won 65.9% of their games outright but covered the spread just 47.8% of the time — a sharp drop from 2024, when favorites went a historic 71.7% straight up and 53.3% against the spread.\n\nEven so, betting volume kept climbing, with DraftKings calling its NFL handle \"off-the-charts great\" and same-game parlays continuing to surge.\n\nKey Public Betting Trends From Last Season\n\nThe public backed the usual suspects. The Lions, Bills, Eagles, Chiefs and Cowboys drew the most betting action all season — big brands and preseason contenders, not the teams actually cashing tickets.\nVolume, not record, drove public losses. Detroit finished a middling 8-9 ATS, but the sheer number of bettors backing the Lions week after week made them a loss leader.\nThe best values were the least-bet teams. The Patriots and Seahawks — both +6000 preseason longshots — finished as the two most profitable teams for bettors, each going 12-5 ATS.\nMost-Bet Games of the Season\n\nStandalone prime-time games dominated the handle charts, with early-season matchups attracting the most money. The biggest betting event, as always, was the Super Bowl: the public backed Seattle early and often, pushing the spread from -4.5 to as high as -5.5, and bet slips piled up on the Seahawks to cover. Seattle's 29-13 win cashed those spread tickets, but the public's beloved over went down in flames — the 42 combined points fell well short of the total, a reminder that the crowd's over bias cuts both ways.\n\nBiggest Fades That Paid\n\nContrarian bettors had plenty to celebrate in 2025-26:\n\nFading the Chiefs: Kansas City lost nine games outright as a favorite and failed to cover in 10 — both league worsts.\nFading heavy favorites generally: with favorites covering under 48% of the time, taking the points was the winning side of the ledger.\nBacking live underdogs: the Panthers won eight games outright as an underdog, tied for the most in a season in the Super Bowl era.\nWhat It Means for 2026-27\n\nThe lesson heading into this season: the public will pile onto the same big-name favorites and overs it always does, and sportsbooks will shade lines accordingly. Watch for early public money inflating spreads on last year's darlings — the Seahawks and Patriots will carry Super Bowl hype into 2026-27, putting them at risk of becoming this year's overbet teams. Our live betting splits above update throughout the week once the season kicks off, so you can track exactly where the crowd is leaning in real time.\n\nFrequently Asked Questions\nWhat is NFL public betting data?\nWhat is the difference between \"% of bets\" and \"% of money\"?\nHow accurate are NFL public betting trends?\nIs it always better to \"fade the public\" in the NFL?\nHow do public betting trends cause NFL lines to move?\nWhere can I find real-time NFL betting splits?\nWhere can I bet on the NFL?\nRecent Stories\nSee All\nBroncos vs. Steelers Player Props: 3 Picks for Black Friday\nSam Farley\n•\n6 hours ago\nPRO\nBlack Friday Football Parlay: +285 PRO Ticket\nCarlos Avilan\n•\n8 hours ago\nChiefs vs. 06\n-13.5\n-106\n\t\n40%\n60%\n\t\n52%\n48%\n\n\nFinal\nKent State\n103\nE. Michigan\n104\n\t\n+5.5\n-5.5\n\t\n+7.3\n-7.3\n\t\n+7\n-7\n\t\nD\nD\n\t\n-2.4%\n-2.8%\n\t\n+6.5\n+102\n-6.5\n-102\n\t\n51%\n49%\n\t\n60%\n40%\nNCAAF Projections for 2026-27: Spread, Moneyline & Over/Under Insights\n\nWelcome to your one-stop source for the latest NCAAF projections for the 2026-27 college football season. Our expert projections cover spreads, moneylines, and totals, blended with advanced modeling and betting market signals to help you find edges and value before kickoff.\n\nWhat Are NCAAF Projections?\n\n“NCAAF projections” refer to forecasted odds (spreads, moneylines, over/unders) for every college football matchup — built by synthesizing statistical models, expert handicapping, and live betting market data. These projections estimate what sportsbooks “should” be offering, which then allows bettors to detect value when public or consensus lines deviate.\n\nHow to Use This NCAAF Projections Tool\n\nHere's a quick guide to digesting the data from our NCAAF projections tool:\n\nColumn\nWhat it means\nExample: Penn State at Ohio State\nOpen\nThe spread when sportsbooks first posted the game, before betting moved it.\nThe game opened at Ohio State –6.5.\nPro Line (Subscription Feature)\nOur model's odds for each game, compared to the consensus odds. We recommend at least a Grade of B or a +3.5% Edge before considering a bet based solely on projections.\nThe model makes Ohio State –5.5, meaning it thinks they should be favored by 5.5 points.\nCons.\nThe consensus line — the current market spread averaged across sportsbooks.\nBooks now have Ohio State –7, so the line has moved a half point since open.\nGrade\nA letter grade (A–F) rating how strong the gap is between our line and the market's.\nModel says –5.5, market says –7. That 1.5-point gap crossing a key number earns a B.\nEdge\nThe same gap shown as a percentage. Higher = more potential value.\nPenn State +7 shows a +4.2% edge — above the +3.5% threshold worth considering.\nBest Odds\nThe single best price on each side across all sportsbooks we track.\nOne book has Penn State +7.5 (–108) — a better number than the consensus +7.\nBet %\nThe share of total tickets (individual bets) on each side.\n75% of all bets are on Ohio State — the public likes the favorite.\nMoney %\nThe share of total dollars wagered on each side.\n60% of the money is on Penn State — fewer, larger bets suggest sharper action on the underdog.\nHow We Build Projections for 2026-27\n\nTo generate our NCAAF projections this season, we combine:\n\nPower ratings and advanced metrics: Reviewing offense, defense, special teams, tempo, efficiency, recruiting impact, roster turnover from the previous season.\nTeam news and injuries: Especially at key positions like quarterback. A QB injury or change in coaching staff triggers re-evaluation.\nHome-field advantage and rest/back-to-back weeks: Travel, bye weeks, and short weeks matter.\nHistorical performance and trend analysis: How teams performed in similar matchups, under similar conditions.\nLive betting market data: consensus lines, sportsbooks’ odds, public betting percentages. Our models aim to spot “edges” when our projections differ meaningfully from current market lines.\nWhat You’ll See in Our NCAAF Projections\n\nFor each game, we provide:\n\nSpread projection: Predicted margin between the two teams (how many points one is favored by).\nMoneyline projection: Odds for each team to win outright.\nOver/Under (Total): Predicted combined points scored by both teams.\nEdge: The difference (as a percentage) between our projection and the consensus/sportsbook line — this helps identify betting value.\nGrade: A letter grade (A-F) reflecting the strength of that edge; helps you quickly see which games to focus on.\nHow to Use Projections in Betting\nSpot the edge: Compare our 2025-26 projections vs current sportsbook lines. An edge of +3.5% or higher often starts to look compelling.\nRespect key numbers: A spread of 6.5 vs. 7, or a total of 49.5 vs. 50.5, can matter significantly because of scoring patterns in football.\nMonitor news up to game day: Last-minute injuries or weather shifts can swing spreads or totals and affect value.\nDiversify bets: Don’t just pick spreads — sometimes moneylines or overs/unders offer better return, depending on matchups.\nUse power ratings: Our projections derive from power ratings that update weekly, reflecting latest performance, rest, injuries, momentum. Use these to compare teams even before lines drop.\nExample: Sample Projections\n\nSay the Georgia Bulldogs have a spread of -6.5 vs. the Florida Gators. In that situation, a spread bet on Georgia would cash if they won by a touchdown or more. A bet on Alabama at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nNote that key numbers are important in projecting an edge in college football. Key numbers are just numbers that a game is likelier to land on because of the scoring in football: A 2-0 game is much less likely to occur than a 7-0 game. That means the difference between 6.5 and 7 on the spread is much more important than the difference between 12.5 and 13. The way we grade our NCAAF projections vs. the consensus accounts for these key numbers.\n\nKey numbers are also vital for totals, or over/unders, which are bets on the combined point output in a game. For a new bettor, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Oregon Ducks vs. Oklahoma Sooners game has a total of 64 points: Bettors on the under would cash if the teams combined for 63 or fewer points; over bettors would win at 65 or more.\n\nKey numbers are also important in totals betting because, again, scoring isn't by ones, twos, or threes like it is for, say, basketball. Since touchdowns are worth seven points apiece (assuming the extra point is made), total numbers in multiples of sevens and threes are more likely to occur.\n\nYou don't have to worry about key numbers in moneyline betting, which is a common wager type just on which team will win the game outright. Everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NCAAF projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Texas Tech Red Raiders are +250 on the moneyline vs. the Clemson Tigers, who are -290. If you bet $10 on Texas Tech and they won, you would receive $25 in profit. A bet on Clemson, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nProjections vs. Public Sentiment\n\nSometimes what our projections say diverges from what the public is betting. These misalignments can signal value:\n\nWhen public heavily backs the favorite, but our model’s projected spread is smaller.\nWhen underdogs get little attention but our model suggests they win outright with reasonable probability.\nWhen totals are inflated by marquee names or high-profile games, but underlying defense/offense metrics suggest lower scoring.\nStay Current: Weekly Updates & Trends\nProjections are refreshed weekly, especially when new stats, injuries, or reports come in.\nWe track which teams are trending up or down — momentum matters.\nBet monitoring: watch how sharp bettors are leaning, and where public money is going. These can influence line movement, sometimes creating last-minute value.\n\nIf you're serious about getting an edge in college football betting, these NCAAF projections are essential. They don't predict upsets or guarantee wins — but they give you a probabilistic foundation to make smarter bets. Use them to find mismatches, exploit line inefficiencies, and avoid getting caught up in hype.\n\nUpdated for the 2026-27 season, our projections reflect the realities of roster shifts, scoring trends, and a tighter market. Bookmark this page, check it weekly, al\nTCU\n113\nTexas Tech\n114\n\t\n+16.5\n-16.5\n\t\n+13.5\n+106\n-13.5\n-106\n\t\n40%\n60%\n\t\n52%\n48%\n\t\n+12%\n\t\n21,997\n\nCollege football is one of the most bet-on sports in the United States, with billions wagered every season. As more states legalize sports betting and more bettors go online, NCAAF public betting continues to grow in popularity. Understanding how the public is wagering can help you identify potential edges and make smarter bets.\n\nIn this guide, we’ll break down public betting data, explain the difference between percentage of bets and percentage of money, and show how to use these insights to your advantage. Public betting percentage shows the share of bets placed on each side of a game, while money percentage shows the share of total dollars wagered — sharp bettors watch the gap between the two to spot value.\n\nPercentages on this page reflect Action Network's tracked sportsbook data and are updated every 10 minutes on gameday. Figures below are illustrative examples; see the live odds table for current-week numbers.\n\nWhat is NCAAF Public Betting?\n\nNCAAF public betting data shows what share of bets and what share of money are being placed on each side of a college football game, based on real sportsbook activity we track across the industry.\n\nNCAAF public betting refers to the wagers placed by the general betting population on college football games. Tracking public betting trends helps you see which teams or sides most bettors favor. However, the public isn’t always right, which is why professional bettors, also known as “sharps,” often take the opposite side.\n\nBy combining public betting data with money percentages and total bet volume, you can get a clearer picture of where the smart money is going.\n\nFor example, in Week 1 of the 2025 season, Ohio State opened as a 7.5-point favorite over Texas. Bets skewed toward Ohio State early, but by kickoff the line had moved to 7 despite the majority of bets still on the Buckeyes — a reverse line movement that pointed to sharp money on Texas. That kind of divergence between ticket count and line movement is exactly what public betting data is meant to surface.\n\nTips for Interpreting NCAAF Public Betting\n\nUnderstanding how to interpret NCAAF public betting can provide an edge for college football bettors. Here's a handful of tips from our experts on interpreting NCAAF public betting data.\n\nLook for games where the delta between bet and money percentages is large — these often indicate professional interest.\nAvoid overvaluing data from games with small sample sizes of tracked bets.\nUse public betting data alongside other tools, such as line movement, team stats, and matchup analysis, to make informed decisions.\nTreat public betting data as one input among several, not a standalone system — it's most useful combined with injury news, weather, and situational trends (letdown spots, short weeks, revenge games).\nResponsible gambling note: public and money percentages describe crowd behavior, not guaranteed outcomes. Never bet more than you can afford to lose, and use them as a research tool rather than a betting system on their own.\n\nA concrete example: An Action Network study found that teams receiving fewer than 45% of spread tickets since 2005 went 4,007-4,025-145 against the spread, a 49.9% win rate — essentially break-even, not a strong edge.\n\nHow to Use Public Betting and Money Percentages in College Football Betting\n\nWe house betting data from numerous U.S. online sportsbooks, including \"percentage of bets\" and \"percentage of money\" on every college football game and major bet type. Here's a look at a hypothetical Tennessee-Vanderbilt game.\n\nPercentage (%) of bets: The percentage of wagers on a particular side of a game. If Tennessee vs. Vanderbilt had 20,000 total bets that we've tracked and 12,000 of those are on the Vols, we'd say that Tennessee has received 60% of the bets.\nPercentage (%) of money: This is the same thing except for the money. If we know the total handle, we can then calculate the percentage of money on one side or another of a bet.\n\nCombining those two factors can help college football bettors eye bets that might be worth making. The reason is because not all bets are the same amount of money. A single $10,000 sharp bet can outweigh hundreds of $10 public tickets — which is why money percentage often tells a different story than bet percentage.\n\nThus, the difference between the percentage of money and the percentage of bets can often highlight the games in which pro bettors are getting down action. And, well, they're professional and bet high amounts for a reason: It could be a good bet to take those sides.\n\nIt's also important to look at the total number of bets we're tracking, which you can see on the far right of the table above. The reason is that you don't want to put too much stock in a money vs. bet difference that has a small sample of bets. Utilizing all four factors -- bet percentage, money percentage, bet vs. money percentage (the delta), and total bets -- is recommended when using betting data to gain an advantage.\n\nWhy the Difference Matters\n\nThe difference between the percentage of bets and the percentage of money — sometimes called the “delta” — can highlight games where professional bettors are placing high-stakes wagers.\n\nWhen bet % and money % diverge sharply, it signals sharp (professional) money on one side. For example, 40% of bets but 80% of money on a team suggests a small number of large wagers from sharps rather than broad public support. \n\nScenario: 60% of bets on Tennessee but 80% of the money on them suggests sharp action favoring Tennessee over Vanderbilt.\nSharps bet large amounts for a reason: it could indicate a more favorable line or value that casual bettors might overlook.\n\nWe track this kind of split throughout the week across the CFB slate. In the hypothetical example above, the line held steady from open to close even as public tickets piled up on Tennessee — the kind of resistance that often accompanies sharp money quietly balancing the book on the other side. Watching for that pattern, rather than reacting to a single day's number, is where public betting data earns its keep.\n\nIf you want to apply NCAAF public betting insights, claim these NCAAF betting promos and/or NCAAF prediction market promos.\n\nFrequently Asked Questions\nWhat is a point spread in college football betting?\nWhat is a total or over/under bet in a college football game?\nHow do moneylines work in college football betting?\nWhere can I bet on college football?\nRecent Stories\nSee All\nPRO\n2 Random Games, 2 Clear Sharp Sides\nAlex Kolodziej\n•\n10 hours ago\nTCU vs. Texas Tech: A 1H Bet for Thanksgiving\nCollin Wilson\n•\n10 hours ago\nPRO\n+582 Trap-Spot Fade Parlay\nAlex Kolodziej\n•\n11 hours ago\nBlack Friday Sports Betting Picks: NFL and College Football Games to Watch This Weekend\nIan Undery\n•\n11 hours ago\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Code\nPolymarket Promo Code\nFanDuel Predicts Promo Code\nKalshi Promo Code\nNovig Promo Code\nDraftKings Predictions Promo Code\nProphetX Promo Code\nDraftKings Promo Code\nFanDuel Promo Code\ntheScore Bet Promo Code\nbetPARX P  on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NBA Projections\n\nOur NBA experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on the NBA: They're simply bets on the margin of victory. Say the Los Angeles Lakers have a spread of -6.5 vs. the Sacramento Kings. In that situation, a spread bet on the Lakers would cash if they won by a 7 points or more. A bet on the Kings at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Boston Celtics vs. New York Knicks game has a total of 205 points: Bettors on the under would cash if the teams combined for 206 or fewer points; over bettors would win at 204 or more. An exact total of 205 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Orlando Magic are +250 on the moneyline vs. the Chicago Bulls, who are -290. If you bet $10 on the Magic and they won, you would receive $25 in profit. A bet on the Bulls, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NBA Projections?\nWhat NBA projections do The Action Network experts provide?\nRecent Stories\nSee All\nNBA Spot Tracker: Daily Betting Trends, Prop Angles, More\nEvan Abrams\n•\n4 hours ago\n8 NBA Best Bets for Wednesday\nAction Network Staff\n•\nNov 25, 2026 EST\nNBA SGP Playbook: +1556 Parlay for Spurs-Blazers Tonight\nAlex Hinton\n•\nNov 25, 2026 EST\nEmirates NBA Cup Picks: Best Bets for Wednesday Night's Games\nIan Undery\n•\nNov 25, 2026 EST\nSports Betting Odds\nNFL Odds & Betting Lines\nNBA Odds & Betting Lines\nCollege Football Odds & Betting Lines\nMen's College Basketball Odds & Betting Lines\nWomen's College Basketball Odds & Betting Lines\nMLB Odds & Betting Lines\nNHL Odds & Betting Lines\nExpert Picks\nNFL Picks & Analysis\nNBA Picks & Analysis\nCollege Football Picks & Analysis\nCollege Basketball Picks & Analysis\nMLB Picks & Analysis\nNHL Picks & Analysis\nOnline Sports Betting News & Offers\nLegalization Tracker\nNew York\nLouisiana\nMaryland\nArizona\nColorado\nNew Jersey\nPennsylvania\nIllinois\nMichigan\nOhio\nMassachusetts\nKansas\nNorth Carolina\nMissouri\nCanada\nBest U.S. Sportsbook & Prediction Market Promos\nFanatics Sportsbook Promo Code\nBetMGM Bonus Code\nbet365 Bonus Co age of bets\" and \"percentage of money\" on every NBA game and bet type.\n\nPercentage (%) of bets: The proportion of bets made on a side of a wager. For example, if we track 20,000 bets on the Lakers-Suns game and 13,000 of them are on the Suns, that would be 65% of bets on the Suns.\nPercentage (%) of money: The proportion of money bet on a side of a wager. For example, if we track a total handle -- a betting term that means \"amount wagered\" -- of $6 million and $5 million is on the Lakers, that would be 83% of the money on the Lakers.\n\nThis is important information because not every bet is the same. Some bettors will place a wager of $5 while others might bet $5,000. The sharp and professional bettors are the ones that tend to bet more, but those bets still count as just a single bet.\n\nTherefore, looking at the difference between the percentage of bets and the percentage of money can help The Action Network users find the NBA sides that have \"sharp money\" -- in other words, those wagered on by pros. We also have expert NBA picks coverage.\n\nHere's another example: Say the Miami Heat are getting 69% of the spread bets against the Dallas Mavericks, but 92% of the money bet on that game's spread is on the Heat. That would be a percentage difference of 23% on the Heat, highlighting that the bettors willing to wager a lot of money -- these are likely to be sharp and pro bettors -- are on Miami.\n\nOf course, it's also important to look at the total number of bets placed on the market, which we also display on this page for The Action Network users. If there are just a few hundred bets, the resulting bet and money percentages might be skewed by the small sample size. In contrast, if that game has thousands and thousands of bets, you can trust that data more.\n\nFrequently Asked Questions\nWhat is a point spread in NBA betting?\nWhat is a total or over/under bet in an NBA game?\nHow do moneylines work in NBA betting?\nWhere can I bet on the NBA?\nRecent Storie lend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in college basketball betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NCAAB projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NCAAB Projections\n\nOur college basketball experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on college basketball: They're simply bets on the margin of victory. Say the Gonzaga Bulldogs have a spread of -6.5 vs. the UCLA Bruins. In that situation, a spread bet on Gonzaga would cash if they won by a 7 points or more. A bet on UCLA at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Baylor Bears vs. Arizona Wildcats game has a total of 175 points: Bettors on the under would cash if the teams combined for 174 or fewer points; over bettors would win at 175 or more. An exact total of 175 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Ohio State Buckeyes are +250 on the moneyline vs. the Michigan Wolverines, who are -290. If you bet $10 on the Buckeyes and they won, you would receive $25 in profit. A bet on the Wolverines, who are favored, would require $29 bet to win $10 in the event of a victory.\n\nFrequently Asked Questions\nWhat are NCAAB projections?\nWhat NCAAB projections do The Action Network experts provide?\nRecent Stories\nSee All\nSt. John's vs Iowa State: Johnnies to Bounce Back?\nJonathan Jorcin\n•\n2 hours ago\nCarter Elliott: 'Sleepers' 4 Feast Week Best Bets for Friday\nCarter Elliott\n•\n4 hours ago\nVirginia vs Xavier: W            ['reb','Rebounds',0,1],['ast','Assists',0,1],['tov','Turnovers',1,1],['stl','Steals',0,1],['blk','Blocks',0,1],['pfoul','Fouls',1,1]],
  foot: [['pf','Points',0,1],['pa','Points allowed',1,1],['margin','Point margin',0,'+'],['pass_yds','Pass yards',0,1],
         ['pass_ypa','Yards / pass',0,2],['rush_yds','Rush yards',0,1],['rush_ypc','Yards / rush',0,2],['third_pct','3rd down %',0,'%'],
         ['rz_pct','Red zone TD %',0,'%'],['ints','Interceptions thrown',1,2],['sacks','Sacks taken',1,2],['first_downs','First downs',0,1]],
  other: [['pf','Scored',0,2],['pa','Allowed',1,2],['margin','Margin',0,'+']]
};
const OV_FAM = sp => /^(nba|ncaab|ncaaw|wnba)$/.test(sp) ? 'basket' : /^(nfl|ncaaf|cfb)$/.test(sp) ? 'foot' : 'other';
function ovCss(){
  if(document.getElementById('ovCss')) return;
  const st=document.createElement('style'); st.id='ovCss';
  st.textContent=`.ov-wrap{margin-top:4px}.ov-wrap h5{margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted,#9199a7)}
  .ov-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  .ov-t th,.ov-t td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line,#2f3540);white-space:nowrap}
  .ov-t th{font-weight:600;color:var(--muted,#9199a7);font-size:12px}.ov-t td:first-child,.ov-t th:first-child{text-align:left}
  .ov-t .lab{color:var(--muted,#9199a7);font-size:12px}.ov-w{color:#3cc48f}.ov-l{color:#ee6b5b}.ov-p{color:var(--muted,#9199a7)}
  .ov-best{color:#3cc48f;font-weight:600}.ov-rk{color:var(--muted,#9199a7);font-size:11px;margin-left:3px}
  .ov-team{font-weight:600;margin:10px 0 2px}.ov-team span{color:var(--muted,#9199a7);font-weight:400;font-size:12px;margin-left:6px}
  .ov-note{color:var(--muted,#9199a7);font-size:11px;margin-top:4px}.ov-scroll{overflow-x:auto}`;
  document.head.appendChild(st);
}
function ovBlock(g, secClass){
  const ov=g&&g.overview; if(!ov||!ov.sides) return '';
  ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const A=ov.sides.away||{}, Hm=ov.sides.home||{}, sp=g.sport||g.league||'';
  const rec=r=>!r?'–':(r[0]+'-'+r[1]+(r[2]?'-'+r[2]:''));
  const pctOf=r=>r&&(r[0]+r[1])?r[0]/(r[0]+r[1]):null;
  const tint=(r)=>{ const p=pctOf(r); return p==null?'':p>=0.6?'ov-w':p<=0.4?'ov-l':''; };
  const cell=r=>`<td class="${tint(r)}">${rec(r)}</td>`;
  const o=g.odds||{};
  const favSide = o.spread_away!=null ? (+o.spread_away<0?'away':+o.spread_away>0?'home':null)
                : o.ml_away!=null&&o.ml_home!=null ? (+o.ml_away<+o.ml_home?'away':'home') : null;
  const streak=s=>s==null||s===0?'':(s>0?'W'+s:'L'+(-s));
  const num=(v,f)=>v==null?'–':f==='%'?(+v).toFixed(1)+'%':f==='+'?((+v>0?'+':'')+(+v).toFixed(1)):(+v).toFixed(f===2?2:1).replace(/\.0$/,'');
  // 1. situational records
  const sitTable=(t,side)=>{
    const s=t.sit; if(!s||!s.splits) return '';
    const S=s.splits, venue=side==='home'?'home':'road', role=favSide?(favSide===side?'fav':'dog'):null;
    const rows=[['Overall','overall'],['Last 5','last_5'],['Last 10','last_10'],[side==='home'?'At home':'On the road',venue]];
    if(role) rows.push([role==='fav'?'As favorite':'As underdog',role]);
    const body=rows.filter(([,k])=>S[k]).map(([l,k])=>`<tr><td class="lab">${l}</td>${cell(S[k].su)}${cell(S[k].ats)}<td>${S[k].ou?S[k].ou[0]+'-'+S[k].ou[1]+(S[k].ou[2]?'-'+S[k].ou[2]:''):'–'}</td></tr>`).join('');
    const pf=s.pf!=null?` · ${num(s.pf)} for / ${num(s.pa)} against`:'';
    return `<div class="ov-team">${e(t.abbr||t.name)}<span>${side} · ${s.w}-${s.l}${streak(s.streak)?' · '+streak(s.streak):''}${pf}</span></div>
      <table class="ov-t"><tr><th></th><th>SU</th><th>ATS</th><th>O-U</th></tr>${body}</table>`;
  };
  // 2. last 5 games
  const res=(v,txt)=>`<span class="${v==='W'||v==='O'?'ov-w':v==='L'||v==='U'?'ov-l':'ov-p'}">${txt}</span>`;
  const lastTable=(t,rows)=>{
    if(!(rows||[]).length) return '';
    const d=s=>{ const p=String(s).split('-'); return p.length===3?(+p[1])+'/'+(+p[2]):s; };
    return `<div class="ov-team">${e(t)}</div><div class="ov-scroll"><table class="ov-t"><tr><th>Date</th><th>Opp</th><th>Result</th><th>ATS</th><th>O-U</th></tr>${rows.map(r=>
      `<tr><td class="lab">${d(r.date)}</td><td>${r.ha} ${e(r.opp)}</td><td>${res(r.res,r.res+' '+e(r.score))}</td>`+
      `<td>${r.spread==null?'–':res(r.ats,(r.spread>0?'+':'')+r.spread+' '+(r.ats||''))}</td>`+
      `<td>${r.total==null?'–':res(r.ou,(r.ou||'')+' '+r.total)}</td></tr>`).join('')}</table></div>`;
  };
  // 3. stat matchup
  const fam=OV_FAM(String(sp).toLowerCase()), defs=OV_STATS[fam];
  const sa=A.stats||{}, sh=Hm.stats||{}, ra=A.ranks||{}, rh=Hm.ranks||{};
  const ord=n=>n+(['th','st','nd','rd'][((n%100)-20)%10]||['th','st','nd','rd'][n%100]||'th');
  const statRows=defs.filter(([k])=>sa[k]!=null||sh[k]!=null).map(([k,l,low,f])=>{
    const a=sa[k], b=sh[k]; const better=a==null||b==null||a===b?null:((a<b)===!!low?'a':'b');
    const rk=r=>r?`<span class="ov-rk">${ord(r[0])}</span>`:'';
    return `<tr><td class="${better==='a'?'ov-best':''}">${num(a,f)}${rk(ra[k])}</td><td class="lab">${l}</td><td class="${better==='b'?'ov-best':''}">${num(b,f)}${rk(rh[k])}</td></tr>`;
  }).join('');
  const pool=ov.rank_pool;
  let h=`<div class="${secClass||'ui-sec'} ov-wrap"><h4>Form &amp; matchup</h4>`;
  const sit=sitTable(A,'away')+sitTable(Hm,'home');
  if(sit) h+=`<h5>Records (straight up, against the spread, over-under)</h5>${sit}`;
  if((ov.h2h||[]).length) h+=`<h5>Head to head (recent)</h5>${lastTable('Results from '+(ov.h2h[0].team||'')+"'s side",ov.h2h)}`;
  const l5=lastTable((A.abbr||'Away')+' last 5',A.last)+lastTable((Hm.abbr||'Home')+' last 5',Hm.last);
  if(l5) h+=`<h5>Recent games, closing line</h5>${l5}`;
  if(statRows) h+=`<h5>Season stats</h5><table class="ov-t"><tr><th>${e(A.abbr||'Away')}</th><th></th><th>${e(Hm.abbr||'Home')}</th></tr>${statRows}</table>
    <div class="ov-note">${fam==='foot'?'Per game. ':''}Green = better side. ${pool?`Rank = among the ${pool} teams our Action Network runs have seen this season (grows as more games are scraped).`:''} Action's site has no defensive breakdown beyond points allowed.</div>`;
  return h+`</div>`;
}

/* ===== From the articles (an_articles.py: picks + key facts per game, no links) 2026-11-12 ===== */
function notesBlock(g, secClass){
  const n=g&&g.article_notes; if(!n||(!n.summary&&!(n.picks||[]).length&&!(n.facts||[]).length)) return '';
  if(typeof ovCss==='function') ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(!document.getElementById('anCss')){ const st=document.createElement('style'); st.id='anCss';
    st.textContent=`.an-pick{padding:5px 0;border-bottom:1px solid var(--line,#2f3540)}.an-pick b{font-weight:600}
    .an-src{color:var(--muted,#9199a7);font-size:12px}.an-fact{display:flex;gap:8px;padding:5px 0;font-size:13px;line-height:1.35}
    .an-tag{flex:0 0 auto;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--raised,#252a33);color:var(--muted,#9199a7);height:fit-content}
    .an-tag.Injury{color:#ee6b5b}.an-tag.Spot{color:#e7b453}.an-tag.Form{color:#3cc48f}.an-tag.Numbers{color:#a9c1ff}
    .an-sum{font-size:14.5px;line-height:1.5;margin:6px 0 4px}.an-det{margin-top:8px}.an-det summary{cursor:pointer;font-size:13px;color:var(--muted,#9199a7);padding:4px 0}`;
    document.head.appendChild(st); }
  const label={Injury:'Injury',Spot:'Spot',Form:'Form',Numbers:'Numbers',Note:'Note'};
  const picks=(n.picks||[]).map(p=>`<div class="an-pick"><b>${e(p.pick)}</b>${p.play_to?` <span class="an-src">play to ${e(p.play_to)}</span>`:''}<div class="an-src">${p.by?e(p.by)+' · ':''}${e(p.src||'')}</div></div>`).join('');
  const facts=(n.facts||[]).map(f=>`<div class="an-fact"><span class="an-tag ${e(f.tag)}">${e(label[f.tag]||f.tag)}</span><span>${e(f.text)}</span></div>`).join('');
  /* 2026-11-18: Codex-written summary (an_summary.py) on top; the fact list folds under Details */
  const h5=t=>`<h5 style="margin:10px 0 2px;font-size:13px;color:var(--muted,#9199a7)">${t}</h5>`;
  const fromData=n.summary_src==='data';
  const sum=n.summary?`<p class="an-sum">${e(n.summary)}</p>${fromData?'<div class="an-src">No article on this game - written from the odds, betting splits, picks, form and stats.</div>':''}`:'';
  const factHtml=facts?(sum?`<details class="an-det"><summary>Details from the articles (${(n.facts||[]).length})</summary>${facts}</details>`:h5('Key facts')+facts):'';
  return `<div class="${secClass||'ui-sec'}"><h4>${fromData?'Game summary':`From the articles${n.n_articles?` (${n.n_articles})`:''}`}</h4>${sum}${picks?h5('Picks')+picks:''}${factHtml}</div>`;
}

function card(g){
  const id = g.sport+':'+g.id, t=g.teams||[];
  const live = /live|in_progress|progress|1st|2nd|3rd|half|quarter|period/i.test(g.status||'');
  const score = g.score?` · ${g.score[0]}-${g.score[1]}`:'';
  const at = (g.sides||[])[0]==='away' ? '@' : 'vs';
  const head = t.length===2?`${esc(t[0])} <span class="meta">${at}</span> ${esc(t[1])}`:esc(g.title);
  const sub = [g.league_name&&g.league_name!==g.league?g.league_name:'', g.broadcast||'', g.num_bets?Number(g.num_bets).toLocaleString()+' bets':''].filter(Boolean).join(' · ');
  const body = oddsTable(g)+bars(g)+ovBlock(g,'sec')+pro(g)+picks(g)+notesBlock(g,'sec')+fstTips(g.fst)+extra(g)
    +(g.hub?`<div class="sec"><a href="${esc(g.hub)}" target="_blank" rel="noopener">Open on Action Network &rarr;</a></div>`:'');
  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(g.start)}</span>
    <div class="gteams">${head}${sub?`<small>${esc(sub)}</small>`:''}</div>
    ${(g.picks||[]).length?`<span class="badge">${g.picks.length} picks</span>`:''}${g.fst&&g.fst.tips.length?`<span class="badge fst">${g.fst.tips.length} FST</span>`:''}<span class="badge${live?' live':''}">${esc(g.status||'')}${score}</span></div>
    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;
}
function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
</html>
