ns, be it with a statistical model, using the betting market as a guide, or something else. And even within a statistical model, college basketball handicappers can vary in how they approach building it, focusing on team performance, player performance, or perhaps a hybrid blend of both.\n\nAt The Action Network, our NCAAB projections are projection blends of several of our key betting experts. How they approach their final numbers on a game might vary, but the blend of those projections work to create a better, composite number that is our best reflection of what to expect in a game.\n\nWe project the three big markets in college basketball betting -- spreads, over/unders, and moneylines -- and do so for every game in each season. Within our PRO Report -- part of our PRO subscription -- we'll measure those projections against lines for every U.S. book, so you can easily spot edges and potential bets.\n\nA lot of our experts rely on advanced statistics to build their models and get their numbers on games, and of course it's incredibly important when building NCAAB projections to be aware of news and injuries.\n\nIt's not unreasonable to see a line move 6-7 points or more if a star is suddenly ruled out ahead of a game. Using advanced stats, along with a variety of other important factors like recent play, advantages for a team on offense and defense, player values, news, predicting home-court advantage and rest situations is how our experts land on the numbers you see above.\n\nThe Action Network's NCAAB Projections\n\nOur college basketball experts will provide consensus projections for every NBA game's spread, moneyline, and over/under. On this page you'll then find those projections compared to the market in two ways: 1) the edge, which is the percentage difference between a sportsbook's odds vs. our projections and 2) a letter grade based on that edge.\n\nThe two comparisons are correlated, so don't stress about which you use. We show the edge to be transparent for bettors, and some advanced bettors will bet based on the Kelly criterion, which adjusts bet sizes based on projected edge. But if you just want to quickly eye things, the \"A\" through \"F\" grades are based on those edge numbers and might be easier to understand for novice bettors. Both comparisons are color-coded with the highest edges and \"A\" grades given a green coloring while negative edges and \"F\" grades will have red markings.\n\nSpread projections will be compared to the consensus line in the market, but of course, spread numbers will vary based on the book, so in reality, sometimes your edge can be higher if you find a good number.\n\nIf you're unfamiliar, spread bets are one of the most common wagers on college basketball: They're simply bets on the margin of victory. Say the Gonzaga Bulldogs have a spread of -6.5 vs. the UCLA Bruins. In that situation, a spread bet on Gonzaga would cash if they won by a 7 points or more. A bet on UCLA at +6.5 would cash if they won the game outright or merely lost by six or fewer points.\n\nWhen it comes to totals or over/unders, which are bets on the combined point output in a game, you'll see a total number posted at a sportsbook and you'll be able to bet the over or under. Say the Baylor Bears vs. Arizona Wildcats game has a total of 175 points: Bettors on the under would cash if the teams combined for 174 or fewer points; over bettors would win at 175 or more. An exact total of 175 would be a push and the bet would be voided.\n\nIn moneyline betting, which is a common wager type just on which team will win the game outright, everything here depends on the likelihood of a team winning (the odds a book will post) vs. how likely our NBA projections say that team is to win.\n\nIt's easiest if you think about moneyline odds in terms of $10 or $100 increments. Say the Ohio State Buckeyes are +250 on the moneyline vs. the Michigan Wolverines, who are -290. If you bet $10 on the Buckeyes and they won, you would receiv   return `<table class="odds"><tr><th></th><th>Spread</th><th>ML</th><th>Total</th></tr>${rows.join('')}</table><div class="legend">Consensus line. Open row = away / home opening line.</div>`;
}
function bars(g){
  const o=g.odds||{}, t=g.teams||[], out=[];
  const side = (m,s,label)=>{ const b=o[`${m}_${s}_public`], mo=o[`${m}_${s}_money`]; if(b==null&&mo==null) return;
    out.push(`<div class="bar"><span class="lbl">${esc(label)}</span><div class="meter"><i style="width:${+b||0}%"></i><span>${b==null?'':pct(b)+' bets'}</span></div><div class="meter m"><i style="width:${+mo||0}%"></i><span>${mo==null?'':pct(mo)+' money'}</span></div></div>`); };
  [['spread','Spread'],['ml','ML']].forEach(([m,l])=>{ side(m,'away',`${l} ${t[0]||'away'}`); side(m,'home',`${l} ${t[1]||'home'}`); });
  side('total','over','Over'); side('total','under','Under');
  return out.length?`<div class="sec"><h4>Public betting</h4>${out.join('')}</div>`:'';
}
// 2026-11-05: one table instead of three raw dumps (sharp / projections / public repeat the same
// Open, Best line and Bet%/Money%). Field "1" = first team in the header, "2" = second.
function pro(g){
  const p=g.pro||{}; if(!Object.keys(p).length) return '';
  const t=g.teams||[], n1=esc(t[0]||'Team 1'), n2=esc(t[1]||'Team 2');
  const order=['projections','sharp','public'], srcs=[...order.filter(k=>p[k]).map(k=>p[k]), ...Object.keys(p).filter(k=>!order.includes(k)).map(k=>p[k])];
  const get=f=>{ for(const s of srcs){ const v=s&&s[f]; if(v!=null&&v!=='') return String(v); } return ''; };
  const has=f=>get(f+'1')!==''||get(f+'2')!=='';
  const num=v=>parseFloat(String(v).replace('%','').replace(/^pk$/i,'0'));
  const used=new Set(), rows=[];
  const mark=(...fs)=>fs.forEach(f=>{used.add(f); used.add(f+'1'); used.add(f+'2');});
  const row=(label,a,b)=>rows.push(`<tr><td>${label}</td><td>${a||'—'}</td><td>${b||'—'}</td></tr>`);
  const gc=v=>/^[AB]/.test(v)?'good':/^[DF]/.test(v)?'bad':'';
  const notes=[];
  if(has('Grade')){ row('Grade', `<span class="gr ${gc(get('Grade1'))}">${esc(get('Grade1')||'—')}</span>`, `<span class="gr ${gc(get('Grade2'))}">${esc(get('Grade2')||'—')}</span>`); mark('Grade'); }
  if(has('ProLine')){
    const e=i=>get('Edge'+i)?` <span class="meta">${esc(get('Edge'+i))}</span>`:'';
    row('PRO line', esc(get('ProLine1'))+e(1), esc(get('ProLine2'))+e(2)); mark('ProLine','Edge');
  }
  if(has('Consensus')){ row('Market', esc(get('Consensus1')), esc(get('Consensus2'))); mark('Consensus'); }
  // model vs market: points of value on team 1 = market line - model line
  const pv=num(get('Consensus1'))-num(get('ProLine1'));
  if(isFinite(pv) && Math.abs(pv)>=0.5) notes.push(`Model likes <b>${pv>0?n1:n2}</b> by ${Math.abs(pv).toFixed(1).replace(/\.0$/,'')}${Math.abs(pv)===1?' pt':' pts'} vs the market`);
  if(has('Open')){ row('Open', esc(get('Open1')), esc(get('Open2'))); mark('Open'); }
  // best line: only a clean opposite-sign pair (the pages sometimes carry alt lines like +20.5 / +7)
  const best=srcs.find(s=>{ const x=num(s.BestLine1), y=num(s.BestLine2); return isFinite(x)&&isFinite(y)&&((x>0)!==(y>0)||(x===0&&y===0)); });
  if(best){ const j=v=>v?` <span class="meta">(${esc(v)})</span>`:''; row('Best line', esc(best.BestLine1)+j(best.BestJuice1), esc(best.BestLine2)+j(best.BestJuice2)); }
  mark('BestLine','BestJuice');
  if(has('BetPct')||has('MoneyPct')){
    row('Bets / Money', `${esc(get('BetPct1')||'—')} / ${esc(get('MoneyPct1')||'—')}`, `${esc(get('BetPct2')||'—')} / ${esc(get('MoneyPct2')||'—')}`);
    [1,2].forEach(i=>{ const d=num(get('MoneyPct'+i))-num(get('BetPct'+i)); if(isFinite(d)&&d>=10) notes.push(`Money &gt; bets on <b>${i===1?n1:n2}</b> (+${Math.round(d)}%)`); });
    mark('BetPct','MoneyPct');
  }
  // sharp signals: any field "<Name>1"/"<Name>2" set to Y
  const sig={1:[],2:[]};
  srcs.forEach(s=>Object.entries(s).forEach(([k,v])=>{ const m=k.match(/^(.*)([12])$/); if(m&&v==='Y'&&!sig[m[2]].includes(m[1])){ sig[m[2]].push(m[1]); used.add(k); } }));
  const nice=a=>a.map(x=>x.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^PROSystems$/,'PRO Systems')).join(', ');
  if(sig[1].length||sig[2].length) row('Signals', esc(nice(sig[1])), esc(nice(sig[2])));
  const tb=get('TotalBets'); used.add('TotalBets'); used.add('Diff');
  const other=[]; srcs.forEach(s=>Object.entries(s).forEach(([k,v])=>{ if(!used.has(k)&&v!=null&&v!==''&&!other.some(o=>o[0]===k)){ other.push([k,v]); } }));
  if(!rows.length&&!other.length) return '';
  return `<div class="sec"><h4>Action PRO</h4>${rows.length?`<table class="odds pro"><tr><th></th><th>${n1}</th><th>${n2}</th></tr>${rows.join('')}</table>`:''}`
    +(notes.length?`<div class="pronotes">${notes.map(n=>`<div>${n}</div>`).join('')}</div>`:'')
    +(tb?`<div class="legend">${esc(tb)} bets tracked</div>`:'')
    +(other.length?`<div class="kv" style="margin-top:6px">${other.map(([k,v])=>`<span><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>`:'')+`</div>`;
}
function picks(g){
  const ps=g.picks||[]; if(!ps.length) return '';
  return `<div class="sec"><h4>Expert picks (${ps.length})</h4>${ps.map(p=>`<div class="pick"><b>${esc(p.Pick)}</b> ${p.Units?`<span class="badge">${esc(p.Units)}</span>`:''}<div class="who">${esc(p.Analyst)}${p.Record?' · '+esc(p.Record):''}${p.Posted?' · '+esc(p.Posted):''}</div>${p.Note?`<div class="note">${esc(p.Note)}</div>`:''}</div>`).join('')}</div>`;
}
function fstTips(f, headTitle){
  if(!f||!(f.tips||[]).length) return '';

    <div class="who">${t.market?esc(t.market):''}${t.source==='acca'?`${t.market?' · ':''}leg of their ${esc(t.product)}${t.product_legs?` (${t.product_legs} legs${t.product_odds_frac?', '+esc(t.product_odds_frac):''})`:''}`:''}</div>${t.reason?`<div class="note">${esc(t.reason)}</div>`:''}</div>`;
  return `<div class="sec"><h4>${headTitle||'freesupertips'} (${ts.length})</h4>${own.map(row).join('')}${acc.map(row).join('')}${f.url?`<div class="legend"><a href="${esc(f.url)}" target="_blank" rel="noopener">Full preview on freesupertips.com &rarr;</a></div>`:''}</div>`;
}
function fstCard(f){

  return `<div class="card${open.has(id)?' open':''}" data-id="${esc(id)}"><div class="ghead"><span class="gtime">${fmtTime(f.start)}</span>

function arts(list, title){
  if(!(list||[]).length) return '';
  return `<div class="sec"><h4>${title}</h4><ul class="arts">${list.map(a=>`<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></li>`).join('')}</ul></div>`;

function extra(g){
  const o=g.odds||{}; const shown=/^(ml|spread|total|over|under|draw|ml_draw)(_|$)/;
  const rest=Object.entries(o).filter(([k])=>!shown.test(k)||/(tickets|sharp)/.test(k));
  return rest.length?`<div class="sec"><h4>More from the odds feed</h4><div class="kv">${rest.map(([k,v])=>`<span><b>${esc(k.replace(/_/g,' '))}</b> ${esc(v)}</span>`).join('')}</div></div>`:'';
}
/* ===== Form & matchup block (Action Network game Overview data, an_overview.py) 2026-11-12 ===== */
const OV_STATS = {
  basket: [['pf','Points',0,1],['pa','Points allowed',1,1],['margin','Point margin',0,'+'],['fg_pct','Field goal %',0,'%'],
           ['three_pct','3-point %',0,'%'],['three_made','3s made',0,1],['ft_pct','Free throw %',0,'%'],['fta','Free throw att',0,1],
           ['reb','Rebounds',0,1],['ast','Assists',0,1],['tov','Turnovers',1,1],['stl','Steals',0,1],['blk','Blocks',0,1],['pfoul','Fouls',1,1]],
  foot: [['pf','Points',0,1],['pa','Points allowed',1,1],['margin','Point margin',0,'+'],['pass_yds','Pass yards',0,1],
         ['pass_ypa','Yards / pass',0,2],['rush_yds','Rush yards',0,1],['rush_ypc','Yards / rush',0,2],['third_pct','3rd down %',0,'%'],
         ['rz_pct','Red zone TD %',0,'%'],['ints','Interceptions thrown',1,2],['sacks','Sacks taken',1,2],['first_downs','First downs',0,1]],
  other: [['pf','Scored',0,2],['pa','Allowed',1,2],['margin','Margin',0,'+']]
};
const OV_FAM = sp => /^(nba|ncaab|ncaaw|wnba)$/.test(sp) ? 'basket' : /^(nfl|ncaaf|cfb)$/.test(sp) ? 'foot' : 'other';
function ovCss(){
  if(document.getElementById('ovCss')) return;
  const st=document.createElement('style'); st.id='ovCss';
  st.textContent=`.ov-wrap{margin-top:4px}.ov-wrap h5{margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted,#9199a7)}
  .ov-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  .ov-t th,.ov-t td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line,#2f3540);white-space:nowrap}
  .ov-t th{font-weight:600;color:var(--muted,#9199a7);font-size:12px}.ov-t td:first-child,.ov-t th:first-child{text-align:left}
  .ov-t .lab{color:var(--muted,#9199a7);font-size:12px}.ov-w{color:#3cc48f}.ov-l{color:#ee6b5b}.ov-p{color:var(--muted,#9199a7)}
  .ov-best{color:#3cc48f;font-weight:600}.ov-rk{color:var(--muted,#9199a7);font-size:11px;margin-left:3px}
  .ov-team{font-weight:600;margin:10px 0 2px}.ov-team span{color:var(--muted,#9199a7);font-weight:400;font-size:12px;margin-left:6px}
  .ov-note{color:var(--muted,#9199a7);font-size:11px;margin-top:4px}.ov-scroll{overflow-x:auto}`;
  document.head.appendChild(st);
}
function ovBlock(g, secClass){
  const ov=g&&g.overview; if(!ov||!ov.sides) return '';
  ovCss();
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const A=ov.sides.away||{}, Hm=ov.sides.home||{}, sp=g.sport||g.league||'';
  const rec=r=>!r?'–':(r[0]+'-'+r[1]+(r[2]?'-'+r[2]:''));
  const pctOf=r=>r&&(r[0]+r[1])?r[0]/(r[0]+r[1]):null;
  const tint=(r)=>{ const p=pctOf(r); return p==null?'':p>=0.6?'ov-w':p<=0.4?'ov-l':''; };
  const cell=r=>`<td class="${tint(r)}">${rec(r)}</td>`;
  const o=g.odds||{};
  const favSide = o.spread_away!=null ? (+o.spread_away<0?'away':+o.spread_away>0?'home':null)
                : o.ml_away!=null&&o.ml_home!=null ? (+o.ml_away<+o.ml_home?'away':'home') : null;
  const streak=s=>s==null||s===0?'':(s>0?'W'+s:'L'+(-s));
  const num=(v,f)=>v==null?'–':f==='%'?(+v).toFixed(1)+'%':f==='+'?((+v>0?'+':'')+(+v).toFixed(1)):(+v).toFixed(f===2?2:1).replace(/\.0$/,'');
  // 1. situational records
  const sitTable=(t,side)=>{
    const s=t.sit; if(!s||!s.splits) return '';
    const S=s.splits, venue=side==='home'?'home':'road', role=favSide?(favSide===side?'fav':'dog'):null;
    const rows=[['Overall','overall'],['Last 5','last_5'],['Last 10','last_10'],[side==='home'?'At home':'On the road',venue]];
    if(role) rows.push([role==='fav'?'As favorite':'As underdog',role]);
    const body=rows.filter(([,k])=>S[k]).map(([l,k])=>`<tr><td class="lab">${l}</td>${cell(S[k].su)}${cell(S[k].ats)}<td>${S[k].ou?S[k].ou[0]+'-'+S[k].ou[1]+(S[k].ou[2]?'-'+S[k].ou[2]:''):'–'}</td></tr>`).join('');
    const pf=s.pf!=null?` · ${num(s.pf)} for / ${num(s.pa)} against`:'';
    return `<div class="ov-team">${e(t.abbr||t.name)}<span>${side} · ${s.w}-${s.l}${streak(s.streak)?' · '+streak(s.streak):''}${pf}</span></div>
      <table class="ov-t"><tr><th></th><th>SU</th><th>ATS</th><th>O-U</th></tr>${body}</table>`;
  };
  // 2. last 5 games
  const res=(v,txt)=>`<span class="${v==='W'||v==='O'?'ov-w':v==='L'||v==='U'?'ov-l':'ov-p'}">${txt}</span>`;
  const lastTable=(t,rows)=>{
    if(!(rows||[]).length) return '';
    const d=s=>{ const p=String(s).split('-'); return p.length===3?(+p[1])+'/'+(+p[2]):s; };
    return `<div class="ov-team">${e(t)}</div><div class="ov-scroll"><table class="ov-t"><tr><th>Date</th><th>Opp</th><th>Result</th><th>ATS</th><th>O-U</th></tr>${rows.map(r=>
      `<tr><td class="lab">${d(r.date)}</td><td>${r.ha} ${e(r.opp)}</td><td>${res(r.res,r.res+' '+e(r.score))}</td>`+
      `<td>${r.spread==null?'–':res(r.ats,(r.spread>0?'+':'')+r.spread+' '+(r.ats||''))}</td>`+
      `<td>${r.total==null?'–':res(r.ou,(r.ou||'')+' '+r.total)}</td></tr>`).join('')}</table></div>`;
  };
  // 3. stat matchup
  const fam=OV_FAM(String(sp).toLowerCase()), defs=OV_STATS[fam];
  const sa=A.stats||{}, sh=Hm.stats||{}, ra=A.ranks||{}, rh=Hm.ranks||{};
  const ord=n=>n+(['th','st','nd','rd'][((n%100)-20)%10]||['th','st','nd','rd'][n%100]||'th');
  const statRows=defs.filter(([k])=>sa[k]!=null||sh[k]!=null).map(([k,l,low,f])=>{
    const a=sa[k], b=sh[k]; const better=a==null||b==null||a===b?null:((a<b)===!!low?'a':'b');
    const rk=r=>r?`<span class="ov-rk">${ord(r[0])}</span>`:'';
    return `<tr><td class="${better==='a'?'ov-best':''}">${num(a,f)}${rk(ra[k])}</td><td class="lab">${l}</td><td class="${better==='b'?'ov-best':''}">${num(b,f)}${rk(rh[k])}</td></tr>`;
  }).join('');
  const pool=ov.rank_pool;
  let h=`<div class="${secClass||'ui-sec'} ov-wrap"><h4>Form &amp; matchup</h4>`;
  const sit=sitTable(A,'away')+sitTable(Hm,'home');
  if(sit) h+=`<h5>Records (straight up, against the spread, over-under)</h5>${sit}`;
  if((ov.h2h||[]).length) h+=`<h5>Head to head (recent)</h5>${lastTable('Results from '+(ov.h2h[0].team||'')+"'s side",ov.h2h)}`;
  const l5=lastTable((A.abbr||'Away')+' last 5',A.last)+lastTable((Hm.abbr||'Home')+' last 5',Hm.last);
  if(l5) h+=`<h5>Recent games, closing line</h5>${l5}`;
  if(statRows) h+=`<h5>Season stats</h5><table class="ov-t"><tr><th>${e(A.abbr||'Away')}</th><th></th><th>${e(Hm.abbr||'Home')}</th></tr>${statRows}</table>
    <div class="ov-note">${fam==='foot'?'Per game. ':''}Green = better side. ${pool?`Rank = among the ${pool} teams our Action Network runs have seen this season (grows as more games are scraped).`:''} Action's site has no defensive breakdown beyond points allowed.</div>`;
  return h+`</div>`;
}

function card(g){

  const body = oddsTable(g)+bars(g)+ovBlock(g,'sec')+pro(g)+picks(g)+notesBlock(g,'sec')+fstTips(g.fst)+extra(g)

    <div class="gbody">${body||'<span class="meta">No odds or PRO data for this event.</span>'}</div></div>`;

function matches(g){
  if(!q) return true;
  const hay=[g.title,g.name,g.home,g.away,...(g.teams||[]),...(g.picks||[]).map(p=>p.Analyst+' '+p.Pick),...((g.fst||g).tips||[]).map(t=>t.pick+' freesupertips')].join(' ').toLowerCase();
  return hay.includes(q);
}
function render(){
  const cnt=s=>s.games.length+(s.fst_unmatched||[]).length;
  const chips=[['all','All',SPORTS.reduce((n,[,s])=>n+cnt(s),0)],...SPORTS.map(([k,s])=>[k,s.label,cnt(s)])];
  $('#chips').innerHTML=chips.map(([k,l,n])=>`<span class="chip${sport===k?' on':''}" data-s="${k}">${esc(l)}<span class="n">${n}</span></span>`).join('');
  const parts=[];
  SPORTS.forEach(([k,s])=>{
    if(sport!=='all'&&sport!==k) return;
    const gs=s.games.filter(matches), fu=(s.fst_unmatched||[]).filter(matches); if(!gs.length&&!fu.length&&q) return;
    const pages=Object.entries(s.pages||{}).filter(([,v])=>v&&v.length>200);
    parts.push(`<div class="sport"><div class="sporthead"><h2>${esc(s.label)}</h2><span class="meta">${gs.length} event${gs.length===1?'':'s'}</span></div>
      ${gs.map(card).join('')||(fu.length?'':`<div class="empty">${esc(s.note||'No events today.')}</div>`)}
      ${fu.length?`<div class="sporthead" style="margin-top:14px"><h2 style="font-size:13px">freesupertips · not on Action's board</h2><span class="meta">${fu.length}</span></div>${fu.map(fstCard).join('')}`:''}
      ${sport===k?arts(s.articles,s.label+' articles'):''}
      ${sport===k&&pages.length?`<details><summary>${esc(s.label)} PRO pages (full text)</summary>${pages.map(([p,v])=>`<details><summary>${esc(p)}</summary><pre>${esc(v)}</pre></details>`).join('')}</details>`:''}</div>`);
  });
  $('#list').innerHTML=parts.join('')||(sport!=='all'&&!(D.sports||{})[sport]?`<div class="empty">No ${esc(sport)} on today's board (Action Network or freesupertips).</div>`:'<div class="empty">Nothing scraped yet. Run Action Daily (menu D) on the PC.</div>');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){ sport=c.dataset.s; render(); try{localStorage.setItem('ad_sport',sport)}catch(_){} return; }
  if(e.target.closest('a,details,summary')) return;
  const h=e.target.closest('.ghead'); if(h){ const card=h.parentElement, id=card.dataset.id; open.has(id)?open.delete(id):open.add(id); card.classList.toggle('open'); }
});
$('#q').addEventListener('input',e=>{ q=e.target.value.trim().toLowerCase(); render(); });
try{ const s=localStorage.getItem('ad_sport'); if(s&&(s==='all'||(D.sports||{})[s])) sport=s; }catch(_){}
const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)).toLowerCase(); if(h) sport=h; };
fromHash(); window.addEventListener('hashchange',()=>{ fromHash(); render(); });
$('#meta').textContent = D.date ? `${new Date(D.date+'T12:00').toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})} · updated ${new Date(D.scraped_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${D.attached===false?' · logged out':''}` : '';
render();
</script>
</body>
</html>
