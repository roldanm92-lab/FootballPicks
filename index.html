<style>
:root{--bg:#0F1B14;--bg2:#16261C;--bg3:#1D3325;--paper:#EFE7D5;--paper2:#E4DAC2;--paper3:#D8CDB5;--ink:#1B1B16;--ink2:#4A473C;--chalk:#F4F1E6;--chalk2:#C9C4B3;--accent:#D9A441;--accent2:#B5822E;--crim:#8C2F39;--green:#2A7D4B;--ld:rgba(244,241,230,.14);--lp:rgba(27,27,22,.16);--sel:#2A5E3A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--chalk);font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.disp{font-family:'Big Shoulders Display',sans-serif}
header{padding:20px 16px 12px;text-align:center;border-bottom:1px solid var(--ld);position:sticky;top:0;background:var(--bg);z-index:50}
.title{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(28px,6vw,40px);margin:0;letter-spacing:.5px}
.subtitle{color:var(--chalk2);font-size:13px;font-style:italic;margin:2px 0 12px}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.tab-btn{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:18px;padding:8px 24px;border-radius:6px;border:1px solid var(--ld);background:var(--bg2);color:var(--chalk2);cursor:pointer;letter-spacing:1px}
.tab-btn.active{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.maintabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.maintabs button{font-size:13px;padding:6px 14px;border-radius:14px;border:1px solid var(--ld);background:transparent;color:var(--chalk2);cursor:pointer}
.maintabs button.active{background:var(--accent2);color:var(--chalk);border-color:var(--accent2)}
main{max-width:900px;margin:0 auto;padding:12px 10px 80px}
.panel{display:none}
.panel.active{display:block}

/* Filters */
.filters{background:var(--bg2);border:1px solid var(--ld);border-radius:10px;padding:12px;margin-bottom:14px}
.filters input[type=text]{width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--ld);background:var(--bg3);color:var(--chalk);font-family:inherit;font-size:14px;margin-bottom:8px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:13px}
.filter-row label{color:var(--chalk2)}
.filter-row input[type=date],.filter-row input[type=time]{background:var(--bg3);border:1px solid var(--ld);color:var(--chalk);border-radius:4px;padding:4px 6px;font-family:inherit}
.chipgroup{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--ld);background:var(--bg3);color:var(--chalk2);cursor:pointer;user-select:none}
.chip.on{background:var(--sel);color:var(--chalk);border-color:var(--sel)}
.filters details summary{cursor:pointer;color:var(--accent);font-size:13px;margin:4px 0}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sortrow select{background:var(--bg3);color:var(--chalk);border:1px solid var(--ld);border-radius:6px;padding:6px 8px;font-family:inherit}

/* Day headers */
.day-header{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:16px;color:var(--accent);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--ld);letter-spacing:1px}

/* Game card */
.game{background:var(--paper);color:var(--ink);border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.game-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--paper2);cursor:pointer}
.game-teams{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:17px}
.game-meta{font-size:11.5px;color:var(--ink2)}
.star-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--accent2);padding:2px 6px}
.game-body{padding:0 12px 10px;display:none}
.game-body.open{display:block}
.pro-strip{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink2);padding:8px 0;border-bottom:1px dashed var(--lp);margin-bottom:8px}
.pro-strip b{color:var(--ink)}
.pick-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--lp);font-size:13.5px}
.pick-row:last-child{border-bottom:none}
.pick-text{font-weight:600}
.pick-who{font-size:11.5px;color:var(--ink2);cursor:pointer}
.pick-who .takers-list{display:none;margin-top:4px;font-size:11px}
.pick-who.expanded .takers-list{display:block}
.pick-star{cursor:pointer;color:var(--accent2);font-size:15px;margin-left:6px}
.badge{display:inline-block;background:var(--accent);color:var(--ink);font-size:10px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:4px}
.empty-note{text-align:center;color:var(--chalk2);font-size:13px;padding:30px 0}

/* Data tab */
.data-box{background:var(--bg2);border:1px solid var(--ld);border-radius:10px;padding:16px;margin-bottom:14px}
.data-box h3{font-family:'Big Shoulders Display',sans-serif;margin:0 0 8px;font-size:18px}
.data-box input[type=file]{color:var(--chalk2);font-size:13px}
.data-box button{background:var(--accent);color:var(--ink);border:none;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;margin-top:6px}
.status-line{font-size:12px;color:var(--chalk2);margin-top:6px}
.expert-note{font-size:12px;color:var(--chalk2);margin-top:10px;line-height:1.5}
</style>
</head>

 in the nation through three games. On paper, Oklahoma State has a good run defense, but context matters. Last week, they played a lowly FCS program that is 7-43 in its last 50 games. The week before that, Oregon dug themselves a massive hole and all but abandoned the run by the second quarter. So while OSU\u2019s defensive coordinator Skyler Cassity has proven to be an upgrade, I\u2019m not convinced they\u2019ll have many answers for this spread option attack. As with any over bet, tempo is critical. Both the \u2018Neers and Pokes operate uptempo offenses, snapping the ball every 24 seconds. This places both programs inside the top 20 in terms of pace among Power Four programs. After a slow start against Tulsa, the Pokes\u2019 offense has exploded in the past eight quarters. They ran up 554 yards and 39 points on Oregon, and that included a red zone interception that cost them even more points. Drew Mestemaker threw for 300 yards and ran for 100 yards against the Ducks, making him the first quarterback to do that to UO since 2016 (Steven Montez). Three Cowboys have reached 100 rushing yards already this season, including Mestemaker, to go along with five receivers who have eclipsed 100 yards receiving. While WVU is relying on its stars to win this game, Oklahoma State has created a pick-your-poison dilemma for opposing defensive coordinators. Which brings us to the final pillar of this play: West Virginia\u2019s defense. Last season, the Mountaineers were a sieve defensively, especially against the pass (129th). And while there have been improvements, West Virginia\u2019s secondary is still a work-in-progress. Despite facing an FCS opponent in Week 2, the Mountaineers check in at 114th in pass defense, 76th in coverage (per PFF), and 95th in pass explosives of 30+ yards allowed. Oklahoma State will find success through the air and push this game into the 70s before all is said and done.","Posted":"3d ago","GameSlug":"oklahoma-state-west-virginia","SourceUrl":"https://www.actionnetwork.com/ncaaf-game/oklahoma-state-west-virginia-score-odds-september-26-2026/289220#picks"},{"Analyst":"Mike Calabrese","Record":"Last 30d: 33-38-0 (+2.1u)","Pick":"TLSA +235","Units":"0.43u","Note":"Baylor Hayes is likely out again so I get the experience Dexter Williams II. He got a de facto preseason start in against E Texas A&M and was efficient. Led them to 42 points, didn\u2019t have a turnover-worthy play, and threw for 3 TDs. Tulsa\u2019s defense has made everyone work this year. OK State had only 4.9 yards per attempt and 3.4 yards per carry. Sam Houston hit one home run pass, a 94-yarder; outside of that, the Golden Hurricane only allowed 222 other yards. And they clamped down in the red zone late to win the game. Now here comes the exhausted husk of a team\u2026Arkansas. Fans have quit, there will be no SEC atmosphere. A win here, and they have two P4 wins and a real shot at the playoff, so everything to play for from a Tulsa perspective. The Hogs may play two quarterbacks: Hill and Jackson. Their defense looks powerless to stop the run. They\u2019ve surrendered 10 rushing scores already this season, nearly dead last in the sport. Tulsa grades out 11th in rushing per PFF; they have a stable of backs, and Williams brings a rushing threat at QB as well.","Posted":"1d ago","GameSlug":"tulsa-arkansas","SourceUrl":"https://www.actionnetwork.com/ncaaf-game/tulsa-arkansas-score-odds-september-26-2026/289211#picks"},{"Analyst":"BBOC: 6th Gear","Record":"Last 30d: 17-24-0 (-6.3u)","Pick":"TLSA +220","Units":"0.45u","Note":"@Breese https://podcasts.apple.com/us/podcast/bboc-6th-gear-cfb-week-4/id1579379256?i=1000791231037","Posted":"1d ago","GameSlug":"tulsa-arkansas","SourceUrl":"https://www.actionnetwork.com/ncaaf-game/tulsa-arkansas-score-odds-september-26-2026/289211#picks"},{"Analyst":"Doug Ziefel","Record":"Last 30d: 285-332-13 (-0.9u)","Pick":"TLSA +7-118","Units":"0.59u","Note":null,"Posted":"3d ago","GameSlug":"tulsa-arkansas","SourceUrl"  -8.5-110","Units":"1u","Note":null,"Posted":"3d ago","GameSlug":"chiefs-dolphins","SourceUrl":"https://www.actionnetwork.com/nfl-game/chiefs-dolphins-score-odds-september-27-2026/290876#picks"},{"Analyst":"Action Pod NFL Picks","Record":"Last 30d: 36-38-0 (+14.3u)","Pick":"SF -8.5-108","Units":"1u","Note":"@Stuckey2 https://podcasts.apple.com/us/podcast/nfl-week-3-betting-preview/id1004530793?i=1000791367319","Posted":"2h ago","GameSlug":"cardinals-49ers","SourceUrl":"https://www.actionnetwork.com/nfl-game/cardinals-49ers-score-odds-september-27-2026/290884#picks"},{"Analyst":"OldSchool0909","Record":"Last 30d: 93-118-1 (-26.1u)","Pick":"ARI +8.5-110","Units":"1u","Note":null,"Posted":"3d ago","GameSlug":"cardinals-49ers","SourceUrl":"https://www.actionnetwork.com/nfl-game/cardinals-49ers-score-odds-september-27-2026/290884#picks"}],"games_succeeded":16,"games_failed":0}},"alias":{"ATL":"Falcons","GB":"Packers","PHI":"Eagles","CHI":"Bears","NE":"Patriots","JAC":"Jaguars","MIN":"Vikings","TB":"Buccaneers","BAL":"Ravens","DAL":"Cowboys","CIN":"Bengals","PIT":"Steelers","NYJ":"Jets","DET":"Lions","LAC":"Chargers","BUF":"Bills","CAR":"Panthers","CLE":"Browns","LV":"Raiders","NO":"Saints","SEA":"Seahawks","WAS":"Commanders","HOU":"Texans","IND":"Colts","LA":"Rams","DEN":"Broncos","TEN":"Titans","NYG":"Giants","KC":"Chiefs","MIA":"Dolphins","ARI":"Cardinals","SF":"49ers"},"conf":{"AFC East":["Bills","Dolphins","Patriots","Jets"],"AFC North":["Ravens","Bengals","Browns","Steelers"],"AFC South":["Texans","Colts","Jaguars","Titans"],"AFC West":["Broncos","Chiefs","Raiders","Chargers"],"NFC East":["Cowboys","Giants","Eagles","Commanders"],"NFC North":["Bears","Lions","Packers","Vikings"],"NFC South":["Falcons","Panthers","Saints","Buccaneers"],"NFC West":["Cardinals","Rams","49ers","Seahawks"]},"fbsExtra":[]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('picks-data').textContent);

// ---------- Helpers ----------
function teamFull(sport,x){
  if(!x) return x;
  const u = x.trim().toUpperCase();
  const al = DATA[sport].alias;
  return al[u] || x.trim();
}
function rkey(sport,x){
  return teamFull(sport,x).toUpperCase()
    .replace(/\bSTATE\b/g,'ST')
    .replace(/[.\-\u2019']/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function dk(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

// action_by_game / props game_schedule GameTime is time-only: "7:30 PM"
function parseTimeOnly(gt){
  if(!gt) return null;
  const m = gt.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(!m) return null;
  let h=+m[1], mn=+m[2]; const ap=m[3].toUpperCase();
  if(ap==='PM'&&h!==12) h+=12; if(ap==='AM'&&h===12) h=0;
  const now = new Date();
  return {h, mn};
}
// sharp/projections/public GameTime carries the full date: "Sat 9/26, 5:00 PM" or bare "8:15 PM" for same-day games
function parseFullGameTime(gt, fallbackYear){
  if(!gt) return null;
  let m = gt.match(/(\d{1,2})\/(\d{1,2}),?\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(m){
    let h=+m[3], mn=+m[4]; const ap=m[5].toUpperCase();
    if(ap==='PM'&&h!==12) h+=12; if(ap==='AM'&&h===12) h=0;
    return new Date(fallbackYear, (+m[1])-1, +m[2], h, mn);
  }
  // bare time only, e.g. "7:30 PM" (same-day game, no date prefix) -- cannot get a date from this alone
  return null;
}
// props game_schedule GameTime: "Thursday 9/24 7:30pm" or "Saturday 9/26 12:00pm"
function parseScheduleTime(gt, fallbackYear){
  if(!gt) return null;
  let m = gt.match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})\s*(am|pm)/i);
  if(!m) return null;
  let h=+m[3], mn=+m[4]; const ap=m[5].toUpperCase();
  if(ap==='PM'&&h!==12) h+=12; if(ap==='AM'&&h===12) h=0;
  return new Date(fallbackYear, (+m[1])-1, +m[2], h, mn);
}

function fmtKickoff(g){
  if(!g.timeIsReal) return 'TBD';
  const d = g.date;
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let h = d.getHours(); const ap = h>=12?'PM':'AM'; let h12=h%12; if(h12===0) h12=12;
  const mn = String(d.getMinutes()).padStart(2,'0');
  return `${days[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}, ${h12}:${mn} ${ap}`;
}

// action_deep slug matching per bugfix: each team must independently contribute
// a matching word (>2 chars), using both alias-expanded full name and raw name
function slugWords(name){
  return name.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
}
function teamMatchesSlug(sport, teamRaw, slug){
  let cand = new Set(slugWords(teamRaw));
  const full = teamFull(sport, teamRaw);
  slugWords(full).forEach(w=>cand.add(w));
  // small scoped synonym, cfb only
  if(sport==='cfb'){
    const low = teamRaw.toLowerCase();
    if(low.includes('k state')||low.includes('kansas state')||low.includes('k st')) cand.add('kansas');
  }
  for(const w of cand){ if(slug.includes(w)) return true; }
  return false;
}

function isInGroupMap(sport, teamName){
  const conf = DATA[sport].conf;
  const extra = DATA[sport].fbsExtra||[];
  const full = teamFull(sport, teamName);
  for(const grp in conf){ if(conf[grp].some(t=>t.toLowerCase()===full.toLowerCase())) return true; }
  if(extra.some(t=>t.toLowerCase()===full.toLowerCase())) return true;
  return false;
}
function groupOf(sport, teamName){
  const conf = DATA[sport].conf;
  const full = teamFull(sport, teamName);
  for(const grp in conf){ if(conf[grp].some(t=>t.toLowerCase()===full.toLowerCase())) return grp; }
  return null;
}

// ---------- build(sport) ----------
const FALLBACK_YEAR = 2026;
const FALLBACK_DATE = new Date(2026,8,1); // hardcoded early fallback, no time -> displays TBD instead of trusting it

function build(sport){
  const raw = DATA[sport].raw;
  const games = new Map(); // id -> game
  let nextId = 1;

  function newGame(t1,t2,t1a,t2a){
    const id = nextId++;
    const g = {
      id, t1, t2: t2, t1abbr:t1a, t2abbr:t2a,
      date: null, dateKey: null, timeIsReal:false, network:null,
      pro:{}, picks: [], // picks: {text, analyst, source, units, record, note}
    };
    g.t1 = t1; g.t2 = t2;
    games.set(id, g);
    return g;
  }
  function findGame(teamA, teamB){
    const k = [rkey(sport,teamA),rkey(sport,teamB)].sort().join('|');
    for(const g of games.values()){
      if([rkey(sport,g.t1),rkey(sport,g.t2)].sort().join('|')===k) return g;
    }
    return null;
  }

  // Step 1: seed from action_by_game (authoritative schedule)
  const abg = raw.action_by_game && raw.action_by_game.status==='ok' ? raw.action_by_game.rows : [];
  abg.forEach(r=>{
    const g = newGame(r.Team1, r.Team2, r.Team1Abbrev, r.Team2Abbrev);
    g.network = r.Network;
    g.totalPicks = r.TotalPicks||0;
    // GameTime here is time-only -- cannot set a real date from this alone (bugfix: don't silently take midnight)
  });

  // Step 2: merge action_deep by GameSlug fuzzy match; unmatched -> standalone game
  const deep = raw.action_deep && raw.action_deep.status==='ok' ? raw.action_deep.rows : [];
  deep.forEach(r=>{
    const slug = (r.GameSlug||'').toLowerCase();
    let matched = null;
    for(const g of games.values()){
      if(teamMatchesSlug(sport, g.t1, slug) && teamMatchesSlug(sport, g.t2, slug)){ matched = g; break; }
    }
    if(!matched){
      // try to derive two team names from slug halves as a last resort standalone game
      const parts = slug.split('-');
      if(parts.length>=2){
        matched = newGame(parts.slice(0,Math.ceil(parts.length/2)).join(' '), parts.slice(Math.ceil(parts.length/2)).join(' '));
      } else return;
    }
    matched.picks.push({
      text: r.Pick, analyst: r.Analyst, source:'AN', units: r.Units, record: r.Record, note: r.Note, posted: r.Posted
    });
  });

  // Step 3: merge named-pick sources by exact team-key match
  // (a) CFB-only structured sections: ats, ml, straight_up
  const knownTeams = new Set();
  abg.forEach(r=>{ if(r.Team1) knownTeams.add(r.Team1); if(r.Team2) knownTeams.add(r.Team2); });
  const knownTeamsSorted = [...knownTeams].sort((a,b)=>b.length-a.length);

  function findTeamInText(text){
    const low = text.toLowerCase();
    for(const t of knownTeamsSorted){ if(low.includes(t.toLowerCase())) return t; }
    return null;
  }

  ['ats','ml'].forEach(secName=>{
    const sec = raw[secName];
    if(!sec || sec.status!=='ok') return;
    sec.rows.forEach(r=>{
      const t = findTeamInText(r.PICK||'');
      if(!t) return;
      // find opponent from same-day matchup context isn't reliable; attach to any game containing this team
      let g = null;
      for(const gg of games.values()){
        if(rkey(sport,gg.t1)===rkey(sport,t) || rkey(sport,gg.t2)===rkey(sport,t)){ g=gg; break; }
      }
      if(!g) return; // no ghost creation for these two sections; team must resolve to a real seeded game
      g.picks.push({ text: r.PICK, analyst: r.ANALYST, source:'GDC', units:null, record:null, note:null });
    });
  });
  if(raw.straight_up && raw.straight_up.status==='ok'){
    raw.straight_up.rows.forEach(r=>{
      let g = findGame(r.HOME, r.VISITOR);
      if(!g){
        // create only if at least one team resolves in this sport's group map (ghost-game guard)
        if(isInGroupMap(sport, r.HOME) || isInGroupMap(sport, r.VISITOR)){
          g = newGame(r.VISITOR, r.HOME);
        } else return;
      }
      g.picks.push({ text: r.PICK, analyst: r.ANALYST, source:'GDC', units:null, record:null, note:null });
    });
  }
  // (b) action recent-activity feed (also carries TD-scorer merged rows for NFL, tagged Source:'TD')
  if(raw.action && raw.action.status==='ok'){
    raw.action.rows.forEach(r=>{
      const parts = (r.Matchup||'').split('@').map(s=>s.trim());
      let g = null;
      if(parts.length===2) g = findGame(parts[0], parts[1]);
      if(!g && parts.length===2){
        if(isInGroupMap(sport, parts[0]) || isInGroupMap(sport, parts[1])) g = newGame(parts[0], parts[1]);
      }
      if(!g) return;
      g.picks.push({
        text: r.Pick, analyst: r.Analyst, source: r.Source==='TD' ? 'TD' : 'AN',
        units: r.Wager, record: r.AnalystRecord, note: r.Note||null
      });
    });
  }
  // (c) picker_* sources (CFB only, ghost-game guard per bugfix addendum)
  ['picker_stanford_steve','picker_josh_pate','picker_bear_fallica'].forEach(secName=>{
    const sec = raw[secName];
    if(!sec || sec.status!=='ok' || !sec.rows) return;
    sec.rows.forEach(r=>{
      const t = findTeamInText(r.PICK||'');
      if(!t) return;
      let g = null;
      for(const gg of games.values()){
        if(rkey(sport,gg.t1)===rkey(sport,t) || rkey(sport,gg.t2)===rkey(sport,t)){ g=gg; break; }
      }
      if(!g){
        // only create a new game if the parsed team resolves within this sport's group map
        if(isInGroupMap(sport, t)){ g = newGame(t, '(TBD opponent)'); } else return;
      }
      g.picks.push({ text: r.PICK, analyst: r.ANALYST, source:'GDC', units:null, record:null, note:null });
    });
  });

  // Step 4: attach PRO data (projections -> public -> sharp priority for overlaps)
  // and backfill g.date from the first of these that matches, since action_by_game's
  // GameTime is time-only and can't supply a date on its own (bugfix).
  function attachPro(secName, mapFn){
    const sec = raw[secName];
    if(!sec || sec.status!=='ok') return;
    sec.rows.forEach(r=>{
      const g = findGame(r.Team1, r.Team2);
      if(!g) return;
      if(!g.date){
        const dt = parseFullGameTime(r.GameTime, FALLBACK_YEAR);
        if(dt){ g.date = dt; g.dateKey = dk(dt); g.timeIsReal = true; }
      }
      mapFn(g.pro, r, g);
    });
  }
  attachPro('sharp', (pro,r)=>{
    pro.sharpAction1=r.SharpAction1; pro.bigMoney1=r.BigMoney1; pro.proSystems1=r.PROSystems1; pro.topExperts1=r.TopExperts1; pro.modelProj1=r.ModelProj1;
    pro.sharpAction2=r.SharpAction2; pro.bigMoney2=r.BigMoney2; pro.proSystems2=r.PROSystems2; pro.topExperts2=r.TopExperts2; pro.modelProj2=r.ModelProj2;
    pro.betPct1=pro.betPct1||r.BetPct1; pro.betPct2=pro.betPct2||r.BetPct2;
    pro.moneyPct1=pro.moneyPct1||r.MoneyPct1; pro.moneyPct2=pro.moneyPct2||r.MoneyPct2;
    pro.bestLine1=pro.bestLine1||r.BestLine1; pro.bestJuice1=pro.bestJuice1||r.BestJuice1;
    pro.bestLine2=pro.bestLine2||r.BestLine2; pro.bestJuice2=pro.bestJuice2||r.BestJuice2;
  });
  attachPro('public', (pro,r)=>{
    pro.betPct1=r.BetPct1; pro.betPct2=r.BetPct2; pro.moneyPct1=r.MoneyPct1; pro.moneyPct2=r.MoneyPct2; pro.diff=r.Diff; pro.totalBets=r.TotalBets;
    pro.bestLine1=pro.bestLine1||r.BestLine1; pro.bestJuice1=pro.bestJuice1||r.BestJuice1;
    pro.bestLine2=pro.bestLine2||r.BestLine2; pro.bestJuice2=pro.bestJuice2||r.BestJuice2;
  });
  attachPro('projections', (pro,r)=>{
    pro.grade1=r.Grade1; pro.grade2=r.Grade2; pro.edge1=r.Edge1; pro.edge2=r.Edge2;
    pro.consensus1=r.Consensus1; pro.consensus2=r.Consensus2; pro.proLine1=r.ProLine1; pro.proLine2=r.ProLine2;
    pro.betPct1=r.BetPct1; pro.betPct2=r.BetPct2; pro.moneyPct1=r.MoneyPct1; pro.moneyPct2=r.MoneyPct2;
    pro.bestLine1=r.BestLine1; pro.bestJuice1=r.BestJuice1; pro.bestLine2=r.BestLine2; pro.bestJuice2=r.BestJuice2;
  });
  attachPro('odds', (pro,r)=>{
    pro.oddsLine1=r.BestLine1; pro.oddsJuice1=r.BestJuice1; pro.oddsLine2=r.BestLine2; pro.oddsJuice2=r.BestJuice2;
  });

  // Step 5: attach props (prop projections by matchup) + fill remaining missing kickoff from game_schedule
  if(raw.props && raw.props.status==='ok'){
    const propRows = raw.props.rows;
    propRows.filter(r=>r.SubType==='prop_projection').forEach(r=>{
      const parts=(r.Matchup||'').split('@').map(s=>s.trim());
      if(parts.length!==2) return;
      const g = findGame(parts[0],parts[1]);
      if(!g) return;
      g.props = g.props||[];
      g.props.push(r);
    });
    propRows.filter(r=>r.SubType==='game_schedule').forEach(r=>{
      const g = findGame(r.Team1,r.Team2);
      if(!g || g.date) return;
      const dt = parseScheduleTime(r.GameTime, FALLBACK_YEAR);
      if(dt){ g.date=dt; g.dateKey=dk(dt); g.timeIsReal=true; }
    });
  }

  // Step 6: any game still without a real date gets the hardcoded fallback (dateless/TBD, excluded by day filters)
  games.forEach(g=>{
    if(!g.date){ g.date = FALLBACK_DATE; g.dateKey = dk(g.date); g.timeIsReal = false; }
  });

  // ---- Build "takers" (dedup identical pick text within a game) ----
  games.forEach(g=>{
    const groups = new Map();
    g.picks.forEach(p=>{
      const key = (p.text||'').trim().toUpperCase();
      if(!groups.has(key)) groups.set(key, { text:p.text, takers:[] });
      groups.get(key).takers.push(p);
    });
    g.pickGroups = [...groups.values()].sort((a,b)=>b.takers.length-a.takers.length);
  });

  return [...games.values()];
}

// ---------- App state ----------
const S = {
  cfb: { sport:'cfb', myPlays: new Set(JSON.parse(localStorage.getItem('cfb_myplays')||'[]')), sort:'time',
         search:'', dayFrom:'', dayTo:'', timeFrom:'', timeTo:'', excludedGroups:new Set(), fbsOnly:false, excludedExperts:new Set(), openGames:new Set() },
  nfl: { sport:'nfl', myPlays: new Set(JSON.parse(localStorage.getItem('nfl_myplays')||'[]')), sort:'time',
         search:'', dayFrom:'', dayTo:'', timeFrom:'', timeTo:'', excludedGroups:new Set(), fbsOnly:false, excludedExperts:new Set(), openGames:new Set() },
};
let ALLGAMES = { cfb: build('cfb'), nfl: build('nfl') };
let currentSport = 'cfb';
let currentView = 'board';

function playKey(sport,g,pickText){
  return [sport, rkey(sport,g.t1), rkey(sport,g.t2), (pickText||'').trim().toUpperCase()].join('|');
}
function saveMyPlays(sport){
  localStorage.setItem(sport+'_myplays', JSON.stringify([...S[sport].myPlays]));
}

function expertList(sport){
  const set = new Set();
  ALLGAMES[sport].forEach(g=>g.picks.forEach(p=>{ if(p.analyst) set.add(p.analyst); }));
  return [...set].sort();
}
</script>
<script>
function passesFilters(sport, g){
  const s = S[sport];
  if(s.search){
    const q = s.search.toLowerCase();
    const hay = [g.t1,g.t2, ...g.pickGroups.flatMap(pg=>[pg.text, ...pg.takers.map(t=>t.analyst)])].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(g.timeIsReal){
    if(s.dayFrom && dk(g.date) < s.dayFromKey) return false;
    if(s.dayTo && dk(g.date) > s.dayToKey) return false;
    if(s.timeFrom || s.timeTo){
      const mins = g.date.getHours()*60+g.date.getMinutes();
      if(s.timeFrom){ const [fh,fm]=s.timeFrom.split(':').map(Number); if(mins < fh*60+fm) return false; }
      if(s.timeTo){ const [th,tm]=s.timeTo.split(':').map(Number); if(mins > th*60+tm) return false; }
    }
  } else if(s.dayFrom || s.dayTo){
    return false; // dateless/TBD games excluded when a day filter is active
  }
  // conference/division: hide only if BOTH teams are in excluded groups
  if(s.excludedGroups.size){
    const g1 = groupOf(sport,g.t1), g2 = groupOf(sport,g.t2);
    const t1excluded = g1 && s.excludedGroups.has(g1);
    const t2excluded = g2 && s.excludedGroups.has(g2);
    if(t1excluded && t2excluded) return false;
  }
  if(sport==='cfb' && s.fbsOnly){
    if(!isInGroupMap('cfb',g.t1) && !isInGroupMap('cfb',g.t2)) return false;
  }
  return true;
}

function visiblePickGroups(sport, g){
  const s = S[sport];
  if(!s.excludedExperts.size) return g.pickGroups;
  return g.pickGroups.map(pg=>({
    text: pg.text,
    takers: pg.takers.filter(t=>!s.excludedExperts.has(t.analyst))
  })).filter(pg=>pg.takers.length>0);
}

function render(){
  const sport = currentSport;
  const s = S[sport];
  s.dayFromKey = s.dayFrom || null;
  s.dayToKey = s.dayTo || null;
  const main = document.getElementById('main');
  main.innerHTML = '';

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.sport===sport));
  document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('active', b.dataset.view===currentView));

  if(currentView==='data'){ renderDataTab(main, sport); return; }
  if(currentView==='myplays'){ renderMyPlays(main, sport); return; }

  // ---- Board view ----
  const filterBox = document.createElement('div');
  filterBox.className = 'filters';
  filterBox.innerHTML = `
    <input type="text" placeholder="Search team, pick, or analyst..." id="f-search" value="${s.search.replace(/"/g,'&quot;')}">
    <div class="filter-row">
      <label>Days:</label><input type="date" id="f-dayfrom" value="${s.dayFrom}"> to <input type="date" id="f-dayto" value="${s.dayTo}">
      <label style="margin-left:10px">Time:</label><input type="time" id="f-timefrom" value="${s.timeFrom}"> to <input type="time" id="f-timeto" value="${s.timeTo}">
    </div>
    <details>
      <summary>${sport==='cfb'?'Conferences':'Divisions'} &amp; Experts</summary>
      <div class="chipgroup" id="f-groups"></div>
      ${sport==='cfb'?'<label style="display:block;margin-top:8px;font-size:13px"><input type="checkbox" id="f-fbs" '+(s.fbsOnly?'checked':'')+'> FBS only</label>':''}
      <div class="chipgroup" id="f-experts" style="margin-top:8px"></div>
    </details>`;
  main.appendChild(filterBox);
  const groupsEl = filterBox.querySelector('#f-groups');
  Object.keys(DATA[sport].conf).forEach(grp=>{
    const chip = document.createElement('span');
    chip.className = 'chip'+(s.excludedGroups.has(grp)?'':' on');
    chip.textContent = grp;
    chip.onclick = ()=>{ if(s.excludedGroups.has(grp)) s.excludedGroups.delete(grp); else s.excludedGroups.add(grp); render(); };
    groupsEl.appendChild(chip);
  });
  const expertsEl = filterBox.querySelector('#f-experts');
  expertList(sport).forEach(name=>{
    const chip = document.createElement('span');
    chip.className = 'chip'+(s.excludedExperts.has(name)?'':' on');
    chip.textContent = name;
    chip.onclick = ()=>{ if(s.excludedExperts.has(name)) s.excludedExperts.delete(name); else s.excludedExperts.add(name); render(); };
    expertsEl.appendChild(chip);
  });
  filterBox.querySelector('#f-search').oninput = e=>{ s.search=e.target.value; render(); };
  filterBox.querySelector('#f-dayfrom').onchange = e=>{ s.dayFrom=e.target.value; render(); };
  filterBox.querySelector('#f-dayto').onchange = e=>{ s.dayTo=e.target.value; render(); };
  filterBox.querySelector('#f-timefrom').onchange = e=>{ s.timeFrom=e.target.value; render(); };
  filterBox.querySelector('#f-timeto').onchange = e=>{ s.timeTo=e.target.value; render(); };
  const fbsEl = filterBox.querySelector('#f-fbs');
  if(fbsEl) fbsEl.onchange = e=>{ s.fbsOnly=e.target.checked; render(); };

  const sortRow = document.createElement('div');
  sortRow.className = 'sortrow';
  sortRow.innerHTML = `<span style="font-size:12px;color:var(--chalk2)">${ALLGAMES[sport].length} games</span>
    <select id="f-sort"><option value="time">Sort: Time</option><option value="picks">Sort: Most picks</option></select>`;
  main.appendChild(sortRow);
  sortRow.querySelector('#f-sort').value = s.sort;
  sortRow.querySelector('#f-sort').onchange = e=>{ s.sort=e.target.value; render(); };

  let games = ALLGAMES[sport].filter(g=>passesFilters(sport,g));
  if(!games.length){
    const div = document.createElement('div'); div.className='empty-note'; div.textContent='No games match the current filters.';
    main.appendChild(div); return;
  }

  if(s.sort==='picks'){
    games = games.slice().sort((a,b)=> totalTakers(b)-totalTakers(a));
    games.forEach(g=>main.appendChild(renderGameCard(sport,g)));
  } else {
    games = games.slice().sort((a,b)=> a.date-b.date);
    let lastDay = null;
    games.forEach(g=>{
      const dayLabel = g.timeIsReal ? fmtKickoff(g).split(',')[0] + ' ' + fmtKickoff(g).split(' ')[1].replace(',','') : 'Date TBD';
      const dayKey = g.timeIsReal ? g.dateKey : 'tbd';
      if(dayKey!==lastDay){
        const h = document.createElement('div'); h.className='day-header'; h.textContent = dayLabel;
        main.appendChild(h); lastDay = dayKey;
      }
      main.appendChild(renderGameCard(sport,g));
    });
  }
}

function totalTakers(g){ return g.pickGroups.reduce((n,pg)=>n+pg.takers.length,0); }

function renderGameCard(sport, g){
  const s = S[sport];
  const div = document.createElement('div'); div.className='game';
  const head = document.createElement('div'); head.className='game-head';
  const anyVisiblePick = visiblePickGroups(sport,g).length>0;
  const autoExpand = s.excludedExperts.size>0 && anyVisiblePick;
  const isOpen = s.openGames.has(g.id) || autoExpand;
  head.innerHTML = `<div><div class="game-teams">${g.t1} @ ${g.t2}</div>
    <div class="game-meta">${fmtKickoff(g)}${g.network?' on '+g.network:''} &middot; ${totalTakers(g)} picks</div></div>`;
  head.onclick = ()=>{ if(s.openGames.has(g.id)) s.openGames.delete(g.id); else s.openGames.add(g.id); render(); };
  div.appendChild(head);

  const body = document.createElement('div'); body.className='game-body'+(isOpen?' open':'');
  const pro = g.pro||{};
  if(pro.grade1 || pro.sharpAction1 || pro.betPct1){
    const strip = document.createElement('div'); strip.className='pro-strip';
    let parts = [];
    // Every team-split stat is labeled with the actual team name, not a bare "X%/Y%" pair --
    // a bare pair forces the reader to guess which side is which. Team1/Team2 always refer to
    // the same order the game's own header uses (g.t1 @ g.t2), so this stays consistent with it.
    if(pro.betPct1) parts.push(`<b>Bets:</b> ${g.t1} ${pro.betPct1} / ${g.t2} ${pro.betPct2||'-'}`);
    if(pro.moneyPct1) parts.push(`<b>Money:</b> ${g.t1} ${pro.moneyPct1} / ${g.t2} ${pro.moneyPct2||'-'}`);
    if(pro.grade1) parts.push(`<b>Grade:</b> ${g.t1} ${pro.grade1} / ${g.t2} ${pro.grade2||'-'}`);
    if(pro.bestLine1) parts.push(`<b>Line:</b> ${g.t1} ${pro.bestLine1} ${pro.bestJuice1||''} / ${g.t2} ${pro.bestLine2||''} ${pro.bestJuice2||''}`);
    if(pro.diff) parts.push(`<b>Bets/Money Diff:</b> ${pro.diff}`);
    strip.innerHTML = parts.join('<span style="opacity:.4">&nbsp;|&nbsp;</span>');
    body.appendChild(strip);
  }
  const groups = visiblePickGroups(sport,g);
  if(!groups.length){
    const e = document.createElement('div'); e.className='empty-note'; e.style.padding='10px 0'; e.textContent='No picks from included experts.';
    body.appendChild(e);
  }
  groups.forEach(pg=>{
    const row = document.createElement('div'); row.className='pick-row';
    const isStarred = s.myPlays.has(playKey(sport,g,pg.text));
    const who = pg.takers.length===1
      ? `<span>${pg.takers[0].analyst}</span>`
      : `<span class="pick-who" data-n="${pg.takers.length}">${pg.takers.length} takers<span class="badge">tap</span><div class="takers-list">${pg.takers.map(t=>t.analyst).join(', ')}</div></span>`;
    row.innerHTML = `<div><div class="pick-text">${pg.text}</div>${who}</div>
      <span class="pick-star">${isStarred?'★':'☆'}</span>`;
    const whoEl = row.querySelector('.pick-who');
    if(whoEl) whoEl.onclick = (e)=>{ e.stopPropagation(); whoEl.classList.toggle('expanded'); };
    row.querySelector('.pick-star').onclick = (e)=>{
      e.stopPropagation();
      const k = playKey(sport,g,pg.text);
      if(s.myPlays.has(k)) s.myPlays.delete(k); else s.myPlays.add(k);
      saveMyPlays(sport); render();
    };
    body.appendChild(row);
  });
  div.appendChild(body);
  return div;
}

function renderMyPlays(main, sport){
  const s = S[sport];
  const title = document.createElement('div'); title.className='day-header'; title.textContent='My Plays — '+sport.toUpperCase();
  main.appendChild(title);
  let found = 0;
  ALLGAMES[sport].forEach(g=>{
    g.pickGroups.forEach(pg=>{
      const k = playKey(sport,g,pg.text);
      if(!s.myPlays.has(k)) return;
      found++;
      const row = document.createElement('div'); row.className='game'; row.style.marginBottom='8px';
      row.innerHTML = `<div class="game-head" style="cursor:default">
        <div><div class="game-teams">${g.t1} @ ${g.t2}</div>
        <div class="game-meta">${fmtKickoff(g)} &middot; ${pg.text}</div></div>
        <span class="star-btn">★</span></div>`;
      row.querySelector('.star-btn').onclick = ()=>{ s.myPlays.delete(k); saveMyPlays(sport); render(); };
      main.appendChild(row);
    });
  });
  if(!found){ const e=document.createElement('div'); e.className='empty-note'; e.textContent='No starred plays yet for '+sport.toUpperCase()+'.'; main.appendChild(e); }

  const exportBox = document.createElement('div'); exportBox.className='data-box';
  exportBox.innerHTML = `<h3>Export / Import</h3>
    <button id="mp-export">Export ${sport.toUpperCase()} My Plays (JSON)</button>
    <input type="file" id="mp-import" accept=".json" style="display:block;margin-top:10px">`;
  main.appendChild(exportBox);
  exportBox.querySelector('#mp-export').onclick = ()=>{
    const blob = new Blob([JSON.stringify([...s.myPlays])], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = sport+'_myplays.json'; a.click();
  };
  exportBox.querySelector('#mp-import').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ try{ const arr = JSON.parse(reader.result); arr.forEach(k=>s.myPlays.add(k)); saveMyPlays(sport); render(); }catch(err){ alert('Invalid file'); } };
    reader.readAsText(file);
  };
}

function renderDataTab(main, sport){
  const box = document.createElement('div'); box.className='data-box';
  box.innerHTML = `<h3>Load fresh data</h3>
    <p class="status-line">Loading a file merges into ${sport.toUpperCase()} only — the two sports never cross-contaminate.</p>
    <input type="file" id="dl-cfb-file" accept=".json" style="display:none">
    <button id="load-cfb">Load CFB picks.json</button><br>
    <input type="file" id="dl-nfl-file" accept=".json" style="display:none">
    <button id="load-nfl" style="margin-left:8px">Load NFL picks.json</button>
    <div class="status-line" id="load-status"></div>`;
  main.appendChild(box);
  const cfbFile = box.querySelector('#dl-cfb-file'), nflFile = box.querySelector('#dl-nfl-file');
  box.querySelector('#load-cfb').onclick = ()=>cfbFile.click();
  box.querySelector('#load-nfl').onclick = ()=>nflFile.click();
  function handleLoad(sportKey, file){
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const raw = JSON.parse(reader.result);
        DATA[sportKey].raw = raw;
        // rebuild alias table fresh from the new action_by_game
        const al = {};
        (raw.action_by_game && raw.action_by_game.rows || []).forEach(r=>{
          if(r.Team1Abbrev && r.Team1) al[r.Team1Abbrev.toUpperCase()] = r.Team1;
          if(r.Team2Abbrev && r.Team2) al[r.Team2Abbrev.toUpperCase()] = r.Team2;
        });
        Object.assign(DATA[sportKey].alias, al);
        ALLGAMES[sportKey] = build(sportKey);
        box.querySelector('#load-status').textContent = `Loaded fresh ${sportKey.toUpperCase()} data — ${ALLGAMES[sportKey].length} games.`;
        render();
      }catch(err){ box.querySelector('#load-status').textContent = 'Failed to parse file: '+err.message; }
    };
    reader.readAsText(file);
  }
  cfbFile.onchange = e=>{ if(e.target.files[0]) handleLoad('cfb', e.target.files[0]); };
  nflFile.onchange = e=>{ if(e.target.files[0]) handleLoad('nfl', e.target.files[0]); };

  const note = document.createElement('div'); note.className='expert-note';
  note.innerHTML = 'Loaded from the pipeline\'s <code>picks.json</code> / <code>nfl_picks.json</code> output. See project knowledge for the weekly workflow.';
  main.appendChild(note);
}

document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{ currentSport=b.dataset.sport; render(); });
document.querySelectorAll('.mtab').forEach(b=>b.onclick=()=>{ currentView=b.dataset.view; render(); });

render();
</script>
